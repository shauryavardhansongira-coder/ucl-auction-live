<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCL Auction — Players</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0f1216;
      --panel: #161b22;
      --line: #2a323d;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --accent: #4c8dff;
      --row2: #151a21;
      --hover: #1d2530;
      --hd: #1b2230;
      --err: #d9534f;
      --ok: #3fb950;
      --warn: #c8922a;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #d9dee5;
        --text: #1a1f26;
        --muted: #5b6672;
        --accent: #1f6feb;
        --row2: #f2f4f8;
        --hover: #e9eef6;
        --hd: #eef1f5;
        --err: #c9302c;
        --ok: #1a7f37;
        --warn: #9a6700;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .toolbar input[type=search] {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
    }

    .toolbar select,
    .mf-btn {
      padding: 6px 10px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Multi-select filter */
    .mf {
      position: relative;
    }

    .mf-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      min-width: 210px;
      max-height: 340px;
      overflow: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }

    .mf-panel[hidden] {
      display: none;
    }

    .mf-quick {
      display: flex;
      gap: 12px;
      padding: 2px 6px 6px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .mf-quick a {
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }

    .mf-panel label {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .mf-panel label:hover {
      background: var(--hover);
    }

    /* View segmented control */
    .viewseg {
      display: flex;
    }

    .viewseg button {
      padding: 6px 9px;
      font-size: 12px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      border-left-width: 0;
      cursor: pointer;
    }

    .viewseg button:first-child {
      border-left-width: 1px;
      border-radius: 6px 0 0 6px;
    }

    .viewseg button:last-child {
      border-radius: 0 6px 6px 0;
    }

    .viewseg button.on {
      color: var(--text);
      background: var(--hd);
      font-weight: 700;
    }

    /* Top-level app tabs — Auction vs Teams. The one real navigation choice in
     the app, so a little bolder than the in-toolbar segmented controls. */
    .apptabs {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: var(--hd);
      border-bottom: 1px solid var(--line);
    }

    .apptabs button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .apptabs button:hover {
      color: var(--text);
    }

    .apptabs button.on {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
    }

    .apptabs .kbd {
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 3px;
    }

    .apptabs button.on .kbd {
      color: var(--muted);
    }

    .auctionview {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .auctionview[hidden] {
      display: none;
    }

    /* Teams view — dense, side-by-side squads for reviewing between lots. */
    .teamsview {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 10px;
      padding: 10px;
      background: var(--bg);
    }

    .teamsview[hidden] {
      display: none;
    }

    .team-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .team-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .team-photo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg);
      display: block;
      flex: none;
    }

    .team-initials {
      display: flex;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .team-head-info {
      min-width: 0;
    }

    .team-name {
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-summary {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .team-summary .flag-warn {
      color: var(--warn);
      font-weight: 700;
    }

    .team-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .team-posgrp-head {
      display: flex;
      justify-content: space-between;
      padding: 3px 10px;
      background: var(--hd);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
      border-top: 1px solid var(--line);
    }

    .team-posgrp-head .cnt {
      font-variant-numeric: tabular-nums;
    }

    .team-posgrp-head .cnt.flag-warn {
      color: var(--warn);
    }

    .team-posgrp-head .cnt.flag-err {
      color: var(--err);
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      font-size: 12px;
    }

    .team-row .cr {
      width: 14px;
      height: 14px;
      object-fit: contain;
      flex: none;
    }

    .team-row .cr-txt {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      flex: none;
      min-width: 14px;
    }

    .team-row .nm {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-row .club {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80px;
    }

    .team-row .price {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      flex: none;
    }

    .team-empty-slot {
      padding: 3px 10px 6px;
      font-size: 11px;
      font-style: italic;
      color: var(--muted);
    }

    .team-foot {
      border-top: 1px solid var(--line);
      padding: 7px 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .team-stats-row {
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
    }

    .team-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .team-club-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .team-club-badge.flag-err {
      color: var(--err);
      border-color: var(--err);
      font-weight: 700;
    }

    .team-club-badge.muted {
      color: var(--muted);
      font-style: italic;
      border-style: dashed;
    }

    /* Wallet bar — always visible, glanceable from across a table */
    .walletbar {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .walletbar:focus {
      outline: none;
    }

    .mgr {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 4px 8px 5px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      min-width: 0;
    }

    .mgr-key {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 3px;
      line-height: 1.35;
    }

    .mgr-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 16px;
    }

    /* max bid is the number managers actually need mid-auction — keep it the loudest thing in the card */
    .mgr-maxbid {
      font-size: 23px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      margin-top: 1px;
    }

    .mgr-maxbid.full {
      font-size: 13px;
      color: var(--ok);
      font-weight: 700;
    }

    .mgr-maxbid.belowmin {
      color: var(--err);
    }

    .mgr-rem {
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .mgr-slots {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .mgr.full .mgr-slots {
      color: var(--ok);
      font-weight: 700;
    }

    /* reserved always, whether or not a player is selected — height is explicit
     so the line never collapses and the card doesn't resize on selection */
    .mgr-pos {
      height: 14px;
      line-height: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .mgr-pos.atcap {
      color: var(--warn);
    }

    .walletbar.pick .mgr {
      cursor: pointer;
    }

    .walletbar.pick .mgr:hover {
      border-color: var(--accent);
    }

    .mgr.picked {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .mgr.blocked {
      opacity: .45;
    }

    .mgr.blocked .mgr-maxbid {
      color: var(--err);
    }

    /* Current lot panel — the big, high-contrast display driving the bidding itself.
     The player card and manager cards are always fully built (with the last-shown
     content, or bootstrap placeholders before any selection) and only ever get
     visibility:hidden when empty — never display:none / removed children — so the
     panel's rendered height can never differ between the two states. */
    .lotpanel {
      position: relative;
      display: flex;
      gap: 18px;
      align-items: stretch;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .lot-empty-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--panel);
      pointer-events: none;
    }

    .lot-empty-msg[hidden] {
      display: none;
    }

    .lot-player {
      display: flex;
      gap: 14px;
      align-items: center;
      flex: 0 0 auto;
      min-width: 260px;
    }

    .lot-player.blank,
    .lot-mgrs.blank {
      visibility: hidden;
    }

    .lot-photo-wrap {
      flex: none;
      width: 88px;
      height: 88px;
    }

    .lot-photo {
      width: 88px;
      height: 88px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }

    .lot-photo-txt {
      display: flex;
      width: 88px;
      height: 88px;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 22px;
      font-weight: 800;
      color: var(--muted);
    }

    .lot-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .lot-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lot-sub {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .lot-sub .cr {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    .lot-stats {
      display: flex;
      gap: 16px;
      margin-top: 2px;
    }

    .lot-stat {
      display: flex;
      flex-direction: column;
    }

    .lot-stat b {
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .lot-stat span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
    }

    /* Manager photo cards — photo, name, and this lot's position count. Nothing else.
     Laid out horizontally (photo beside text, not stacked above it) so the card's
     natural height stays under the player photo's 88px — the panel's height is
     set by that photo either way, so a taller card here would only add dead
     space instead of giving it back to the player list. */
    .lot-mgrs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(120px, 1fr);
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .lot-mgr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      min-width: 0;
    }

    .lot-mgr.picked {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }

    .lot-mgr-photo {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg);
      display: block;
      flex: none;
    }

    .lot-mgr-initials {
      display: flex;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      flex: none;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }

    .lot-mgr-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .lot-mgr-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      max-width: 100%;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* position + count/limit on one line — a bare number means nothing without
     knowing which position or what the cap is */
    .lot-mgr-pos {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .lot-mgr-pos-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--muted);
    }

    .lot-mgr-pos-num {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .lot-mgr-pos-num.atcap {
      color: var(--warn);
    }

    /* Assignment bar */
    .assignbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      min-height: 34px;
    }

    .assignbar .hint {
      color: var(--muted);
    }

    .assignbar:not(.sel) .selwrap {
      display: none;
    }

    .assignbar.sel .idlehint {
      display: none;
    }

    .selwrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .assign-player {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .assign-player .meta {
      color: var(--muted);
      font-weight: 400;
    }

    .price-label {
      color: var(--muted);
    }

    input.price {
      width: 74px;
      margin-left: 4px;
      padding: 4px 8px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
    }

    input.price:disabled {
      opacity: .6;
    }

    .assignbar button {
      padding: 4px 9px;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
    }

    .assignbar button.primary {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .assignbar button[disabled] {
      opacity: .4;
      cursor: default;
    }

    .assign-err {
      color: var(--err);
      font-weight: 600;
    }

    .assign-err:empty {
      display: none;
    }

    .assign-warn {
      color: var(--warn);
      font-weight: 600;
    }

    .assign-warn:empty {
      display: none;
    }

    /* Table */
    .main {
      flex: 1;
      overflow: auto;
    }

    /* border-collapse:collapse + position:sticky rows is a known Chrome/WebKit
     compositing bug: collapsed borders are painted on a layer that can peek
     through a sticky row at certain scroll offsets, showing a hairline
     sliver of the row behind it. Separate borders (each cell paints its own
     edge, nothing shared) avoids that layer entirely. */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--hd);
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      cursor: default;
      contain: paint;
    }

    tbody td {
      padding: 3px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr.r {
      cursor: pointer;
      background: var(--bg);
    }

    tbody tr.r:hover {
      background: var(--hover);
    }

    tbody tr.r.alt {
      background: var(--row2);
    }

    tbody tr.r.hi td {
      background: var(--accent);
      color: #fff;
    }

    tbody tr.r.hi td .nm,
    tbody tr.r.hi td .meta,
    tbody tr.r.hi td .mark {
      color: #fff;
    }

    tbody tr.r.soldrow {
      cursor: default;
    }

    tbody tr.r.soldrow td {
      opacity: .5;
    }

    tr.grp td {
      /* Sit 1px into the real header rather than flush against it. thead's
       cells and this cell are each their own composited sticky layer, and
       Chrome/WebKit round their fractional positions to device pixels
       independently — even a computed 0px gap between them can still show
       a 1-device-pixel seam (a sliver of the row behind), because the two
       layers' roundings aren't guaranteed to agree. An intentional 1px
       overlap removes the seam outright: there's always something opaque
       covering that pixel regardless of which way either layer rounds.
       Padding is bumped by the same 1px so the label text doesn't shift. */
      position: sticky;
      top: calc(var(--th-h, 28px) - 1px);
      z-index: 4;
      background: var(--panel);
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 6px 8px 5px;
      border-bottom: 1px solid var(--line);
      contain: paint;
    }

    th.num,
    td.num,
    td.val {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.val {
      font-weight: 700;
    }

    .ph {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }

    .ph-txt {
      display: flex;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
    }

    .nmwrap {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      max-width: 100%;
    }

    .nmwrap .nm {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mark {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .mark:empty {
      display: none;
    }

    .mark.unsold {
      color: var(--warn);
    }

    .mark.sold {
      color: var(--accent);
    }

    .club {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .cr {
      width: 16px;
      height: 16px;
      object-fit: contain;
      flex: none;
    }

    .cr-txt {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      flex: none;
      min-width: 16px;
    }

    .club .nm {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pos {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    .err {
      margin: 24px auto;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--err);
      border-left: 4px solid var(--err);
      border-radius: 8px;
      padding: 16px 18px;
    }

    .err h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--err);
    }

    .err p {
      margin: 6px 0;
    }

    .err ul {
      margin: 10px 0 0;
      padding-left: 18px;
      max-height: 360px;
      overflow: auto;
    }

    .err li {
      margin: 2px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    "use strict";

    /* ============================================================
       CONFIG — league rules live here. Logic below reads from this
       object only; nothing about "four managers" or the numbers is
       hardcoded, so a different league = edit this block alone.
       ============================================================ */
    const CONFIG = {
      managers: [
        { name: "Name1", photo: "assets/managers/1.jpg" },
        { name: "Name2", photo: "assets/managers/2.jpg" },
        { name: "Name3", photo: "assets/managers/3.jpg" },
        { name: "Name4", photo: "assets/managers/4.jpg" }
      ],
      startingBudget: 200,
      squadSize: 15,
      minBid: 1,
      positionOrder: ["GK", "DEF", "MID", "FWD"],
      positionLimits: { GK: [1, 2], DEF: [3, 5], MID: [3, 5], FWD: [2, 4] },
      maxPerClub: 3,
      imageUrls: {
        player: "https://img.uefa.com/imgml/TP/players/1/2027/324x324/{id}.jpg",
        club: "https://img.uefa.com/imgml/TP/teams/logos/140x140/{id}.png"
      }
    };

    /* ---------- helpers ---------- */

    // Case- and accent-insensitive fold (so "Kovacic" matches "Kovačić").
    function norm(s) {
      return (s == null ? "" : String(s))
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase();
    }

    // Build an image URL from a CONFIG template, or null if the template
    // (or the id) is missing — caller then renders the text fallback.
    function imgUrl(tpl, id) {
      if (!tpl || id == null || id === "") return null;
      return tpl.replace("{id}", encodeURIComponent(id));
    }

    // Stable hue per position string — no position names hardcoded.
    function hueOf(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h % 360;
    }

    // One or two initials from a manager's name, for the photo fallback block.
    function initialsOf(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return "?";
    }

    // Evenly spread, distinct fallback colour per manager index — works for any
    // league size, not just four.
    function managerColor(i) {
      return `hsl(${(i * 137.508) % 360} 55% 38%)`;
    }

    function isNum(v) { return typeof v === "number" && !isNaN(v); }
    function fmtInt(v) { return isNum(v) ? String(v) : "·"; }
    function fmtVal(v) { return isNum(v) ? v.toFixed(1) : "·"; }
    function fmtMoney(v) { return isNum(v) ? String(v) : "·"; }

    const app = document.getElementById("app");

    /* ---------- error screen ---------- */

    function showError(title, lines) {
      app.replaceChildren();
      const box = document.createElement("div");
      box.className = "err";
      const h = document.createElement("h2");
      h.textContent = title;
      box.appendChild(h);
      const ul = document.createElement("ul");
      for (const ln of lines) {
        const li = document.createElement("li");
        li.textContent = ln;
        ul.appendChild(li);
      }
      box.appendChild(ul);
      app.appendChild(box);
    }

    /* ---------- load ---------- */

    fetch("players.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " fetching players.json"); return r.json(); })
      .then(init)
      .catch(err => {
        showError("Could not load players.json", [
          String((err && err.message) || err),
          "If you opened this file directly (file://), the browser blocks local fetch.",
          "Serve this folder over HTTP instead, e.g.:  python3 -m http.server",
          "then open  http://localhost:8000/index.html"
        ]);
      });

    /* ---------- validation ---------- */

    const REQUIRED = ["id", "name", "club", "position", "value"];

    function validate(data) {
      if (!Array.isArray(data)) return ["players.json is not a JSON array."];
      const problems = [];
      data.forEach((p, i) => {
        const missing = REQUIRED.filter(k => {
          const v = p == null ? undefined : p[k];
          if (k === "value") return !isNum(v);
          return typeof v !== "string" || v.trim() === "";
        });
        if (missing.length) {
          const id = p && p.id ? p.id : "?";
          const nm = p && p.name ? p.name : "?";
          problems.push(`Row ${i} (id ${id}, name "${nm}"): missing or invalid — ${missing.join(", ")}`);
        }
      });
      return problems;
    }

    /* ---------- init ---------- */

    function init(data) {
      const problems = validate(data);
      if (problems.length) {
        const shown = problems.slice(0, 60);
        if (problems.length > 60) shown.push(`…and ${problems.length - 60} more`);
        showError(`players.json failed validation — ${problems.length} problem${problems.length > 1 ? "s" : ""}`, shown);
        return;
      }
      buildUI(data);
    }

    /* ============================================================
       UI
       ============================================================ */

    function buildUI(ALL) {
      /* precompute per-record search/sort keys (records themselves untouched) */
      ALL.forEach(p => {
        p._s = norm((p.name || "") + " " + (p.fullName || ""));
        p._n = norm(p.name || "");
      });

      /* ---- managers: an array so league size = CONFIG only ---- */
      const MANAGERS = CONFIG.managers.map((raw, i) => ({
        id: i,
        name: (raw && raw.name && String(raw.name).trim()) || ("Manager " + (i + 1)),
        photo: (raw && raw.photo) || null
      }));

      function walletOf(m) {
        let spent = 0, slots = 0;
        for (const p of ALL) {
          if (p.status === "sold" && p.owner === m.id) {
            spent += Number(p.price) || 0;
            slots++;
          }
        }
        return { spent, slots, remaining: CONFIG.startingBudget - spent };
      }

      // Most they can spend on the next lot while still filling every remaining
      // slot at minBid. slotsLeft <= 0 → squad full. Result < minBid → can't bid.
      function computeBid(m) {
        const w = walletOf(m);
        const slotsLeft = CONFIG.squadSize - w.slots;
        if (slotsLeft <= 0) return { ...w, slotsLeft, maxBid: null, state: "full" };
        const maxBid = slotsLeft === 1 ? w.remaining : w.remaining - (slotsLeft - 1) * CONFIG.minBid;
        return { ...w, slotsLeft, maxBid, state: maxBid < CONFIG.minBid ? "belowmin" : "normal" };
      }

      function posCountOf(m, pos) {
        let n = 0;
        for (const p of ALL) if (p.status === "sold" && p.owner === m.id && p.position === pos) n++;
        return n;
      }

      /* ---- selection / assignment state ---- */
      let SELECTED = null;          // the player being assigned, or null
      let phase = "browse";         // "browse" | "price" | "manager"
      let pendingManager = null;    // index into MANAGERS during "manager" phase
      let pendingPrice = null;      // validated price, set when leaving "price"
      let view = "available";       // "available" | "unsold" | "all"
      let viewList = [];            // players currently shown, in row order
      let hi = -1;                  // keyboard highlight index into viewList
      let hiRow = null;             // <tr> currently carrying .hi

      /* positions: CONFIG.positionOrder drives display order only;
         anything present in the data but not listed is appended. */
      const dataPos = [...new Set(ALL.map(p => p.position))];
      const ORDERED_POS = [
        ...CONFIG.positionOrder.filter(p => dataPos.includes(p)),
        ...dataPos.filter(p => !CONFIG.positionOrder.includes(p)).sort((a, b) => a.localeCompare(b))
      ];
      const POS_IDX = {};
      ORDERED_POS.forEach((p, i) => { POS_IDX[p] = i; });

      /* clubs derived from the data */
      const CLUBS = [...new Set(ALL.map(p => p.club))].sort((a, b) => a.localeCompare(b));

      /* which optional numeric columns have any real (non-zero) data */
      const OPT = [
        { key: "value", label: "Val", title: "UEFA fantasy value" },
        { key: "points", label: "Pts", title: "Last season — points" },
        { key: "goals", label: "G", title: "Last season — goals" },
        { key: "assists", label: "A", title: "Last season — assists" },
        { key: "mins", label: "Min", title: "Last season — minutes" }
      ];
      const hasData = key => ALL.some(p => isNum(p[key]) && p[key] !== 0);

      /* column model for the table */
      const COLS = [
        { key: "photo", label: "", w: "38px", render: photoCell },
        { key: "name", label: "Name", w: "", render: nameCell },
        { key: "club", label: "Club", w: "170px", render: clubCell },
        { key: "position", label: "Pos", w: "54px", render: posCell }
      ];
      for (const o of OPT) {
        if (!hasData(o.key)) continue;
        const width = o.key === "value" || o.key === "points" || o.key === "mins" ? "52px" : "38px";
        COLS.push({
          key: o.key, label: o.label, title: o.title, w: width, num: true,
          render: p => o.key === "value" ? fmtVal(p.value) : fmtInt(p[o.key])
        });
      }
      const NCOL = COLS.length;

      /* ---------- cell renderers ---------- */

      function textFallback(p) {
        const s = document.createElement("span");
        s.className = "ph-txt";
        s.textContent = p.clubCode || norm(p.club).slice(0, 3).toUpperCase();
        return s;
      }

      function photoCell(p) {
        const photoU = imgUrl(CONFIG.imageUrls.player, p.id);
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);

        if (photoU) {
          const img = new Image(26, 26);
          img.className = "ph";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () {
            this.onerror = null;               // stop loops before swapping
            if (crestU) {
              const c = new Image(26, 26);
              c.className = "ph";
              c.loading = "lazy";
              c.referrerPolicy = "no-referrer";
              c.alt = "";
              c.onerror = function () { this.onerror = null; this.replaceWith(textFallback(p)); };
              c.src = crestU;
              this.replaceWith(c);
            } else {
              this.replaceWith(textFallback(p));
            }
          };
          img.src = photoU;
          return img;
        }
        if (crestU) {
          const c = new Image(26, 26);
          c.className = "ph";
          c.loading = "lazy";
          c.referrerPolicy = "no-referrer";
          c.alt = "";
          c.onerror = function () { this.onerror = null; this.replaceWith(textFallback(p)); };
          c.src = crestU;
          return c;
        }
        return textFallback(p);
      }

      function nameCell(p) {
        const wrap = document.createElement("span");
        wrap.className = "nmwrap";
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = p.name;
        if (p.fullName && p.fullName !== p.name) nm.title = p.fullName;
        const mark = document.createElement("span");
        mark.className = "mark";
        p._mark = mark;                         // updated per render to show sold/unsold
        wrap.append(nm, mark);
        return wrap;
      }

      function clubCell(p) {
        const wrap = document.createElement("div");
        wrap.className = "club";
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        if (crestU) {
          const i = new Image(16, 16);
          i.className = "cr";
          i.loading = "lazy";
          i.referrerPolicy = "no-referrer";
          i.alt = "";
          i.onerror = function () {
            this.onerror = null;
            const s = document.createElement("span");
            s.className = "cr-txt";
            s.textContent = p.clubCode || "";
            this.replaceWith(s);
          };
          i.src = crestU;
          wrap.appendChild(i);
        } else {
          const s = document.createElement("span");
          s.className = "cr-txt";
          s.textContent = p.clubCode || "";
          wrap.appendChild(s);
        }
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = p.club;
        wrap.appendChild(nm);
        return wrap;
      }

      function posCell(p) {
        const b = document.createElement("span");
        b.className = "pos";
        b.textContent = p.position;
        b.style.background = `hsl(${hueOf(p.position)} 52% 40%)`;
        return b;
      }

      /* ---------- build one <tr> per record, once ---------- */

      for (const p of ALL) {
        const tr = document.createElement("tr");
        tr.className = "r";
        for (const c of COLS) {
          const td = document.createElement("td");
          if (c.num) td.className = c.key === "value" ? "val" : "num";
          const out = c.render(p);
          if (out instanceof Node) td.appendChild(out);
          else td.textContent = out;
          tr.appendChild(td);
        }
        tr.addEventListener("click", () => selectPlayer(p));
        p._row = tr;
      }

      /* ---------- toolbar ---------- */

      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Search name…  (accent-insensitive)";
      search.autocomplete = "off";
      search.spellcheck = false;

      const clubFilter = multiFilter("Club", CLUBS);
      const posFilter = multiFilter("Pos", ORDERED_POS);

      const sortSel = document.createElement("select");
      const sortOpts = [["group", "Grouped by position"]];
      if (COLS.some(c => c.key === "value")) sortOpts.push(["value", "Value ↓"]);
      if (COLS.some(c => c.key === "points")) sortOpts.push(["points", "Points ↓"]);
      sortOpts.push(["name", "Name ↑"]);
      for (const [v, t] of sortOpts) {
        const o = document.createElement("option");
        o.value = v; o.textContent = "Sort: " + t;
        sortSel.appendChild(o);
      }

      const viewSeg = document.createElement("div");
      viewSeg.className = "viewseg";
      [["available", "Available"], ["unsold", "Unsold"], ["all", "All"]].forEach(([v, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.dataset.v = v;
        if (v === view) b.className = "on";
        b.addEventListener("click", () => {
          view = v;
          [...viewSeg.children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
          refresh();
        });
        viewSeg.appendChild(b);
      });

      const count = document.createElement("span");
      count.className = "count";

      toolbar.append(search, clubFilter.el, posFilter.el, sortSel, viewSeg, count);

      /* ---------- wallet bar ---------- */

      const walletBar = document.createElement("div");
      walletBar.className = "walletbar";
      walletBar.tabIndex = -1;                  // focus target while picking a manager
      const mgrCards = MANAGERS.map((m, i) => {
        const c = document.createElement("div");
        c.className = "mgr";
        const key = document.createElement("span");
        key.className = "mgr-key";
        key.textContent = i < 9 ? String(i + 1) : "·";
        const name = document.createElement("span");
        name.className = "mgr-name";
        name.textContent = m.name;
        const mb = document.createElement("span");
        mb.className = "mgr-maxbid";
        const rem = document.createElement("span");
        rem.className = "mgr-rem";
        const slots = document.createElement("span");
        slots.className = "mgr-slots";
        const pos = document.createElement("span");
        pos.className = "mgr-pos";
        c.append(key, name, mb, rem, slots, pos);
        c._mb = mb;
        c._rem = rem;
        c._slots = slots;
        c._pos = pos;
        c.addEventListener("click", () => onCardClick(i));
        return c;
      });
      walletBar.append(...mgrCards);

      /* ---------- current lot panel ---------- */
      //
      // Budget, max bid and slots live only in the wallet strip above (single
      // source of truth). This panel is purely the "what's up for bid right now"
      // view: the player, and — per manager — just a photo, name, and how many
      // of this position they already hold.
      //
      // The player card and the manager cards are built once and always fully
      // populated (real content when a lot is selected, bootstrap placeholder
      // content before the first selection); deselecting only toggles
      // visibility:hidden. Nothing is ever emptied or display:none'd, so the
      // panel's rendered height is identical in both states by construction —
      // no magic min-height numbers to keep in sync.

      const lotPanel = document.createElement("div");
      lotPanel.className = "lotpanel";

      const lotEmpty = document.createElement("div");
      lotEmpty.className = "lot-empty-msg";
      lotEmpty.textContent = "No player selected — pick one from the list below to see bidding details.";

      const lotPlayer = document.createElement("div");
      lotPlayer.className = "lot-player blank";
      const lotPhotoWrap = document.createElement("div");
      lotPhotoWrap.className = "lot-photo-wrap";
      const lotInfo = document.createElement("div");
      lotInfo.className = "lot-info";
      const lotName = document.createElement("div");
      lotName.className = "lot-name";
      const lotSub = document.createElement("div");
      lotSub.className = "lot-sub";
      const lotStats = document.createElement("div");
      lotStats.className = "lot-stats";
      lotInfo.append(lotName, lotSub, lotStats);
      lotPlayer.append(lotPhotoWrap, lotInfo);

      const lotMgrs = document.createElement("div");
      lotMgrs.className = "lot-mgrs blank";
      const lotMgrCards = MANAGERS.map(m => {
        const c = document.createElement("div");
        c.className = "lot-mgr";
        const photoWrap = document.createElement("div");
        photoWrap.className = "lot-mgr-photo-wrap";
        renderManagerPhoto(photoWrap, m);
        const nm = document.createElement("div");
        nm.className = "lot-mgr-name";
        nm.textContent = m.name;
        const poslabel = document.createElement("span");
        poslabel.className = "lot-mgr-pos-label";
        poslabel.textContent = ORDERED_POS[0] || "POS";   // bootstrap value — reserves the line's height before any real selection
        const poscount = document.createElement("span");
        poscount.className = "lot-mgr-pos-num";
        poscount.textContent = "0";
        const posRow = document.createElement("div");
        posRow.className = "lot-mgr-pos";
        posRow.append(poslabel, poscount);
        const info = document.createElement("div");
        info.className = "lot-mgr-info";
        info.append(nm, posRow);
        c.append(photoWrap, info);
        c._poslabel = poslabel;
        c._pos = poscount;
        return c;
      });
      lotMgrs.append(...lotMgrCards);

      lotPanel.append(lotEmpty, lotPlayer, lotMgrs);

      // Shared manager photo (+ colour-coded initials fallback) — used by both
      // the lot panel's manager cards and the teams view's headers, at whatever
      // size/class each context needs.
      function renderManagerPhoto(wrap, m, opts) {
        const photoClass = (opts && opts.photoClass) || "lot-mgr-photo";
        const initialsClass = (opts && opts.initialsClass) || "lot-mgr-initials";
        const size = (opts && opts.size) || 64;
        function initialsBlock() {
          const s = document.createElement("div");
          s.className = initialsClass;
          s.textContent = initialsOf(m.name);
          s.style.background = managerColor(m.id);
          return s;
        }
        if (m.photo) {
          const img = new Image(size, size);
          img.className = photoClass;
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () { this.onerror = null; this.replaceWith(initialsBlock()); };
          img.src = m.photo;
          wrap.appendChild(img);
          return;
        }
        wrap.appendChild(initialsBlock());
      }

      function renderLotPhoto(wrap, p) {
        wrap.replaceChildren();
        const photoU = imgUrl(CONFIG.imageUrls.player, p.id);
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        function textFb() {
          const s = document.createElement("div");
          s.className = "lot-photo-txt";
          s.textContent = p.clubCode || norm(p.club).slice(0, 3).toUpperCase();
          return s;
        }
        if (photoU) {
          const img = new Image(88, 88);
          img.className = "lot-photo";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () {
            this.onerror = null;
            if (crestU) {
              const c = new Image(88, 88);
              c.className = "lot-photo";
              c.loading = "lazy";
              c.referrerPolicy = "no-referrer";
              c.alt = "";
              c.onerror = function () { this.onerror = null; this.replaceWith(textFb()); };
              c.src = crestU;
              this.replaceWith(c);
            } else {
              this.replaceWith(textFb());
            }
          };
          img.src = photoU;
          wrap.appendChild(img);
          return;
        }
        if (crestU) {
          const c = new Image(88, 88);
          c.className = "lot-photo";
          c.loading = "lazy";
          c.referrerPolicy = "no-referrer";
          c.alt = "";
          c.onerror = function () { this.onerror = null; this.replaceWith(textFb()); };
          c.src = crestU;
          wrap.appendChild(c);
          return;
        }
        wrap.appendChild(textFb());
      }

      // Fills the player card with real content — called for the actual
      // selection, and once at startup with a placeholder to seed height.
      function populateLotPlayer(p) {
        renderLotPhoto(lotPhotoWrap, p);
        lotName.textContent = p.name;

        lotSub.replaceChildren();
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        if (crestU) {
          const i = new Image(15, 15);
          i.className = "cr";
          i.loading = "lazy";
          i.referrerPolicy = "no-referrer";
          i.alt = "";
          i.onerror = function () { this.remove(); };
          i.src = crestU;
          lotSub.appendChild(i);
        }
        const clubSpan = document.createElement("span");
        clubSpan.textContent = p.club;
        const posBadge = document.createElement("span");
        posBadge.className = "pos";
        posBadge.textContent = p.position;
        posBadge.style.background = `hsl(${hueOf(p.position)} 52% 40%)`;
        lotSub.append(clubSpan, posBadge);

        lotStats.replaceChildren();
        const statDefs = [
          ["Value", fmtVal(p.value)],
          ["Points", fmtInt(p.points)],
          ["Goals", fmtInt(p.goals)],
          ["Assists", fmtInt(p.assists)],
          ["Mins", fmtInt(p.mins)]
        ];
        for (const [label, val] of statDefs) {
          const d = document.createElement("div");
          d.className = "lot-stat";
          const b = document.createElement("b");
          b.textContent = val;
          const s = document.createElement("span");
          s.textContent = label;
          d.append(b, s);
          lotStats.appendChild(d);
        }
      }

      // Seed with a placeholder so the very first (empty) paint already has the
      // panel's true rendered height — see block comment above.
      populateLotPlayer({
        name: "Player Name", club: "Club", position: ORDERED_POS[0] || "POS",
        value: 0, points: 0, goals: 0, assists: 0, mins: 0, clubId: null, id: null, clubCode: ""
      });

      function renderLotPanel() {
        lotEmpty.hidden = !!SELECTED;
        lotPlayer.classList.toggle("blank", !SELECTED);
        lotMgrs.classList.toggle("blank", !SELECTED);
        if (!SELECTED) return;      // last-shown content stays underneath, just hidden

        populateLotPlayer(SELECTED);

        const cap = CONFIG.positionLimits[SELECTED.position] || [0, 0];
        const capMax = cap[1] || 0;

        MANAGERS.forEach((m, i) => {
          const card = lotMgrCards[i];
          card._poslabel.textContent = SELECTED.position;
          const pc = posCountOf(m, SELECTED.position);
          card._pos.textContent = capMax > 0 ? `${pc}/${capMax}` : `${pc}`;
          card._pos.classList.toggle("atcap", capMax > 0 && pc >= capMax);
          card.classList.toggle("picked", phase === "manager" && pendingManager === i);
        });
      }

      /* ---------- assignment bar ---------- */

      const assignBar = document.createElement("div");
      assignBar.className = "assignbar";
      assignBar.dataset.phase = "browse";

      const idleHint = document.createElement("span");
      idleHint.className = "hint idlehint";
      idleHint.textContent = "Select a player  ·  ↑↓ move  ·  Enter pick  ·  U unsold  ·  Esc cancel";

      const playerBox = document.createElement("span");
      playerBox.className = "assign-player";

      const priceLabel = document.createElement("label");
      priceLabel.className = "price-label";
      priceLabel.textContent = "Price";
      const priceInput = document.createElement("input");
      priceInput.type = "text";
      priceInput.className = "price";
      priceInput.inputMode = "decimal";
      priceInput.autocomplete = "off";
      priceInput.placeholder = "≥" + CONFIG.minBid;
      priceLabel.appendChild(priceInput);

      const stepHint = document.createElement("span");
      stepHint.className = "hint step";

      const confirmBtn = document.createElement("button");
      confirmBtn.type = "button";
      confirmBtn.className = "primary";
      confirmBtn.textContent = "Confirm ⏎";
      const unsoldBtn = document.createElement("button");
      unsoldBtn.type = "button";
      unsoldBtn.textContent = "Unsold (U)";
      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.textContent = "Cancel (Esc)";

      const assignErr = document.createElement("span");
      assignErr.className = "assign-err";
      assignErr.setAttribute("role", "status");
      assignErr.setAttribute("aria-live", "polite");

      const assignWarn = document.createElement("span");
      assignWarn.className = "assign-warn";
      assignWarn.setAttribute("role", "status");
      assignWarn.setAttribute("aria-live", "polite");

      const selWrap = document.createElement("span");
      selWrap.className = "selwrap";
      selWrap.append(playerBox, priceLabel, stepHint, confirmBtn, unsoldBtn, cancelBtn);

      assignBar.append(idleHint, selWrap, assignWarn, assignErr);

      /* ---------- table shell ---------- */

      const main = document.createElement("div");
      main.className = "main";
      const table = document.createElement("table");

      const colgroup = document.createElement("colgroup");
      for (const c of COLS) {
        const col = document.createElement("col");
        if (c.w) col.style.width = c.w;
        colgroup.appendChild(col);
      }
      table.appendChild(colgroup);

      const thead = document.createElement("thead");
      const htr = document.createElement("tr");
      for (const c of COLS) {
        const th = document.createElement("th");
        th.textContent = c.label;
        if (c.num) th.className = "num";
        if (c.title) th.title = c.title;
        htr.appendChild(th);
      }
      thead.appendChild(htr);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      table.appendChild(tbody);
      main.appendChild(table);

      /* ---------- app tabs (Auction / Teams) ---------- */

      let appView = "auction";

      const auctionView = document.createElement("div");
      auctionView.className = "auctionview";
      auctionView.append(toolbar, walletBar, lotPanel, assignBar, main);

      const apptabs = document.createElement("div");
      apptabs.className = "apptabs";
      const tabDefs = [["auction", "Auction"], ["teams", "Teams"]];
      const tabBtns = tabDefs.map(([key, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        const kbd = document.createElement("span");
        kbd.className = "kbd";
        kbd.textContent = "(T)";
        if (key === "teams") b.appendChild(kbd);
        b.dataset.view = key;
        b.addEventListener("click", () => setView(key));
        return b;
      });
      apptabs.append(...tabBtns);

      /* ---------- teams view ---------- */
      //
      // Dense, all-squads-at-once review screen: photo/name/budget summary up
      // top per manager, full squad grouped by position, then per-position and
      // per-club counts flagged against CONFIG limits. Built once with a fixed
      // set of DOM nodes (position groups, badge rows) that renderTeams() only
      // ever updates the text/classes of — same "always fully built, never
      // torn down" approach as the lot panel, so there's nothing to be blank
      // before the first sale.

      const teamsView = document.createElement("div");
      teamsView.className = "teamsview";
      teamsView.hidden = true;

      const teamCols = MANAGERS.map(m => {
        const col = document.createElement("div");
        col.className = "team-col";

        const head = document.createElement("div");
        head.className = "team-head";
        const photoWrap = document.createElement("div");
        photoWrap.className = "team-photo-wrap";
        renderManagerPhoto(photoWrap, m, { photoClass: "team-photo", initialsClass: "team-initials", size: 40 });
        const headInfo = document.createElement("div");
        headInfo.className = "team-head-info";
        const nameEl = document.createElement("div");
        nameEl.className = "team-name";
        nameEl.textContent = m.name;
        const summary = document.createElement("div");
        summary.className = "team-summary";
        headInfo.append(nameEl, summary);
        head.append(photoWrap, headInfo);

        const body = document.createElement("div");
        body.className = "team-body";
        const posGroups = ORDERED_POS.map(pos => {
          const gh = document.createElement("div");
          gh.className = "team-posgrp-head";
          const ghLabel = document.createElement("span");
          ghLabel.textContent = pos;
          const ghCount = document.createElement("span");
          ghCount.className = "cnt";
          gh.append(ghLabel, ghCount);
          const rowsWrap = document.createElement("div");
          rowsWrap.className = "team-posgrp-rows";
          body.append(gh, rowsWrap);
          return { pos, ghCount, rowsWrap };
        });

        const foot = document.createElement("div");
        foot.className = "team-foot";
        const statsRow = document.createElement("div");
        statsRow.className = "team-stats-row";
        const clubBadges = document.createElement("div");
        clubBadges.className = "team-badge-row";
        foot.append(statsRow, clubBadges);

        col.append(head, body, foot);
        return { m, col, summary, posGroups, statsRow, clubBadges };
      });
      teamsView.append(...teamCols.map(t => t.col));

      function renderTeams() {
        teamCols.forEach(({ m, summary, posGroups, statsRow, clubBadges }) => {
          const w = walletOf(m);
          const squad = ALL.filter(p => p.status === "sold" && p.owner === m.id);

          const slotsFlagged = w.slots > CONFIG.squadSize;
          const slotsSpan = document.createElement("span");
          slotsSpan.className = slotsFlagged ? "flag-warn" : "";
          slotsSpan.textContent = `${w.slots}/${CONFIG.squadSize} slots`;
          summary.replaceChildren(document.createTextNode(`${fmtMoney(w.remaining)} left · `), slotsSpan);

          posGroups.forEach(({ pos, ghCount, rowsWrap }) => {
            const inPos = squad.filter(p => p.position === pos).sort((a, b) => a._n.localeCompare(b._n));
            const lim = CONFIG.positionLimits[pos] || [0, 0];
            const min = lim[0] || 0, max = lim[1] || 0;
            const n = inPos.length;
            ghCount.textContent = max > 0 ? `${n}/${max}` : String(n);
            ghCount.classList.toggle("flag-err", max > 0 && n > max);
            ghCount.classList.toggle("flag-warn", !(max > 0 && n > max) && min > 0 && n < min);

            rowsWrap.replaceChildren();
            if (!inPos.length) {
              const e = document.createElement("div");
              e.className = "team-empty-slot";
              e.textContent = "— none yet —";
              rowsWrap.appendChild(e);
            } else {
              for (const p of inPos) {
                const row = document.createElement("div");
                row.className = "team-row";
                const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
                if (crestU) {
                  const i = new Image(14, 14);
                  i.className = "cr";
                  i.loading = "lazy";
                  i.referrerPolicy = "no-referrer";
                  i.alt = "";
                  i.onerror = function () {
                    this.onerror = null;
                    const s = document.createElement("span");
                    s.className = "cr-txt";
                    s.textContent = p.clubCode || "";
                    this.replaceWith(s);
                  };
                  i.src = crestU;
                  row.appendChild(i);
                } else {
                  const s = document.createElement("span");
                  s.className = "cr-txt";
                  s.textContent = p.clubCode || "";
                  row.appendChild(s);
                }
                const nmEl = document.createElement("span");
                nmEl.className = "nm";
                nmEl.textContent = p.name;
                const clubEl = document.createElement("span");
                clubEl.className = "club";
                clubEl.textContent = p.club;
                const priceEl = document.createElement("span");
                priceEl.className = "price";
                priceEl.textContent = fmtMoney(p.price);
                row.append(nmEl, clubEl, priceEl);
                rowsWrap.appendChild(row);
              }
            }
          });

          const avg = w.slots > 0 ? (w.spent / w.slots).toFixed(1) : "–";
          const pct = ((w.spent / CONFIG.startingBudget) * 100).toFixed(0);
          statsRow.textContent = `Spent ${fmtMoney(w.spent)} · Avg ${avg} · ${pct}% of budget`;

          const clubCounts = new Map();
          for (const p of squad) clubCounts.set(p.club, (clubCounts.get(p.club) || 0) + 1);
          clubBadges.replaceChildren();
          const entries = [...clubCounts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          for (const [club, n] of entries) {
            const b = document.createElement("span");
            b.className = "team-club-badge";
            const sample = squad.find(p => p.club === club);
            b.textContent = `${(sample && sample.clubCode) || club} ×${n}`;
            if (CONFIG.maxPerClub > 0 && n > CONFIG.maxPerClub) b.classList.add("flag-err");
            clubBadges.appendChild(b);
          }
          if (!entries.length) {
            const e = document.createElement("span");
            e.className = "team-club-badge muted";
            e.textContent = "No players yet";
            clubBadges.appendChild(e);
          }
        });
      }

      function setView(v) {
        if (v === appView) return;
        if (v !== "auction" && SELECTED) cancelSelection();
        appView = v;
        auctionView.hidden = v !== "auction";
        teamsView.hidden = v !== "teams";
        tabBtns.forEach(b => b.classList.toggle("on", b.dataset.view === v));
        if (v === "teams") renderTeams();
        if (v === "auction") search.focus();
      }
      tabBtns[0].classList.add("on");

      app.replaceChildren(apptabs, auctionView, teamsView);

      // Sticky group headers sit just below the real header row. Two things
      // were wrong before: (1) the measurement used the <tr>, but the sticky
      // element is the <th> CELL (`thead th { position:sticky }`) — a row's own
      // box can differ fractionally from its cells' in table layout; (2)
      // rounding the result (up OR down) makes the offset wrong by construction
      // — CSS `top` accepts fractional px, so rounding either overlaps the
      // group header into the real header (too small) or, as it did here,
      // leaves a persistent hairline gap once stuck that shows a sliver of the
      // row behind it (too large). Use the exact fractional value, unrounded.
      const thBottom = htr.firstElementChild.getBoundingClientRect().bottom - main.getBoundingClientRect().top;
      document.documentElement.style.setProperty("--th-h", thBottom + "px");

      /* ---------- render (list) ---------- */

      const VIEW_PRED = {
        available: p => p.status === "available",
        unsold: p => p.status === "unsold",
        all: () => true
      };

      // preserveScroll: true for a refresh that doesn't change *which* players
      // match (an assignment/unsold/cancel just happened) — keeps the current
      // scroll position untouched. false (search/sort/filter changed) resets
      // the highlight to row 0 and scrolls it into view, as before.
      function render(opts) {
        const preserveScroll = !!(opts && opts.preserveScroll);
        const q = norm(search.value.trim());
        const cs = clubFilter.selected;
        const ps = posFilter.selected;
        const inView = VIEW_PRED[view];

        const list = ALL.filter(p =>
          inView(p) &&
          (cs.size === 0 || cs.has(p.club)) &&
          (ps.size === 0 || ps.has(p.position)) &&
          (q === "" || p._s.includes(q))
        );

        const mode = sortSel.value;
        const byName = (a, b) => a._n.localeCompare(b._n);
        if (mode === "group") {
          list.sort((a, b) =>
            (POS_IDX[a.position] - POS_IDX[b.position]) ||
            ((b.value || 0) - (a.value || 0)) ||
            byName(a, b));
        } else if (mode === "value") {
          list.sort((a, b) => ((b.value || 0) - (a.value || 0)) || byName(a, b));
        } else if (mode === "points") {
          list.sort((a, b) => ((b.points || 0) - (a.points || 0)) || byName(a, b));
        } else {
          list.sort(byName);
        }

        let groupCount = null;
        if (mode === "group") {
          groupCount = {};
          for (const p of list) groupCount[p.position] = (groupCount[p.position] || 0) + 1;
        }

        const frag = document.createDocumentFragment();
        let alt = false;
        let curPos = null;
        for (const p of list) {
          if (mode === "group" && p.position !== curPos) {
            curPos = p.position;
            alt = false;
            const gtr = document.createElement("tr");
            gtr.className = "grp";
            const gtd = document.createElement("td");
            gtd.colSpan = NCOL;
            gtd.textContent = `${curPos} · ${groupCount[curPos]}`;
            gtr.appendChild(gtd);
            frag.appendChild(gtr);
          }
          // status marker inside the name cell
          const mk = p._mark;
          if (mk) {
            if (p.status === "sold") {
              const mgr = MANAGERS[p.owner];
              mk.textContent = "→ " + (mgr ? mgr.name : "?") + " " + fmtMoney(p.price);
              mk.className = "mark sold";
            } else if (p.status === "unsold") {
              mk.textContent = "UNSOLD";
              mk.className = "mark unsold";
            } else {
              mk.textContent = "";
              mk.className = "mark";
            }
          }
          p._row.classList.toggle("soldrow", p.status === "sold");
          p._row.classList.toggle("alt", alt);
          alt = !alt;
          frag.appendChild(p._row);
        }

        tbody.replaceChildren(frag);

        if (!list.length) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.className = "empty";
          td.colSpan = NCOL;
          td.textContent = q || cs.size || ps.size
            ? "No players match the current filters."
            : (view === "unsold" ? "No unsold players yet." : "Nothing to show.");
          tr.appendChild(td);
          tbody.appendChild(tr);
        }

        viewList = list;
        if (preserveScroll) {
          // same filters, just refreshed data — keep pointing at roughly the
          // same slot (clamped, in case the list got shorter) without scrolling
          hi = viewList.length ? Math.min(hi, viewList.length - 1) : -1;
          applyHi(false);
        } else {
          hi = viewList.length ? 0 : -1;
          applyHi(true);
        }

        let nAvail = 0, nSold = 0, nUnsold = 0;
        for (const p of ALL) {
          if (p.status === "available") nAvail++;
          else if (p.status === "sold") nSold++;
          else if (p.status === "unsold") nUnsold++;
        }
        count.textContent = `${list.length} shown · ${nAvail} avail · ${nSold} sold · ${nUnsold} unsold`;

        renderWallets();
      }

      function applyHi(scroll) {
        if (hiRow) hiRow.classList.remove("hi");
        hiRow = viewList[hi] ? viewList[hi]._row : null;
        if (hiRow) {
          hiRow.classList.add("hi");
          if (scroll) hiRow.scrollIntoView({ block: "nearest" });
        }
      }

      function moveHi(d) {
        if (!viewList.length) return;
        hi = Math.max(0, Math.min(viewList.length - 1, hi + d));
        applyHi(true);
      }

      /* ---------- wallets ---------- */

      function renderWallets() {
        const picking = SELECTED && (phase === "price" || phase === "manager");
        walletBar.classList.toggle("pick", !!picking);
        const cap = SELECTED ? (CONFIG.positionLimits[SELECTED.position] || [0, 0]) : null;
        const capMax = cap ? (cap[1] || 0) : 0;
        MANAGERS.forEach((m, i) => {
          const w = computeBid(m);
          const c = mgrCards[i];
          c._mb.textContent = w.state === "full" ? "FULL" : fmtMoney(w.maxBid);
          c._mb.classList.toggle("full", w.state === "full");
          c._mb.classList.toggle("belowmin", w.state === "belowmin");
          c._rem.textContent = w.remaining + " left";
          c._slots.textContent = w.slots + "/" + CONFIG.squadSize;
          c.classList.toggle("full", w.slots >= CONFIG.squadSize);
          // reserved even when blank (fix CSS on .mgr-pos keeps the line's height constant)
          if (SELECTED) {
            const pc = posCountOf(m, SELECTED.position);
            c._pos.textContent = capMax > 0 ? `${SELECTED.position} ${pc}/${capMax}` : `${SELECTED.position} ${pc}`;
            c._pos.classList.toggle("atcap", capMax > 0 && pc >= capMax);
          } else {
            c._pos.textContent = "";
            c._pos.classList.remove("atcap");
          }
          let blocked = false;
          if (phase === "manager" && pendingPrice != null) {
            blocked = w.slots >= CONFIG.squadSize || pendingPrice > w.remaining;
          }
          c.classList.toggle("blocked", blocked);
          c.classList.toggle("picked", pendingManager === i);
        });
        renderLotPanel();
        renderTeams();
      }

      /* ---------- assignment bar render ---------- */

      function renderAssignBar() {
        if (!SELECTED) {
          assignBar.classList.remove("sel");
          assignWarn.textContent = "";
          return;
        }
        assignBar.classList.add("sel");

        playerBox.replaceChildren();
        playerBox.appendChild(photoCell(SELECTED));
        const nm = document.createElement("span");
        nm.textContent = SELECTED.name;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = ` ${SELECTED.position} · ${SELECTED.club} · ${fmtVal(SELECTED.value)}`;
        playerBox.append(nm, meta);

        priceInput.disabled = phase === "manager";
        stepHint.textContent = phase === "price"
          ? "type price → Enter"
          : `1–${MANAGERS.length} pick manager → Enter confirm`;
        confirmBtn.disabled = !(phase === "manager" && pendingManager != null);

        assignWarn.textContent = "";
        confirmBtn.textContent = "Confirm ⏎";
        if (phase === "manager" && pendingManager != null && pendingPrice != null) {
          const m = MANAGERS[pendingManager];
          const w = computeBid(m);
          if (w.state !== "full" && pendingPrice <= w.remaining && w.maxBid != null && pendingPrice > w.maxBid) {
            const slotsAfter = w.slotsLeft - 1;
            const leftAfter = w.remaining - pendingPrice;
            const avg = slotsAfter > 0 ? (leftAfter / slotsAfter).toFixed(1) : leftAfter;
            assignWarn.textContent =
              `⚠ ${pendingPrice} exceeds ${m.name}'s max bid (${w.maxBid}) — leaves ${leftAfter} for ` +
              `${slotsAfter} slot${slotsAfter === 1 ? "" : "s"} (avg ${avg}, min ${CONFIG.minBid}).`;
            confirmBtn.textContent = "Confirm anyway ⏎";
          }
        }
      }

      /* ---------- assignment actions ---------- */

      function setPhase(p) { phase = p; assignBar.dataset.phase = p; }

      function selectPlayer(p) {
        if (!p || p.status === "sold") return;      // sold players are not re-assignable here
        SELECTED = p;
        pendingManager = null;
        pendingPrice = null;
        setPhase("price");
        priceInput.value = "";
        assignErr.textContent = "";
        renderAssignBar();
        renderWallets();
        priceInput.focus();
      }

      function commitPrice() {
        if (!SELECTED) return;
        const raw = priceInput.value.trim();
        const price = Number(raw);
        if (raw === "" || !Number.isFinite(price)) { assignErr.textContent = "Enter a price."; return; }
        if (price < CONFIG.minBid) { assignErr.textContent = `Price must be a number ≥ ${CONFIG.minBid}.`; return; }
        pendingPrice = price;
        assignErr.textContent = "";
        setPhase("manager");
        renderWallets();
        renderAssignBar();
        walletBar.focus();
      }

      function pickManager(i) {
        if (!SELECTED || phase !== "manager") return;
        pendingManager = i;
        assignErr.textContent = "";
        renderWallets();
        renderAssignBar();
      }

      function confirmAssignment() {
        if (!SELECTED || phase !== "manager") return;
        if (pendingManager == null) { assignErr.textContent = `Pick a manager (1–${MANAGERS.length}).`; return; }
        const m = MANAGERS[pendingManager];
        const w = walletOf(m);
        if (w.slots >= CONFIG.squadSize) {
          assignErr.textContent = `${m.name}'s squad is full (${CONFIG.squadSize}/${CONFIG.squadSize}).`;
          return;
        }
        if (pendingPrice > w.remaining) {
          assignErr.textContent = `${pendingPrice} over budget — ${m.name} has ${w.remaining} left.`;
          return;
        }
        SELECTED.owner = m.id;
        SELECTED.price = pendingPrice;
        SELECTED.status = "sold";
        endSelection(true);
      }

      function markUnsold() {
        if (!SELECTED) return;
        SELECTED.status = "unsold";
        SELECTED.owner = null;
        SELECTED.price = null;
        endSelection(true);
      }

      function cancelSelection() {
        if (!SELECTED) return;
        endSelection(false);
      }

      function endSelection(clearSearch) {
        SELECTED = null;
        pendingManager = null;
        pendingPrice = null;
        setPhase("browse");
        priceInput.value = "";
        priceInput.disabled = false;
        assignErr.textContent = "";
        if (clearSearch) search.value = "";
        renderAssignBar();
        // Keep the current scroll position — this refresh is just picking up
        // the sold/unsold status change, not a new search/sort/filter. Without
        // this, every confirm/unsold/cancel reset the highlight to row 0 and
        // dragged the whole list back toward the top mid-auction.
        render({ preserveScroll: true });
        search.focus();
      }

      function onCardClick(i) {
        // mouse path: one click commits to that manager (validates first)
        if (!SELECTED) return;
        if (phase === "price") { commitPrice(); if (phase !== "manager") return; }
        pendingManager = i;
        confirmAssignment();
      }

      function refresh() {
        if (SELECTED) cancelSelection();
        else render();
      }

      /* ---------- keyboard routing ---------- */

      // Selection owns the keyboard once a player is picked.
      function routeKey(e) {
        if (phase === "browse") return;
        if (e.key === "Escape") { e.preventDefault(); cancelSelection(); return; }
        if (e.key === "u" || e.key === "U") { e.preventDefault(); markUnsold(); return; }

        if (phase === "price") {
          if (e.key === "Enter") { e.preventDefault(); commitPrice(); }
          return;                              // digits / . / backspace fall through to the input
        }

        if (phase === "manager") {
          if (e.key === "Enter") { e.preventDefault(); confirmAssignment(); return; }
          if (e.key === "Backspace") {         // step back to editing the price
            e.preventDefault();
            pendingManager = null;
            setPhase("price");
            renderWallets();
            renderAssignBar();
            priceInput.focus();
            priceInput.select();
            return;
          }
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= MANAGERS.length) { e.preventDefault(); pickManager(n - 1); }
        }
      }
      document.addEventListener("keydown", routeKey);

      // View toggle — guarded against text-entry fields so it never hijacks a
      // search query or price ("Toni Kroos" types a literal "t" into search).
      function isTypingTarget(el) {
        if (!el) return false;
        const tag = el.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
      }
      document.addEventListener("keydown", e => {
        if (isTypingTarget(e.target)) return;
        if (e.key === "t" || e.key === "T") {
          e.preventDefault();
          setView(appView === "teams" ? "auction" : "teams");
        }
      });

      /* ---------- wiring ---------- */

      search.addEventListener("input", () => { if (phase === "browse") render(); });
      search.addEventListener("keydown", e => {
        if (phase !== "browse") return;
        if (e.key === "ArrowDown") { e.preventDefault(); moveHi(1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); moveHi(-1); }
        else if (e.key === "Enter") { e.preventDefault(); if (viewList[hi]) selectPlayer(viewList[hi]); }
        else if (e.key === "Escape") { if (search.value) { search.value = ""; render(); } }
      });

      sortSel.addEventListener("change", refresh);
      clubFilter.onChange = refresh;
      posFilter.onChange = refresh;

      confirmBtn.addEventListener("click", () => confirmAssignment());
      unsoldBtn.addEventListener("click", () => markUnsold());
      cancelBtn.addEventListener("click", () => cancelSelection());

      render();
      search.focus();
    }

    /* ---------- multi-select filter (checkbox dropdown) ---------- */

    function multiFilter(label, values) {
      const api = { selected: new Set(), onChange: null };

      const wrap = document.createElement("div");
      wrap.className = "mf";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mf-btn";

      const panel = document.createElement("div");
      panel.className = "mf-panel";
      panel.hidden = true;

      const quick = document.createElement("div");
      quick.className = "mf-quick";
      const allLink = document.createElement("a");
      allLink.textContent = "All";
      const clrLink = document.createElement("a");
      clrLink.textContent = "Clear";
      quick.append(allLink, clrLink);
      panel.appendChild(quick);

      const boxes = [];
      for (const v of values) {
        const l = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = v;
        const sp = document.createElement("span");
        sp.textContent = v;
        l.append(cb, sp);
        panel.appendChild(l);
        boxes.push(cb);
        cb.addEventListener("change", () => {
          if (cb.checked) api.selected.add(v); else api.selected.delete(v);
          syncLabel();
          if (api.onChange) api.onChange();
        });
      }

      function syncLabel() {
        btn.textContent = api.selected.size ? `${label} (${api.selected.size}) ▾` : `${label} ▾`;
      }
      function setAll(on) {
        api.selected.clear();
        for (const cb of boxes) {
          cb.checked = on;
          if (on) api.selected.add(cb.value);
        }
        syncLabel();
        if (api.onChange) api.onChange();
      }

      allLink.addEventListener("click", () => setAll(true));
      clrLink.addEventListener("click", () => setAll(false));

      btn.addEventListener("click", e => {
        e.stopPropagation();
        document.querySelectorAll(".mf-panel").forEach(p => { if (p !== panel) p.hidden = true; });
        panel.hidden = !panel.hidden;
      });
      panel.addEventListener("click", e => e.stopPropagation());
      document.addEventListener("click", () => { panel.hidden = true; });
      document.addEventListener("keydown", e => { if (e.key === "Escape") panel.hidden = true; });

      syncLabel();
      wrap.append(btn, panel);
      api.el = wrap;
      return api;
    }
  </script>
