        if (seat.uid) return Promise.reject(new Error(`The ${seat.name} seat is already taken.`));
        return fb.update(fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}`), {
          [`seats/${req.seat}`]: { manager: seat.manager, name: seat.name, uid },
          [`requests/${uid}`]: null
        });
      }

      function rejectRequest(uid) {
        if (!fb) return Promise.resolve();
        return fb.remove(requestRef(uid));
      }

      // Release: drop the device, keep the seat. Manager, name — and so every
      // wallet, squad and price derived from that manager index — are
      // untouched; only the holder changes. `open` is what lets the next
      // device take it without coming back to the host.
      function releaseSeat(seatId) {
        const seat = L.seats[seatId];
        if (!fb || !seat) return Promise.reject(new Error("That seat no longer exists."));
        return fb.set(seatRef(seatId), { manager: seat.manager, name: seat.name, open: true });
      }

      // The host is a manager too, so it needs a way to sit down. Host writes
      // to seats are unconditional under the rules, so this covers both an
      // untouched seat and a released one.
      function takeSeatAsHost(seatId) {
        const seat = L.seats[seatId];
        if (!fb || !L.uid) return Promise.reject(new Error("Not signed in yet."));
        if (!seat) return Promise.reject(new Error("That seat no longer exists."));
        return fb.set(seatRef(seatId), { manager: seat.manager, name: seat.name, uid: L.uid });
      }

      function mySeatId() {
        if (!L.uid) return null;
        for (const id in L.seats) {
          const s = L.seats[id];
          if (s && s.uid === L.uid) return id;
        }
        return null;
      }

      function mySeat() {
        const id = mySeatId();
        return id ? Object.assign({ id }, L.seats[id]) : null;
      }

      function myRequest() {
        return (L.uid && L.requests && L.requests[L.uid]) || null;
      }

      /* ---- publishing (host) ---- */

      // Never awaited by a caller, never on the keyboard path: the click
      // that sold a player has already repainted by the time this runs.
      function doPublish() {
        publishTimer = null;
        if (!L.enabled || L.lostRoom || !stateRef || !buildPayload) return;
        if (publishInFlight) { publishAgain = true; return; }
        let payload;
        try {
          payload = buildPayload();
        } catch (e) {
          L.publishError = "could not build snapshot (" + errText(e) + ")";
          status();
          return;
        }
        payload.updatedAt = fb.serverTimestamp();
        publishInFlight = true;
        fb.set(stateRef, payload).then(() => {
          L.lastPublishAt = Date.now();
          L.publishError = "";
        }, err => {
          // Surfaced in the status area and nowhere else — a failed mirror
          // must not interrupt an auction that is otherwise fine.
          L.publishError = errText(err);
        }).then(() => {
          publishInFlight = false;
          status();
          if (publishAgain) { publishAgain = false; schedulePublish(); }
        });
      }

      function schedulePublish() {
        if (!L.enabled || L.lostRoom) return;
        clearTimeout(publishTimer);
        publishTimer = setTimeout(doPublish, LIVE_CFG.publishDebounceMs);
      }

      /* ---- viewer ---- */

      async function startViewer() {
        if (!liveConfigured()) { L.reason = "No Firebase config in CONFIG.firebase."; status(); return { ok: false }; }
        if (!L.roomKey) { L.reason = "No room key."; status(); return { ok: false }; }
        try {
          fb = await loadSdk();
          watchConnection();
          L.enabled = true;
          status();

          // Fired and not awaited. Reads need no uid, so a viewer whose
          // sign-in is slow — or blocked outright — still gets the whole
          // auction; it just can't hold a seat until the uid lands. Nothing
          // below this line depends on it.
          startAuth().catch(() => { /* surfaced as L.authError in the seat bar */ });
          watchSeats();

          fb.onValue(fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/state`), snap => {
            L.lastReceiveAt = Date.now();
            L.hasRemote = true;
            if (L.onRemoteState) L.onRemoteState(snap.val());
            status();
          }, err => {
            L.reason = errText(err);
            L.enabled = false;
            status();
          });

          // A connected viewer looking at a room whose host has walked away
          // is still looking at stale data, and the connection dot alone
          // would say "live". This is the other half of that answer.
          fb.onValue(fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/host`), snap => {
            const cur = snap.val();
            L.lastHostBeat = cur && typeof cur.heartbeatAt === "number" ? cur.heartbeatAt : 0;
            recomputeHostPresent();
            status();
          }, () => { L.lastHostBeat = 0; L.hostPresent = false; status(); });

          return { ok: true };
        } catch (e) {
          L.reason = errText(e);
          L.enabled = false;
          status();
          return { ok: false };
        }
      }

      // A host going quiet produces no event at all — the last heartbeat
      // just stops ageing well. So presence is recomputed on the UI's
      // once-a-second tick rather than trusting the last snapshot's
      // verdict forever.
      function recomputeHostPresent() {
        L.hostPresent = !!L.lastHostBeat && (serverNow() - L.lastHostBeat < LIVE_CFG.staleHostMs);
      }

      function refreshDerived() {
        if (L.role !== "viewer" || !L.enabled) return;
        const was = L.hostPresent;
        recomputeHostPresent();
        return was !== L.hostPresent;
      }

      L.startHost = startHost;
      L.startViewer = startViewer;
      L.schedulePublish = schedulePublish;
      L.setPayloadBuilder = fn => { buildPayload = fn; };
      L.refreshDerived = refreshDerived;
      L.serverNow = serverNow;

      L.ensureSeats = ensureSeats;
      L.requestSeat = requestSeat;
      L.cancelRequest = cancelRequest;
      L.claimOpenSeat = claimOpenSeat;
      L.approveRequest = approveRequest;
      L.rejectRequest = rejectRequest;
      L.releaseSeat = releaseSeat;
      L.takeSeatAsHost = takeSeatAsHost;
      L.mySeat = mySeat;
      L.myRequest = myRequest;
      return L;
    }

    const ROLE = detectRole();
    const LIVE = createLive(ROLE.role, ROLE.roomKey);

    /* ---------- load ----------
       Players first (both roles need them: viewers merge the host's
       auction fields onto their own copy of players.json, they are never
       sent the records themselves), then the role-specific handshake. */

    function showLoading(msg) {
      app.replaceChildren();
      const box = document.createElement("div");
      box.className = "err";
      const h = document.createElement("h2");
      h.textContent = msg;
      box.appendChild(h);
      app.appendChild(box);
    }

    fetch("players.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status + " fetching players.json"); return r.json(); })
      .then(bootstrap)
      .catch(err => {
        showError("Could not load players.json", [
          String((err && err.message) || err),
          "If you opened this file directly (file://), the browser blocks local fetch.",
          "Serve this folder over HTTP instead, e.g.:  python3 -m http.server",
          "then open  http://localhost:8000/index.html"
        ]);
      });

    function bootstrap(data) {
      const problems = validate(data);
      if (problems.length) {
        const shown = problems.slice(0, 60);
        if (problems.length > 60) shown.push(`…and ${problems.length - 60} more`);
        showError(`players.json failed validation — ${problems.length} problem${problems.length > 1 ? "s" : ""}`, shown);
        return;
      }
      if (LIVE.role === "host") bootstrapHost(data);
      else bootstrapViewer(data);
    }

    /* ---- host ----
       The room has to be claimed BEFORE the host UI exists. Building the
       full app and only then discovering another host is live would leave
       an operator a keyboard they must not use. */

    function bootstrapHost(data) {
      storeRoomKey(LIVE.roomKey);
      showLoading("Claiming room " + LIVE.roomKey + " …");
      LIVE.startHost().then(res => {
        if (res.ok) { init(data); return; }

        if (res.kind === "conflict") {
          const c = res.conflict || {};
          const since = typeof c.startedAt === "number" ? new Date(c.startedAt).toLocaleTimeString([], { hour12: false }) : null;
          showError(`Room "${LIVE.roomKey}" already has a host`, [
            "Another browser is already driving this auction" + (since ? `, since ${since}` : "") + ".",
            "Two hosts writing to one room would interleave two different versions of the auction into the same state, so this tab will not start as a host.",
            "If that other host is you on another tab or device, close it and reload here — the room frees itself about 20 seconds after a host stops responding.",
            "To start a separate auction instead, load this page with a different room key: ?host=some-other-key",
            "To watch this one read-only: " + viewerUrlFor(LIVE.roomKey)
          ]);
          return;
        }

        // Couldn't reach Firebase at all, so we cannot know whether another
        // host is out there. Running the auction matters more than mirroring
        // it — but that is the operator's call to make explicitly, not ours
        // to make silently.
        // Two different failures land here now — the network, and sign-in.
        // They need different fixes, and "could not reach Firebase" sent
        // someone looking at their wifi when the real answer was a console
        // toggle, so the title follows the error.
        const authFailed = /auth|sign|token|api-key|admin-restricted/i.test(res.message || "");
        showConfirm({
          title: authFailed ? "Could not sign in to Firebase" : "Could not reach Firebase",
          sub: "The auction can still run on this machine with localStorage autosave, but nothing will be mirrored to viewers — and there is no way to check whether another host is already live in this room.",
          lines: [
            res.message || "Connection failed.",
            authFailed ? "Every client now signs in anonymously, so this host cannot claim the room without a uid. Check that Anonymous sign-in is enabled: Firebase console → Authentication → Sign-in method → Anonymous." : null,
            "Room key: " + LIVE.roomKey,
            "Only start offline if you are sure nobody else has this auction open as host."
          ].filter(Boolean),
          buttons: [
            { label: "Retry", kind: "primary", onClick: () => bootstrapHost(data) },
            { label: "Start offline — no mirroring", kind: "danger", onClick: () => { LIVE.reason = res.message || "Could not reach Firebase."; init(data); } }
          ]
        });
      });
    }

    /* ---- viewer ----
       Built immediately from players.json so a phone shows the layout
       (and its own connection status) while the first snapshot is still
       in flight, rather than a blank screen. No localStorage is read and
       none is written: a viewer's only source of truth is the room. */

    function bootstrapViewer(data) {
      if (!LIVE.roomKey) {
        showError("No room to watch", [
          "This link has no room key, so there is nothing to show.",
          "Ask the host for their viewer link — it looks like  " + viewerUrlFor("k7m2xq4bnp83"),
          "This page never bids and never changes the auction; it only mirrors what the host's screen is doing."
        ]);
        return;
      }
      buildUI(data, null);
      LIVE.startViewer();
    }

    /* ---------- validation ---------- */

    const REQUIRED = ["id", "name", "club", "position", "value"];

    function validate(data) {
      if (!Array.isArray(data)) return ["players.json is not a JSON array."];
      const problems = [];
      data.forEach((p, i) => {
        const missing = REQUIRED.filter(k => {
          const v = p == null ? undefined : p[k];
          if (k === "value") return !isNum(v);
          return typeof v !== "string" || v.trim() === "";
        });
        if (missing.length) {
          const id = p && p.id ? p.id : "?";
          const nm = p && p.name ? p.name : "?";
          problems.push(`Row ${i} (id ${id}, name "${nm}"): missing or invalid — ${missing.join(", ")}`);
        }
      });
      return problems;
    }

    /* ---------- init ---------- */

    // Host-only: viewers never read autosaved auction state (see
    // bootstrapViewer). Unchanged otherwise — localStorage is still the
    // crash-recovery path, and Firebase never feeds into it.
    function init(data) {
      const rd = readLocalStorageRaw();
      if (!rd.ok || !rd.raw) { buildUI(data, null); return; }

      let saved = null, parseErr = null;
      try { saved = JSON.parse(rd.raw); } catch (e) { parseErr = e; }

      const shapeErrs = saved ? validateStateShape(saved) : [String((parseErr && parseErr.message) || parseErr || "Could not parse saved data.")];
      if (shapeErrs.length) {
        showConfirm({
          title: "Saved auction data could not be read",
          sub: "Found autosaved data in this browser, but it's corrupted or in an unexpected format. Starting fresh.",
          lines: [...shapeErrs.slice(0, 8), shapeErrs.length > 8 ? `…and ${shapeErrs.length - 8} more` : null,
            "You can download the raw saved text first in case it's manually recoverable."].filter(Boolean),
          buttons: [
            { label: "Download raw backup, then continue", onClick: () => { downloadText(rd.raw, backupFilename(), "application/json"); buildUI(data, null); } },
            { label: "Continue without backup", kind: "danger", onClick: () => buildUI(data, null) }
          ]
        });
        return;
      }

      const currentIds = idSetOf(data);
      const savedIds = idSetOf(saved.players);
      if (setsEqual(currentIds, savedIds)) { buildUI(data, saved); return; }

      showConfirm({
        title: "Saved data doesn't match this player list",
        sub: "The autosaved auction in this browser was built from a different players.json (a different player set) than the one just loaded — likely a different season or export. It will not be merged.",
        lines: [`Saved data: ${saved.players.length} players, ${saved.log.length} log entries, last saved ${saved.savedAt ? new Date(saved.savedAt).toLocaleString() : "at an unknown time"}.`],
        buttons: [
          {
            label: "Export saved data, then continue", kind: "primary", onClick: () => {
              downloadJSON(saved, backupFilename());
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* nothing more we can do */ }
              buildUI(data, null);
            }
          },
          {
            label: "Discard saved data and continue", kind: "danger", onClick: () => {
              try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* nothing more we can do */ }
              buildUI(data, null);
            }
          }
        ]
      });
    }

    /* ============================================================
       UI
       ============================================================ */

    function buildUI(ALL, restore) {
      /* Viewer mode. Everything below is the host's code path; READONLY only
         ever removes things — the mutation entry points, the autosave, the
         keyboard handlers and the controls that reach them. Nothing derived
         is transmitted or special-cased: wallets, max bids, position counts
         and squads are recomputed here from the merged records by exactly
         the same functions the host runs. */
      const READONLY = LIVE.role === "viewer";
      if (READONLY) document.body.classList.add("viewer");

      // Viewer's mirror of the host's last 20 log entries (pre-rendered text,
      // display only — the real log and its undo snapshots stay host-local).
      let REMOTE_LOG = [];
      let warnedPlayerMismatch = false;

      /* precompute per-record search/sort keys (records themselves untouched) */
      ALL.forEach(p => {
        p._s = norm((p.name || "") + " " + (p.fullName || ""));
        p._n = norm(p.name || "");
      });

      /* ---- managers: an array so league size = CONFIG only ---- */
      const MANAGERS = CONFIG.managers.map((raw, i) => ({
        id: i,
        name: (raw && raw.name && String(raw.name).trim()) || ("Manager " + (i + 1)),
        photo: (raw && raw.photo) || null,
        color: (raw && raw.color) || managerColor(i)
      }));

      function walletOf(m) {
        let spent = 0, slots = 0;
        for (const p of ALL) {
          if (p.status === "sold" && p.owner === m.id) {
            spent += Number(p.price) || 0;
            slots++;
          }
        }
        return { spent, slots, remaining: CONFIG.startingBudget - spent };
      }

      // Most they can spend on the next lot while still filling every remaining
      // slot at minBid. slotsLeft <= 0 → squad full. Result < minBid → can't bid.
      function computeBid(m) {
        const w = walletOf(m);
        const slotsLeft = CONFIG.squadSize - w.slots;
        if (slotsLeft <= 0) return { ...w, slotsLeft, maxBid: null, state: "full" };
        const maxBid = slotsLeft === 1 ? w.remaining : w.remaining - (slotsLeft - 1) * CONFIG.minBid;
        return { ...w, slotsLeft, maxBid, state: maxBid < CONFIG.minBid ? "belowmin" : "normal" };
      }

      function posCountOf(m, pos) {
        let n = 0;
        for (const p of ALL) if (p.status === "sold" && p.owner === m.id && p.position === pos) n++;
        return n;
      }

      function clubCountOf(m, club) {
        let n = 0;
        for (const p of ALL) if (p.status === "sold" && p.owner === m.id && p.club === club) n++;
        return n;
      }

      /* ============================================================
         TRANSACTION LOG / UNDO
         ------------------------------------------------------------
         The player records are the single source of truth. Every wallet,
         slot, position and club figure in the UI is derived from them on
         every render — nothing is cached or incrementally adjusted, so
         there is no running total that can drift out of step.

         The log is append-only. Each entry carries the COMPLETE player
         state before and after the change, which makes undo exact by
         construction: undoing is just writing `prev` back, so a reassign
         restores the original owner and an edit restores the original
         price without any per-type reversal logic.

         Action types: sale, unsold, edit_price, reassign, undo — plus
         `release`, which covers both "revert a sale, refund the price"
         and "put an unsold player back in the pool" (the same transition
         from the records' point of view: back to available).
         ============================================================ */

      const BY_ID = new Map(ALL.map(p => [p.id, p]));
      const LOG = [];
      let logSeq = 0;

      // Apply restored state (autosave found on load, or an accepted import)
      // straight onto the freshly loaded records — only status/owner/price
      // are trusted; everything else (name, club, value…) stays whatever
      // players.json says. Every derived figure is then recomputed as usual.
      if (restore) {
        const byId = new Map(restore.players.map(p => [String(p.id), p]));
        for (const p of ALL) {
          const s = byId.get(String(p.id));
          if (s) { p.status = s.status; p.owner = s.owner; p.price = s.price; }
        }
        for (const e of restore.log) LOG.push(e);
        logSeq = LOG.reduce((m, e) => Math.max(m, Number(e.seq) || 0), 0);
      }

      function snapOf(p) {
        return { status: p.status, owner: p.owner, price: p.price };
      }

      function applySnap(p, s) {
        p.status = s.status;
        p.owner = s.owner;
        p.price = s.price;
      }

      // The single choke point for every state change. Mutates, logs, then
      // re-verifies the derived-value invariants. Rendering is left to the
      // caller so a single user action causes exactly one repaint.
      function applyChange(p, next, type, extra) {
        const prev = snapOf(p);
        applySnap(p, next);
        const entry = {
          seq: ++logSeq,
          ts: Date.now(),
          type,
          pid: p.id,
          name: p.name,
          club: p.club,
          position: p.position,
          prev,
          next: snapOf(p),
          undoneBy: null,
          undoOf: (extra && extra.undoOf) || null,
          undoneType: (extra && extra.undoneType) || null
        };
        LOG.push(entry);
        checkInvariants();
        scheduleSave();
        // Mirroring rides along behind the same choke point as autosave, so
        // sale / unsold / edit / reassign / release / undo are all covered by
        // construction. Debounced and fire-and-forget: the keyboard flow never
        // waits on it (see LIVE.schedulePublish).
        LIVE.schedulePublish();
        return entry;
      }

      /* ---- invariant checking ----
         Recomputes every derived quantity straight from the player records,
         by a separate reduction from the one the UI uses, and compares. The
         structural checks are the ones with real teeth: they catch a partial
         mutation (sold with no owner, available that kept its price, a NaN
         price that would silently read as 0 in the wallet sum). */

      let invariantProblems = [];

      function checkInvariants() {
        const problems = [];

        for (const p of ALL) {
          if (p.status === "sold") {
            if (!isNum(p.price)) problems.push(`${p.name}: sold but price is not a number (${String(p.price)}).`);
            if (p.owner == null || !MANAGERS[p.owner]) problems.push(`${p.name}: sold but owner is invalid (${String(p.owner)}).`);
          } else if (p.status === "available" || p.status === "unsold") {
            if (p.owner != null) problems.push(`${p.name}: ${p.status} but still owned by ${String(p.owner)}.`);
            if (p.price != null) problems.push(`${p.name}: ${p.status} but still priced at ${String(p.price)}.`);
          } else {
            problems.push(`${p.name}: unknown status "${String(p.status)}".`);
          }
        }

        for (const m of MANAGERS) {
          let spent = 0, slots = 0;
          const pos = Object.create(null), clubs = Object.create(null);
          for (const p of ALL) {
            if (p.status !== "sold" || p.owner !== m.id) continue;
            spent += Number(p.price) || 0;
            slots++;
            pos[p.position] = (pos[p.position] || 0) + 1;
            clubs[p.club] = (clubs[p.club] || 0) + 1;
          }
          const w = walletOf(m);
          if (CONFIG.startingBudget - spent !== w.remaining) {
            problems.push(`${m.name}: budget invariant broken — ${CONFIG.startingBudget} − ${spent} ≠ ${w.remaining}.`);
          }
          if (spent !== w.spent) problems.push(`${m.name}: spent mismatch — ${spent} vs ${w.spent}.`);
          if (slots !== w.slots) problems.push(`${m.name}: slot count mismatch — ${slots} vs ${w.slots}.`);
          for (const q of ORDERED_POS) {
            if ((pos[q] || 0) !== posCountOf(m, q)) {
              problems.push(`${m.name}: ${q} count mismatch — ${pos[q] || 0} vs ${posCountOf(m, q)}.`);
            }
          }
          for (const c of Object.keys(clubs)) {
            if (clubs[c] !== clubCountOf(m, c)) {
              problems.push(`${m.name}: ${c} count mismatch — ${clubs[c]} vs ${clubCountOf(m, c)}.`);
            }
          }
        }

        invariantProblems = problems;
        renderInvariantBanner();
        return problems;
      }

      /* ---- undo ----
         Walks back through the log to the most recent entry that hasn't been
         undone already. The undo itself is logged (so the history keeps the
         mistake) and is never itself reversible — no redo. */

      function lastReversible() {
        for (let i = LOG.length - 1; i >= 0; i--) {
          const e = LOG[i];
          if (e.type !== "undo" && e.undoneBy == null) return e;
        }
        return null;
      }

      function performUndo() {
        if (READONLY) return;      // undo is host-local; the log here is a copy
        const target = lastReversible();
        if (!target) {
          toast("Nothing to undo — no reversible actions in the log yet.", "warn");
          return;
        }
        const p = BY_ID.get(target.pid);
        if (!p) {
          toast(`Cannot undo #${target.seq} — player record ${target.pid} is missing.`, "warn");
          return;
        }
        if (SELECTED) cancelSelection();
        const entry = applyChange(p, target.prev, "undo", {
          undoOf: target.seq,
          undoneType: target.type
        });
        target.undoneBy = entry.seq;
        toast(`Undid #${target.seq} ${TYPE_LABEL[target.type] || target.type} — ${describeEntry(target)}. ${target.name} is now ${stateWords(p)}.`);
        renderAll();
      }

      /* ---- log entry wording (shared by the log view and undo toasts) ---- */

      const TYPE_LABEL = {
        sale: "sale",
        unsold: "unsold",
        edit_price: "edit price",
        reassign: "reassign",
        release: "release",
        undo: "undo"
      };

      function mgrName(id) {
        const m = id == null ? null : MANAGERS[id];
        return m ? m.name : "—";
      }

      function stateWords(p) {
        if (p.status === "sold") return `${mgrName(p.owner)}'s at ${fmtMoney(p.price)}`;
        if (p.status === "unsold") return "unsold";
        return "available";
      }

      function describeEntry(e) {
        const prevPrice = fmtMoney(e.prev.price);
        const nextPrice = fmtMoney(e.next.price);
        switch (e.type) {
          case "sale":
            return `${e.name} → ${mgrName(e.next.owner)} for ${nextPrice}` +
              (e.prev.status === "unsold" ? " (was unsold)" : "");
          case "unsold":
            return `${e.name} marked unsold` +
              (e.prev.status === "sold" ? ` (was ${mgrName(e.prev.owner)}'s at ${prevPrice})` : "");
          case "edit_price":
            return `${e.name} (${mgrName(e.next.owner)}) price ${prevPrice} → ${nextPrice}`;
          case "reassign":
            return `${e.name} ${mgrName(e.prev.owner)} → ${mgrName(e.next.owner)}` +
              (e.prev.price !== e.next.price ? `, price ${prevPrice} → ${nextPrice}` : ` at ${nextPrice}`);
          case "release":
            return e.prev.status === "sold"
              ? `${e.name} back to available (refunded ${prevPrice} to ${mgrName(e.prev.owner)})`
              : `${e.name} back to available (was unsold)`;
          case "undo":
            return `reversed #${e.undoOf} ${TYPE_LABEL[e.undoneType] || e.undoneType} — ${e.name} restored to ${e.next.status === "sold" ? `${mgrName(e.next.owner)} at ${nextPrice}` : e.next.status}`;
          default:
            return e.name;
        }
      }

      /* ---- selection / assignment state ---- */
      let SELECTED = null;          // the player being assigned, or null
      let phase = "browse";         // "browse" | "price" | "manager"
      let pendingManager = null;    // index into MANAGERS during "manager" phase
      let pendingPrice = null;      // validated price, set when leaving "price"
      let view = "available";       // "available" | "unsold" | "all"
      let viewList = [];            // players currently shown, in row order
      let hi = -1;                  // keyboard highlight index into viewList
      let hiRow = null;             // <tr> currently carrying .hi

      /* positions: CONFIG.positionOrder drives display order only;
         anything present in the data but not listed is appended. */
      const dataPos = [...new Set(ALL.map(p => p.position))];
      const ORDERED_POS = [
        ...CONFIG.positionOrder.filter(p => dataPos.includes(p)),
        ...dataPos.filter(p => !CONFIG.positionOrder.includes(p)).sort((a, b) => a.localeCompare(b))
      ];
      const POS_IDX = {};
      ORDERED_POS.forEach((p, i) => { POS_IDX[p] = i; });

      /* clubs derived from the data */
      const CLUBS = [...new Set(ALL.map(p => p.club))].sort((a, b) => a.localeCompare(b));

      /* which optional numeric columns have any real (non-zero) data */
      const OPT = [
        { key: "value", label: "Val", title: "UEFA fantasy value" },
        { key: "points", label: "Pts", title: "Last season — points" },
        { key: "goals", label: "G", title: "Last season — goals" },
        { key: "assists", label: "A", title: "Last season — assists" },
        { key: "mins", label: "Min", title: "Last season — minutes" }
      ];
      const hasData = key => ALL.some(p => isNum(p[key]) && p[key] !== 0);

      /* column model for the table */
      const COLS = [
        { key: "photo", label: "", w: "42px", render: photoCell },
        { key: "name", label: "Name", w: "180px", render: nameCell },
        { key: "club", label: "Club", w: "170px", render: clubCell },
        { key: "position", label: "Pos", w: "54px", render: posCell }
      ];
      for (const o of OPT) {
        if (!hasData(o.key)) continue;
        const width = o.key === "value" || o.key === "points" || o.key === "mins" ? "52px" : "38px";
        COLS.push({
          key: o.key, label: o.label, title: o.title, w: width, num: true,
          render: p => o.key === "value" ? fmtVal(p.value) : fmtInt(p[o.key])
        });
      }
      // Every column above is a tight, explicit width so name/club/position/
      // stats sit close together as one cluster and end with Min, not a gap
      // before it. A trailing spacer column (no label, no data) absorbs
      // whatever width is left over in this fixed-layout table instead —
      // the slack lands past the last real column, not inside one of them.
      COLS.push({ key: "spacer", label: "", w: "", render: () => "" });
      const NCOL = COLS.length;

      /* ---------- cell renderers ---------- */

      function textFallback(p) {
        const s = document.createElement("span");
        s.className = "ph-txt";
        s.textContent = p.clubCode || norm(p.club).slice(0, 3).toUpperCase();
        return s;
      }

      function photoCell(p) {
        const photoU = imgUrl(CONFIG.imageUrls.player, p.id);
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);

        if (photoU) {
          const img = new Image(26, 26);
          img.className = "ph";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () {
            this.onerror = null;               // stop loops before swapping
            if (crestU) {
              const c = new Image(26, 26);
              c.className = "ph";
              c.loading = "lazy";
              c.referrerPolicy = "no-referrer";
              c.alt = "";
              c.onerror = function () { this.onerror = null; this.replaceWith(textFallback(p)); };
              c.src = crestU;
              this.replaceWith(c);
            } else {
              this.replaceWith(textFallback(p));
            }
          };
          img.src = photoU;
          return img;
        }
        if (crestU) {
          const c = new Image(26, 26);
          c.className = "ph";
          c.loading = "lazy";
          c.referrerPolicy = "no-referrer";
          c.alt = "";
          c.onerror = function () { this.onerror = null; this.replaceWith(textFallback(p)); };
          c.src = crestU;
          return c;
        }
        return textFallback(p);
      }

      function nameCell(p) {
        const wrap = document.createElement("span");
        wrap.className = "nmwrap";
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = p.name;
        if (p.fullName && p.fullName !== p.name) nm.title = p.fullName;
        const mark = document.createElement("span");
        mark.className = "mark";
        p._mark = mark;                         // updated per render to show sold/unsold
        wrap.append(nm, mark);
        return wrap;
      }

      function clubCell(p) {
        const wrap = document.createElement("div");
        wrap.className = "club";
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        if (crestU) {
          const i = new Image(16, 16);
          i.className = "cr";
          i.loading = "lazy";
          i.referrerPolicy = "no-referrer";
          i.alt = "";
          i.onerror = function () {
            this.onerror = null;
            const s = document.createElement("span");
            s.className = "cr-txt";
            s.textContent = p.clubCode || "";
            this.replaceWith(s);
          };
          i.src = crestU;
          wrap.appendChild(i);
        } else {
          const s = document.createElement("span");
          s.className = "cr-txt";
          s.textContent = p.clubCode || "";
          wrap.appendChild(s);
        }
        const nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = p.club;
        wrap.appendChild(nm);
        return wrap;
      }

      function posCell(p) {
        const b = document.createElement("span");
        b.className = "pos";
        b.textContent = p.position;
        b.style.background = `hsl(${hueOf(p.position)} 52% 40%)`;
        return b;
      }

      /* ---------- build one <tr> per record, once ---------- */

      for (const p of ALL) {
        const tr = document.createElement("tr");
        tr.className = "r";
        for (const c of COLS) {
          const td = document.createElement("td");
          if (c.num) td.className = c.key === "value" ? "val" : "num";
          const out = c.render(p);
          if (out instanceof Node) td.appendChild(out);
          else td.textContent = out;
          tr.appendChild(td);
        }
        tr.addEventListener("click", () => selectPlayer(p));
        p._row = tr;
      }

      /* ---------- toolbar ---------- */

      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const search = document.createElement("input");
      search.type = "search";
      search.placeholder = "Search name…  (accent-insensitive)";
      search.autocomplete = "off";
      search.spellcheck = false;

      const clubFilter = multiFilter("Club", CLUBS);
      const posFilter = multiFilter("Pos", ORDERED_POS);

      const sortSel = document.createElement("select");
      const sortOpts = [["group", "Grouped by position"]];
      if (COLS.some(c => c.key === "value")) sortOpts.push(["value", "Value ↓"]);
      if (COLS.some(c => c.key === "points")) sortOpts.push(["points", "Points ↓"]);
      sortOpts.push(["name", "Name ↑"]);
      for (const [v, t] of sortOpts) {
        const o = document.createElement("option");
        o.value = v; o.textContent = "Sort: " + t;
        sortSel.appendChild(o);
      }

      const viewSeg = document.createElement("div");
      viewSeg.className = "viewseg";
      [["available", "Available"], ["unsold", "Unsold"], ["all", "All"]].forEach(([v, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.dataset.v = v;
        if (v === view) b.className = "on";
        b.addEventListener("click", () => {
          view = v;
          [...viewSeg.children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
          refresh();
        });
        viewSeg.appendChild(b);
      });

      const count = document.createElement("span");
      count.className = "count";

      toolbar.append(search, clubFilter.el, posFilter.el, sortSel, viewSeg, count);

      /* ---------- wallet bar ---------- */

      const walletBar = document.createElement("div");
      walletBar.className = "walletbar";
      walletBar.tabIndex = -1;                  // focus target while picking a manager
      const mgrCards = MANAGERS.map((m, i) => {
        const c = document.createElement("div");
        c.className = "mgr";
        c.style.setProperty("--mgr-color", m.color);
        const key = document.createElement("span");
        key.className = "mgr-key";
        key.textContent = i < 9 ? String(i + 1) : "·";
        const nameRow = document.createElement("span");
        nameRow.className = "mgr-namerow";
        const dot = document.createElement("span");
        dot.className = "mgr-dot";
        const name = document.createElement("span");
        name.className = "mgr-name";
        name.textContent = m.name;
        nameRow.append(dot, name);
        const remLabel = document.createElement("span");
        remLabel.className = "mgr-remaining-label";
        remLabel.textContent = "Remaining";
        const rem = document.createElement("span");
        rem.className = "mgr-remaining";
        const slots = document.createElement("span");
        slots.className = "mgr-slots";
        const pos = document.createElement("span");
        pos.className = "mgr-pos";
        c.append(key, nameRow, remLabel, rem, slots, pos);
        c._rem = rem;
        c._slots = slots;
        c._pos = pos;
        c.addEventListener("click", () => onCardClick(i));
        return c;
      });
      walletBar.append(...mgrCards);

      /* ---------- current lot panel ---------- */
      //
      // Wallet remaining and slots live only in the wallet strip above; max
      // bid lives only here — the two rows deliberately never show the same
      // figure twice. This panel is the "what's up for bid right now" view:
      // the player, and — per manager — photo, name, max bid, remaining, and
      // how many of this position they already hold.
      //
      // The player card and the manager cards are built once and always fully
      // populated (real content when a lot is selected, bootstrap placeholder
      // content before the first selection); deselecting only toggles
      // visibility:hidden. Nothing is ever emptied or display:none'd, so the
      // panel's rendered height is identical in both states by construction —
      // no magic min-height numbers to keep in sync.

      const lotPanel = document.createElement("div");
      lotPanel.className = "lotpanel";

      const lotEmpty = document.createElement("div");
      lotEmpty.className = "lot-empty-msg";
      lotEmpty.textContent = LIVE.role === "viewer"
        ? "No lot on the block right now — waiting for the host."
        : "No player selected — pick one from the list below to see bidding details.";

      const lotPlayer = document.createElement("div");
      lotPlayer.className = "lot-player blank";
      const lotPhotoWrap = document.createElement("div");
      lotPhotoWrap.className = "lot-photo-wrap";
      const lotInfo = document.createElement("div");
      lotInfo.className = "lot-info";
      const lotName = document.createElement("div");
      lotName.className = "lot-name";
      const lotSub = document.createElement("div");
      lotSub.className = "lot-sub";
      const lotStats = document.createElement("div");
      lotStats.className = "lot-stats";
      lotInfo.append(lotName, lotSub, lotStats);
      lotPlayer.append(lotPhotoWrap, lotInfo);

      const lotMgrs = document.createElement("div");
      lotMgrs.className = "lot-mgrs blank";
      const lotMgrCards = MANAGERS.map(m => {
        const c = document.createElement("div");
        c.className = "lot-mgr";
        c.style.setProperty("--mgr-color", m.color);
        const photoWrap = document.createElement("div");
        photoWrap.className = "lot-mgr-photo-wrap";
        renderManagerPhoto(photoWrap, m);
        const nameRow = document.createElement("div");
        nameRow.className = "lot-mgr-namerow";
        const dot = document.createElement("span");
        dot.className = "lot-mgr-dot";
        const nm = document.createElement("span");
        nm.className = "lot-mgr-name";
        nm.textContent = m.name;
        nameRow.append(dot, nm);
        // The max bid is the single most important number on screen during a
        // lot — the only place it's shown now (the wallet strip shows
        // remaining budget instead, so the two rows never duplicate a figure).
        // Every large number here is captioned; this is that caption.
        const maxbidLabel = document.createElement("span");
        maxbidLabel.className = "lot-mgr-maxbid-label";
        maxbidLabel.textContent = "Max bid";
        const maxbid = document.createElement("div");
        maxbid.className = "lot-mgr-maxbid";
        maxbid.textContent = "0";          // bootstrap value — reserves height before any real selection
        const poslabel = document.createElement("span");
        poslabel.className = "lot-mgr-pos-label";
        poslabel.textContent = ORDERED_POS[0] || "POS";   // bootstrap value — reserves the line's height before any real selection
        const poscount = document.createElement("span");
        poscount.className = "lot-mgr-pos-num";
        poscount.textContent = "0";
        const posRow = document.createElement("div");
        posRow.className = "lot-mgr-pos";
        posRow.append(poslabel, poscount);
        const rem = document.createElement("span");
        rem.className = "lot-mgr-rem";
        rem.textContent = "0 left";
        const metaRow = document.createElement("div");
        metaRow.className = "lot-mgr-meta";
        metaRow.append(rem, posRow);
        const info = document.createElement("div");
        info.className = "lot-mgr-info";
        info.append(nameRow, maxbidLabel, maxbid, metaRow);
        c.append(photoWrap, info);
        c._poslabel = poslabel;
        c._pos = poscount;
        c._maxbid = maxbid;
        c._rem = rem;
        return c;
      });
      lotMgrs.append(...lotMgrCards);

      lotPanel.append(lotEmpty, lotPlayer, lotMgrs);

      // Shared manager photo (+ colour-coded initials fallback) — used by both
      // the lot panel's manager cards and the teams view's headers, at whatever
      // size/class each context needs.
      function renderManagerPhoto(wrap, m, opts) {
        const photoClass = (opts && opts.photoClass) || "lot-mgr-photo";
        const initialsClass = (opts && opts.initialsClass) || "lot-mgr-initials";
        const size = (opts && opts.size) || 64;
        function initialsBlock() {
          const s = document.createElement("div");
          s.className = initialsClass;
          s.textContent = initialsOf(m.name);
          s.style.background = m.color;
          return s;
        }
        if (m.photo) {
          const img = new Image(size, size);
          img.className = photoClass;
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () { this.onerror = null; this.replaceWith(initialsBlock()); };
          img.src = m.photo;
          wrap.appendChild(img);
          return;
        }
        wrap.appendChild(initialsBlock());
      }

      function renderLotPhoto(wrap, p) {
        wrap.replaceChildren();
        const photoU = imgUrl(CONFIG.imageUrls.player, p.id);
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        function textFb() {
          const s = document.createElement("div");
          s.className = "lot-photo-txt";
          s.textContent = p.clubCode || norm(p.club).slice(0, 3).toUpperCase();
          return s;
        }
        if (photoU) {
          const img = new Image(88, 88);
          img.className = "lot-photo";
          img.loading = "lazy";
          img.decoding = "async";
          img.referrerPolicy = "no-referrer";
          img.alt = "";
          img.onerror = function () {
            this.onerror = null;
            if (crestU) {
              const c = new Image(88, 88);
              c.className = "lot-photo";
              c.loading = "lazy";
              c.referrerPolicy = "no-referrer";
              c.alt = "";
              c.onerror = function () { this.onerror = null; this.replaceWith(textFb()); };
              c.src = crestU;
              this.replaceWith(c);
            } else {
              this.replaceWith(textFb());
            }
          };
          img.src = photoU;
          wrap.appendChild(img);
          return;
        }
        if (crestU) {
          const c = new Image(88, 88);
          c.className = "lot-photo";
          c.loading = "lazy";
          c.referrerPolicy = "no-referrer";
          c.alt = "";
          c.onerror = function () { this.onerror = null; this.replaceWith(textFb()); };
          c.src = crestU;
          wrap.appendChild(c);
          return;
        }
        wrap.appendChild(textFb());
      }

      // Fills the player card with real content — called for the actual
      // selection, and once at startup with a placeholder to seed height.
      function populateLotPlayer(p) {
        renderLotPhoto(lotPhotoWrap, p);
        lotName.textContent = p.name;

        lotSub.replaceChildren();
        const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
        if (crestU) {
          const i = new Image(15, 15);
          i.className = "cr";
          i.loading = "lazy";
          i.referrerPolicy = "no-referrer";
          i.alt = "";
          i.onerror = function () { this.remove(); };
          i.src = crestU;
          lotSub.appendChild(i);
        }
        const clubSpan = document.createElement("span");
        clubSpan.textContent = p.club;
        const posBadge = document.createElement("span");
        posBadge.className = "pos";
        posBadge.textContent = p.position;
        posBadge.style.background = `hsl(${hueOf(p.position)} 52% 40%)`;
        lotSub.append(clubSpan, posBadge);

        lotStats.replaceChildren();
        const statDefs = [
          ["Value", fmtVal(p.value)],
          ["Points", fmtInt(p.points)],
          ["Goals", fmtInt(p.goals)],
          ["Assists", fmtInt(p.assists)],
          ["Mins", fmtInt(p.mins)]

        for (const [label, val] of statDefs) {
          const d = document.createElement("div");
          d.className = "lot-stat";
          const b = document.createElement("b");
          b.textContent = val;
          const s = document.createElement("span");
          s.textContent = label;
          d.append(b, s);
          lotStats.appendChild(d);
        }
      }

      // Seed with a placeholder so the very first (empty) paint already has the
      // panel's true rendered height — see block comment above.
      populateLotPlayer({
        name: "Player Name", club: "Club", position: ORDERED_POS[0] || "POS",
        value: 0, points: 0, goals: 0, assists: 0, mins: 0, clubId: null, id: null, clubCode: ""
      });

      function renderLotPanel() {
        lotEmpty.hidden = !!SELECTED;
        lotPlayer.classList.toggle("blank", !SELECTED);
        lotMgrs.classList.toggle("blank", !SELECTED);
        if (!SELECTED) return;      // last-shown content stays underneath, just hidden

        populateLotPlayer(SELECTED);

        const cap = CONFIG.positionLimits[SELECTED.position] || [0, 0];
        const capMax = cap[1] || 0;

        MANAGERS.forEach((m, i) => {
          const card = lotMgrCards[i];
          card._poslabel.textContent = SELECTED.position;
          const pc = posCountOf(m, SELECTED.position);
          card._pos.textContent = capMax > 0 ? `${pc}/${capMax}` : `${pc}`;
          card._pos.classList.toggle("atcap", capMax > 0 && pc >= capMax);
          card.classList.toggle("picked", phase === "manager" && pendingManager === i);

          const w = computeBid(m);
          card._maxbid.textContent = w.state === "full" ? "Squad full" : w.state === "belowmin" ? "No bid" : fmtMoney(w.maxBid);
          card._maxbid.classList.toggle("full", w.state === "full");
          card._maxbid.classList.toggle("belowmin", w.state === "belowmin");
          card._rem.textContent = w.remaining + " left";
        });
      }

      /* ---------- assignment bar ---------- */

      const assignBar = document.createElement("div");
      assignBar.className = "assignbar";
      assignBar.dataset.phase = "browse";

      const idleHint = document.createElement("span");
      idleHint.className = "hint idlehint";
      idleHint.textContent = "Select a player  ·  ↑↓ move  ·  Enter pick  ·  U unsold  ·  Esc cancel";

      const playerBox = document.createElement("span");
      playerBox.className = "assign-player";

      const priceLabel = document.createElement("label");
      priceLabel.className = "price-label";
      priceLabel.textContent = "Price";
      const priceInput = document.createElement("input");
      priceInput.type = "text";
      priceInput.className = "price";
      priceInput.inputMode = "decimal";
      priceInput.autocomplete = "off";
      priceInput.placeholder = "≥" + CONFIG.minBid;
      priceLabel.appendChild(priceInput);

      const stepHint = document.createElement("span");
      stepHint.className = "hint step";

      const confirmBtn = document.createElement("button");
      confirmBtn.type = "button";
      confirmBtn.className = "primary";
      confirmBtn.textContent = "Confirm ⏎";
      const unsoldBtn = document.createElement("button");
      unsoldBtn.type = "button";
      unsoldBtn.textContent = "Unsold (U)";
      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.textContent = "Cancel (Esc)";
      // only meaningful for a player currently marked unsold
      const releaseBtn = document.createElement("button");
      releaseBtn.type = "button";
      releaseBtn.textContent = "Back to available (R)";
      releaseBtn.hidden = true;

      const assignErr = document.createElement("span");
      assignErr.className = "assign-err";
      assignErr.setAttribute("role", "status");
      assignErr.setAttribute("aria-live", "polite");

      const assignWarn = document.createElement("span");
      assignWarn.className = "assign-warn";
      assignWarn.setAttribute("role", "status");
      assignWarn.setAttribute("aria-live", "polite");

      const selWrap = document.createElement("span");
      selWrap.className = "selwrap";
      selWrap.append(playerBox, priceLabel, stepHint, confirmBtn, unsoldBtn, releaseBtn, cancelBtn);

      assignBar.append(idleHint, selWrap, assignWarn, assignErr);

      /* ---------- table shell ---------- */

      const main = document.createElement("div");
      main.className = "main";
      const table = document.createElement("table");

      const colgroup = document.createElement("colgroup");
      for (const c of COLS) {
        const col = document.createElement("col");
        if (c.w) col.style.width = c.w;
        colgroup.appendChild(col);
      }
      table.appendChild(colgroup);

      const thead = document.createElement("thead");
      const htr = document.createElement("tr");
      for (const c of COLS) {
        const th = document.createElement("th");
        th.textContent = c.label;
        if (c.num) th.className = "num";
        if (c.title) th.title = c.title;
        htr.appendChild(th);
      }
      thead.appendChild(htr);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      table.appendChild(tbody);
      main.appendChild(table);

      /* ---------- toast + invariant banner ---------- */

      const toastEl = document.createElement("div");
      toastEl.className = "toast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      toastEl.hidden = true;

      let toastTimer = null;
      function toast(msg, kind) {
        toastEl.textContent = msg;
        toastEl.className = "toast" + (kind ? " " + kind : "");
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toastEl.hidden = true; }, 7000);
      }

      const invariantBanner = document.createElement("div");
      invariantBanner.className = "invariant-banner";
      invariantBanner.setAttribute("role", "alert");
      invariantBanner.hidden = true;

      function renderInvariantBanner() {
        if (!invariantProblems.length) {
          invariantBanner.hidden = true;
          invariantBanner.replaceChildren();
          return;
        }
        invariantBanner.hidden = false;
        const h = document.createElement("div");
        h.textContent = `⚠ Derived state does not match the player records — ${invariantProblems.length} problem${invariantProblems.length > 1 ? "s" : ""}. Stop and check before continuing.`;
        const ul = document.createElement("ul");
        for (const line of invariantProblems.slice(0, 20)) {
          const li = document.createElement("li");
          li.textContent = line;
          ul.appendChild(li);
        }
        if (invariantProblems.length > 20) {
          const li = document.createElement("li");
          li.textContent = `…and ${invariantProblems.length - 20} more`;
          ul.appendChild(li);
        }
        invariantBanner.replaceChildren(h, ul);
      }

      /* ---------- app tabs (Auction / Teams / Log) ---------- */

      let appView = "auction";

      const auctionView = document.createElement("div");
      auctionView.className = "auctionview";
      auctionView.append(toolbar, walletBar, lotPanel, assignBar, main);

      const apptabs = document.createElement("div");
      apptabs.className = "apptabs";
      const tabDefs = [["auction", "Auction", ""], ["teams", "Teams", "(T)"], ["log", "Log", "(L)"]];
      const tabBtns = tabDefs.map(([key, label, keyHint]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        if (keyHint) {
          const kbd = document.createElement("span");
          kbd.className = "kbd";
          kbd.textContent = keyHint;
          b.appendChild(kbd);
        }
        b.dataset.view = key;
        b.addEventListener("click", () => setView(key));
        return b;
      });
      apptabs.append(...tabBtns);

      /* ---------- persistence: autosave / export / import / reset ----------
         The player records + log are the only things persisted (see the
         PERSISTENCE helpers above for the shared shape/validation). CONFIG
         is never persisted — it's read from code on every load. Saving is
         debounced off the interaction path so a click never blocks on it,
         however large the log has grown. */

      /* ---------- live mirroring chrome ----------
         Two things have to be answerable without asking anyone: which room
         is this, and is what I'm looking at current. The room bar answers
         the first (host only — it's the thing you read out and share); the
         status chip and the stale banner answer the second, on both roles. */

      const roomBar = document.createElement("div");
      roomBar.className = "roombar";
      roomBar.hidden = true;

      // Identity strip. Rebuilt wholesale on every seat change — it is a
      // handful of nodes that change rarely, and a stale Release button is a
      // worse failure than a repaint.
      const seatBar = document.createElement("div");
      seatBar.className = "seatbar";
      seatBar.hidden = true;

      const liveBanner = document.createElement("div");
      liveBanner.className = "live-banner";
      liveBanner.setAttribute("role", "alert");
      liveBanner.hidden = true;

      const liveStatusEl = document.createElement("span");
      liveStatusEl.className = "live-status";
      liveStatusEl.setAttribute("role", "status");
      liveStatusEl.setAttribute("aria-live", "polite");

      // Only shown when this host is genuinely publishing — a room key and a
      // viewer link on a host that failed to connect would be a lie you could
      // send to four people.
      if (LIVE.role === "host" && LIVE.roomKey && LIVE.enabled) {
        const url = viewerUrlFor(LIVE.roomKey);
        const lbl = document.createElement("span");
        lbl.className = "roombar-label";
        lbl.textContent = "Room";
        const key = document.createElement("span");
        key.className = "roombar-key";
        key.textContent = LIVE.roomKey;
        const lbl2 = document.createElement("span");
        lbl2.className = "roombar-label";
        lbl2.textContent = "Viewer link";
        const urlEl = document.createElement("span");
        urlEl.className = "roombar-url";
        urlEl.textContent = url;
        urlEl.title = url;
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "mf-btn";
        copyBtn.textContent = "Copy link";
        copyBtn.addEventListener("click", () => {
          // The link is also plain selectable text above, so a browser that
          // refuses clipboard access still leaves a way to share it.
          const done = () => { copyBtn.textContent = "Copied"; setTimeout(() => { copyBtn.textContent = "Copy link"; }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, () => toast("Could not copy — select the link and copy it manually.", "warn"));
          } else {
            toast("Clipboard unavailable — select the link and copy it manually.", "warn");
          }
        });
        const note = document.createElement("span");
        note.className = "roombar-note";
        note.textContent = "viewers are read-only";
        roomBar.append(lbl, key, lbl2, urlEl, copyBtn, note);
        roomBar.hidden = false;
      }

      const apptabsRight = document.createElement("div");
      apptabsRight.className = "apptabs-right";

      const saveStatusEl = document.createElement("span");
      saveStatusEl.className = "save-status";
      saveStatusEl.setAttribute("role", "status");
      saveStatusEl.setAttribute("aria-live", "polite");

      const exportBtn = document.createElement("button");
      exportBtn.type = "button";
      exportBtn.className = "mf-btn";
      exportBtn.textContent = "Download JSON";

      const importBtn = document.createElement("button");
      importBtn.type = "button";
      importBtn.className = "mf-btn";
      importBtn.textContent = "Import…";
      const importFile = document.createElement("input");
      importFile.type = "file";
      importFile.accept = "application/json,.json";
      importFile.hidden = true;

      const resetBtn = document.createElement("button");
      resetBtn.type = "button";
      resetBtn.className = "mf-btn";
      resetBtn.textContent = "Reset…";

      if (READONLY) {
        // Nothing here is meaningful on a mirror: there is no local state to
        // export, and importing or resetting would only desync this screen
        // until the host's next publish overwrote it.
        const badge = document.createElement("span");
        badge.className = "viewer-badge";
        badge.textContent = "Viewer · read-only";
        apptabsRight.append(badge, liveStatusEl);
      } else {
        apptabsRight.append(liveStatusEl, saveStatusEl, exportBtn, importBtn, importFile, resetBtn);
      }
      apptabs.append(apptabsRight);

      const saveBanner = document.createElement("div");
      saveBanner.className = "invariant-banner save-banner";
      saveBanner.setAttribute("role", "alert");
      saveBanner.hidden = true;

      let saveTimer = null;
      let pendingSave = false;
      let saveFailed = false;
      let saveFailReason = "";
      let lastSavedAt = restore ? (restore.savedAt || null) : null;

      function buildSaveState(includeConfig) {
        const obj = { schema: SCHEMA_VERSION, savedAt: Date.now(), players: ALL, log: LOG };
        if (includeConfig) obj.config = CONFIG;
        return obj;
      }

      function renderSaveStatus() {
        if (saveFailed) {
          saveStatusEl.textContent = "⚠ Not saved — " + saveFailReason;
          saveStatusEl.className = "save-status bad";
          saveBanner.hidden = false;
          const h = document.createElement("div");
          h.textContent = `⚠ Auction is NOT being saved: ${saveFailReason} Download JSON now to avoid losing progress.`;
          saveBanner.replaceChildren(h);
          return;
        }
        saveBanner.hidden = true;
        if (pendingSave) {
          saveStatusEl.textContent = "Saving…";
          saveStatusEl.className = "save-status pending";
        } else if (lastSavedAt) {
          saveStatusEl.textContent = "Saved " + new Date(lastSavedAt).toLocaleTimeString([], { hour12: false });
          saveStatusEl.className = "save-status ok";
        } else {
          saveStatusEl.textContent = "Not saved yet";
          saveStatusEl.className = "save-status";
        }
      }

      function doSave() {
        // A viewer's screen is a projection of someone else's auction — writing
        // it to this browser's autosave slot would leave a phone holding a
        // half-real "saved auction" to be restored later.
        if (READONLY) return;
        pendingSave = false;
        let json;
        try {
          json = JSON.stringify(buildSaveState(false), jsonReplacer);
        } catch (e) {
          saveFailed = true;
          saveFailReason = "Could not prepare data to save (" + ((e && e.message) || e) + ").";
          renderSaveStatus();
          return;
        }
        try {
          localStorage.setItem(STORAGE_KEY, json);
          saveFailed = false;
          saveFailReason = "";
          lastSavedAt = Date.now();
        } catch (e) {
          saveFailed = true;
          saveFailReason = (e && e.name === "QuotaExceededError")
            ? "Browser storage is full."
            : "Browser storage is unavailable (" + ((e && e.message) || e) + ").";
        }
        renderSaveStatus();
      }

      // Debounced + deferred: a burst of actions (or a huge log) coalesces
      // into one save a moment later, off the click that triggered it.
      function scheduleSave() {
        if (READONLY) return;
        pendingSave = true;
        renderSaveStatus();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 250);
      }

      window.addEventListener("beforeunload", () => {
        if (READONLY) return;
        if (pendingSave) { clearTimeout(saveTimer); doSave(); }
      });

      exportBtn.addEventListener("click", () => {
        downloadJSON(buildSaveState(true), exportFilename());
        toast("Exported current auction state.");
      });

      function applyImport(obj) {
        if (READONLY) return;
        const byId = new Map(obj.players.map(p => [String(p.id), p]));
        for (const p of ALL) {
          const s = byId.get(String(p.id));
          if (s) { p.status = s.status; p.owner = s.owner; p.price = s.price; }
          else { p.status = "available"; p.owner = null; p.price = null; }
        }
        LOG.length = 0;
        for (const e of obj.log) LOG.push(e);
        logSeq = LOG.reduce((m, e) => Math.max(m, Number(e.seq) || 0), 0);
        if (SELECTED) cancelSelection();
        if (editPlayer) closeEdit();
        checkInvariants();
        scheduleSave();
        LIVE.schedulePublish();
        render();
        setView("auction");
        toast(`Imported ${obj.players.length} player record${obj.players.length === 1 ? "" : "s"} and ${obj.log.length} log entr${obj.log.length === 1 ? "y" : "ies"}.`);
      }

      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", () => {
        const file = importFile.files && importFile.files[0];
        importFile.value = "";
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let obj;
          try { obj = JSON.parse(String(reader.result)); }
          catch (e) {
            showConfirm({
              title: "Import failed",
              lines: ["The selected file is not valid JSON.", String((e && e.message) || e)],
              buttons: [{ label: "OK" }]
            });
            return;
          }
          const errs = validateStateShape(obj);
          if (errs.length) {
            showConfirm({
              title: `Import failed — ${errs.length} problem${errs.length > 1 ? "s" : ""}`,
              sub: "The file doesn't match the expected format. Nothing was changed.",
              lines: errs.length > 12 ? [...errs.slice(0, 12), `…and ${errs.length - 12} more`] : errs,
              buttons: [{ label: "OK" }]
            });
            return;
          }
          const currentIds = idSetOf(ALL);
          const importIds = idSetOf(obj.players);
          if (!setsEqual(currentIds, importIds)) {
            showConfirm({
              title: "Import doesn't match the current player list",
              sub: "This file was built from a different players.json (a different player set) than the one currently loaded. It will not be merged with the current state.",
              lines: [`Importing file: ${obj.players.length} players, ${obj.log.length} log entries${obj.savedAt ? ", saved " + new Date(obj.savedAt).toLocaleString() : ""}.`],
              buttons: [
                { label: "Export current state, then import", kind: "primary", onClick: () => { downloadJSON(buildSaveState(true), exportFilename()); applyImport(obj); } },
                { label: "Discard current state and import", kind: "danger", onClick: () => applyImport(obj) },
                { label: "Cancel", onClick: () => { } }
              ]
            });
            return;
          }
          showConfirm({
            title: "Import and replace current auction data?",
            sub: `${obj.players.length} players, ${obj.log.length} log entries.`,
            lines: ["This replaces every sale, price, and the entire log with the contents of this file."],
            buttons: [
              { label: "Import & replace", kind: "primary", onClick: () => applyImport(obj) },
              { label: "Cancel", onClick: () => { } }
            ]
          });
        };
        reader.onerror = () => {
          showConfirm({ title: "Import failed", lines: ["Could not read the selected file."], buttons: [{ label: "OK" }] });
        };
        reader.readAsText(file);
      });

      function performReset() {
        if (READONLY) return;
        for (const p of ALL) { p.status = "available"; p.owner = null; p.price = null; }
        LOG.length = 0;
        logSeq = 0;
        if (SELECTED) cancelSelection();
        if (editPlayer) closeEdit();
        clearTimeout(saveTimer);
        pendingSave = false;
        try { localStorage.removeItem(STORAGE_KEY); saveFailed = false; saveFailReason = ""; }
        catch (e) { saveFailed = true; saveFailReason = "Could not clear saved data (" + ((e && e.message) || e) + ")."; }
        lastSavedAt = null;
        renderSaveStatus();
        checkInvariants();
        LIVE.schedulePublish();
        render();
        toast("Auction reset — every player is available and all wallets are full.");
      }

      resetBtn.addEventListener("click", () => {
        let nSold = 0, nUnsold = 0;
        for (const p of ALL) { if (p.status === "sold") nSold++; else if (p.status === "unsold") nUnsold++; }
        showConfirm({
          title: "Reset the auction?",
          sub: "This clears every sale and the entire log. It cannot be undone.",
          lines: [
            `${nSold} sold player${nSold === 1 ? "" : "s"} return to available.`,
            `${nUnsold} unsold flag${nUnsold === 1 ? "" : "s"} cleared.`,
            `${LOG.length} log entr${LOG.length === 1 ? "y" : "ies"} erased.`,
            `Every wallet returns to ${CONFIG.startingBudget}.`
          ],
          buttons: [
            { label: "Export first, then reset", kind: "primary", onClick: () => { downloadJSON(buildSaveState(true), exportFilename()); performReset(); } },
            { label: "Reset without exporting", kind: "danger", onClick: performReset },
            { label: "Cancel", onClick: () => { } }
          ]
        });
      });

      /* ---------- teams view ---------- */
      //
      // Dense, all-squads-at-once review screen: photo/name/budget summary up
      // top per manager, full squad grouped by position, then per-position and
      // per-club counts flagged against CONFIG limits. Built once with a fixed
      // set of DOM nodes (position groups, badge rows) that renderTeams() only
      // ever updates the text/classes of — same "always fully built, never
      // torn down" approach as the lot panel, so there's nothing to be blank
      // before the first sale.

      const teamsView = document.createElement("div");
      teamsView.className = "teamsview";
      teamsView.hidden = true;

      const teamCols = MANAGERS.map(m => {
        const col = document.createElement("div");
        col.className = "team-col";
        col.style.setProperty("--mgr-color", m.color);

        const head = document.createElement("div");
        head.className = "team-head";
        const photoWrap = document.createElement("div");
        photoWrap.className = "team-photo-wrap";
        renderManagerPhoto(photoWrap, m, { photoClass: "team-photo", initialsClass: "team-initials", size: 40 });
        const headInfo = document.createElement("div");
        headInfo.className = "team-head-info";
        const nameEl = document.createElement("div");
        nameEl.className = "team-name";
        nameEl.textContent = m.name;
        const summary = document.createElement("div");
        summary.className = "team-summary";
        headInfo.append(nameEl, summary);
        head.append(photoWrap, headInfo);

        const body = document.createElement("div");
        body.className = "team-body";
        const posGroups = ORDERED_POS.map(pos => {
          const gh = document.createElement("div");
          gh.className = "team-posgrp-head";
          const ghLabel = document.createElement("span");
          ghLabel.textContent = pos;
          const ghCount = document.createElement("span");
          ghCount.className = "cnt";
          gh.append(ghLabel, ghCount);
          const rowsWrap = document.createElement("div");
          rowsWrap.className = "team-posgrp-rows";
          body.append(gh, rowsWrap);
          return { pos, ghCount, rowsWrap };
        });

        const foot = document.createElement("div");
        foot.className = "team-foot";
        const statsRow = document.createElement("div");
        statsRow.className = "team-stats-row";
        const clubBadges = document.createElement("div");
        clubBadges.className = "team-badge-row";
        foot.append(statsRow, clubBadges);

        col.append(head, body, foot);
        return { m, col, summary, posGroups, statsRow, clubBadges };
      });
      teamsView.append(...teamCols.map(t => t.col));

      function renderTeams() {
        teamCols.forEach(({ m, summary, posGroups, statsRow, clubBadges }) => {
          const w = walletOf(m);
          const squad = ALL.filter(p => p.status === "sold" && p.owner === m.id);

          const slotsFlagged = w.slots > CONFIG.squadSize;
          const slotsSpan = document.createElement("span");
          slotsSpan.className = slotsFlagged ? "flag-warn" : "";
          slotsSpan.textContent = `${w.slots}/${CONFIG.squadSize} slots`;
          summary.replaceChildren(document.createTextNode(`${fmtMoney(w.remaining)} left · `), slotsSpan);

          posGroups.forEach(({ pos, ghCount, rowsWrap }) => {
            const inPos = squad.filter(p => p.position === pos).sort((a, b) => a._n.localeCompare(b._n));
            const lim = CONFIG.positionLimits[pos] || [0, 0];
            const min = lim[0] || 0, max = lim[1] || 0;
            const n = inPos.length;
            ghCount.textContent = max > 0 ? `${n}/${max}` : String(n);
            ghCount.classList.toggle("flag-err", max > 0 && n > max);
            ghCount.classList.toggle("flag-warn", !(max > 0 && n > max) && min > 0 && n < min);

            rowsWrap.replaceChildren();
            if (!inPos.length) {
              const e = document.createElement("div");
              e.className = "team-empty-slot";
              e.textContent = "— none yet —";
              rowsWrap.appendChild(e);
            } else {
              for (const p of inPos) {
                const row = document.createElement("div");
                row.className = "team-row clickable";
                row.title = "Edit price / reassign / revert";
                row.addEventListener("click", () => openEdit(p));
                const crestU = imgUrl(CONFIG.imageUrls.club, p.clubId);
                if (crestU) {
                  const i = new Image(14, 14);
                  i.className = "cr";
                  i.loading = "lazy";
                  i.referrerPolicy = "no-referrer";
                  i.alt = "";
                  i.onerror = function () {
                    this.onerror = null;
                    const s = document.createElement("span");
                    s.className = "cr-txt";
                    s.textContent = p.clubCode || "";
                    this.replaceWith(s);
                  };
                  i.src = crestU;
                  row.appendChild(i);
                } else {
                  const s = document.createElement("span");
                  s.className = "cr-txt";
                  s.textContent = p.clubCode || "";
                  row.appendChild(s);
                }
                const nmEl = document.createElement("span");
                nmEl.className = "nm";
                nmEl.textContent = p.name;
                const clubEl = document.createElement("span");
                clubEl.className = "club";
                clubEl.textContent = p.club;
                const priceEl = document.createElement("span");
                priceEl.className = "price";
                priceEl.textContent = fmtMoney(p.price);
                row.append(nmEl, clubEl, priceEl);
                rowsWrap.appendChild(row);
              }
            }
          });

          const avg = w.slots > 0 ? (w.spent / w.slots).toFixed(1) : "–";
          const pct = ((w.spent / CONFIG.startingBudget) * 100).toFixed(0);
          statsRow.textContent = `Spent ${fmtMoney(w.spent)} · Avg ${avg} · ${pct}% of budget`;

          const clubCounts = new Map();
          for (const p of squad) clubCounts.set(p.club, (clubCounts.get(p.club) || 0) + 1);
          clubBadges.replaceChildren();
          const entries = [...clubCounts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
          for (const [club, n] of entries) {
            const b = document.createElement("span");
            b.className = "team-club-badge";
            const sample = squad.find(p => p.club === club);
            b.textContent = `${(sample && sample.clubCode) || club} ×${n}`;
            if (CONFIG.maxPerClub > 0 && n > CONFIG.maxPerClub) b.classList.add("flag-err");
            clubBadges.appendChild(b);
          }
          if (!entries.length) {
            const e = document.createElement("span");
            e.className = "team-club-badge muted";
            e.textContent = "No players yet";
            clubBadges.appendChild(e);
          }
        });
      }

      /* ---------- edit / reassign dialog ----------
         Opened by picking a sold player (from the auction list or the teams
         view). Everything it shows about a prospective change is a pure
         projection computed from the records with this player excluded and
         then re-added at the candidate manager/price — nothing is stored, so
         after the change lands every figure is derived afresh as usual. */

      let editPlayer = null;      // the sold player being edited, or null
      let editTarget = null;      // manager id currently chosen in the dialog

      const editOverlay = document.createElement("div");
      editOverlay.className = "editoverlay";
      editOverlay.hidden = true;

      const editDialog = document.createElement("div");
      editDialog.className = "editdialog";
      editDialog.setAttribute("role", "dialog");
      editDialog.setAttribute("aria-modal", "true");

      const editPhotoWrap = document.createElement("div");
      editPhotoWrap.className = "lot-photo-wrap";
      const editTitle = document.createElement("div");
      editTitle.className = "edit-title";
      const editSub = document.createElement("div");
      editSub.className = "edit-sub";
      const editNow = document.createElement("div");
      editNow.className = "edit-sub";
      const editHeadInfo = document.createElement("div");
      editHeadInfo.className = "edit-head-info";
      editHeadInfo.append(editTitle, editSub, editNow);
      const editHead = document.createElement("div");
      editHead.className = "edit-head";
      editHead.append(editPhotoWrap, editHeadInfo);

      const editPriceLabel = document.createElement("div");
      editPriceLabel.className = "edit-label";
      editPriceLabel.textContent = "Price paid";
      const editPrice = document.createElement("input");
      editPrice.type = "text";
      editPrice.className = "price";
      editPrice.inputMode = "decimal";
      editPrice.autocomplete = "off";
      const editPriceBlock = document.createElement("div");
      editPriceBlock.append(editPriceLabel, editPrice);

      const editMgrLabel = document.createElement("div");
      editMgrLabel.className = "edit-label";
      editMgrLabel.textContent = `Owner — click, or ⌥/Alt+1–${MANAGERS.length}`;
      const editMgrs = document.createElement("div");
      editMgrs.className = "edit-mgrs";
      const editMgrBtns = MANAGERS.map(m => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "edit-mgr";
        b.style.setProperty("--mgr-color", m.color);
        const nm = document.createElement("b");
        const l1 = document.createElement("span");
        l1.className = "em-line";
        const l2 = document.createElement("span");
        l2.className = "em-line";
        b.append(nm, l1, l2);
        b._nm = nm; b._l1 = l1; b._l2 = l2;
        b.addEventListener("click", () => { editTarget = m.id; renderEditDialog(); });
        return b;
      });
      editMgrs.append(...editMgrBtns);
      const editMgrBlock = document.createElement("div");
      editMgrBlock.append(editMgrLabel, editMgrs);

      const editErr = document.createElement("div");
      editErr.className = "edit-msg err";
      const editWarn = document.createElement("div");
      editWarn.className = "edit-msg warn";

      const editBody = document.createElement("div");
      editBody.className = "edit-body";
      editBody.append(editPriceBlock, editMgrBlock, editErr, editWarn);

      const editSaveBtn = document.createElement("button");
      editSaveBtn.type = "button";
      editSaveBtn.className = "primary";
      editSaveBtn.textContent = "Save ⏎";
      const editRevertBtn = document.createElement("button");
      editRevertBtn.type = "button";
      editRevertBtn.className = "danger";
      editRevertBtn.textContent = "Revert sale → available";
      const editCancelBtn = document.createElement("button");
      editCancelBtn.type = "button";
