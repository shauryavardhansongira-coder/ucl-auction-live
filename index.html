<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UCL Auction — Players</title>
  <style>
    * {
      box-sizing: border-box;
    }

    /* ============================================================
       Design tokens — the only place colour lives. Everything below
       reads these; nothing else in this file hardcodes a hex value
       for page chrome. Committed to one dark theme deliberately: this
       screen runs once, for a couple of hours, on one shared laptop —
       it shouldn't shift look with someone's OS setting mid-auction.

       Levels, darkest to lightest: bg (page) < surface-1 (toolbar,
       panels, headers) < surface-2 (cards, alt rows) < surface-3
       (hover/active). Text: text (primary) > text-2 (secondary,
       still AA) > text-3 (tertiary — de-emphasised/settled content,
       still AA at normal size against every surface here).
       ============================================================ */
    :root {
      --bg: #0c0f13;
      --surface-1: #141920;
      --surface-2: #1a2029;
      --surface-3: #232b36;
      --border: #2a323d;
      --border-strong: #3b4552;

      --text: #eef2f6;
      --text-2: #9aa7b4;
      --text-3: #7d8895;
      --on-color: #ffffff;

      --accent: #5b9bff;
      --ok: #3fbf76;
      --warn: #dd9c2e;
      --err: #ef5451;
      --warn-wash: #241d10;

      /* Neutral selection/focus marker — keyboard-highlighted row, a
       manager card mid-pick. Deliberately not any CONFIG manager colour
       (nor --accent, which happens to equal one) so a selection ring or
       edge never reads as "that manager's colour". --select is light, so
       the keyboard-highlighted row (a full fill, not just an edge) needs
       its own dark text pair to stay AA on top of it. */
      --select: #c7d0da;
      --select-text: var(--bg);
      --select-text-2: #3a4149;

      /* legacy aliases — kept so every existing rule below (panel/line/
       row2/hover/hd/muted) still resolves through the token system
       above rather than a scattered literal. */
      --panel: var(--surface-1);
      --line: var(--border);
      --muted: var(--text-2);
      --row2: var(--surface-2);
      --hover: var(--surface-3);
      --hd: var(--surface-1);
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .toolbar input[type=search] {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
    }

    .toolbar select,
    .mf-btn {
      padding: 6px 10px;
      font-size: 13px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
    }

    .count {
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Multi-select filter */
    .mf {
      position: relative;
    }

    .mf-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 20;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
      min-width: 210px;
      max-height: 340px;
      overflow: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }

    .mf-panel[hidden] {
      display: none;
    }

    .mf-quick {
      display: flex;
      gap: 12px;
      padding: 2px 6px 6px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }

    .mf-quick a {
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }

    .mf-panel label {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .mf-panel label:hover {
      background: var(--hover);
    }

    /* View segmented control */
    .viewseg {
      display: flex;
    }

    .viewseg button {
      padding: 6px 9px;
      font-size: 12px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      border-left-width: 0;
      cursor: pointer;
    }

    .viewseg button:first-child {
      border-left-width: 1px;
      border-radius: 6px 0 0 6px;
    }

    .viewseg button:last-child {
      border-radius: 0 6px 6px 0;
    }

    .viewseg button.on {
      color: var(--text);
      background: var(--hd);
      font-weight: 700;
    }

    /* Top-level app tabs — Auction vs Teams. The one real navigation choice in
     the app, so a little bolder than the in-toolbar segmented controls. */
    .apptabs {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: var(--hd);
      border-bottom: 1px solid var(--line);
    }

    .apptabs button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
    }

    .apptabs button:hover {
      color: var(--text);
    }

    .apptabs button.on {
      color: var(--text);
      background: var(--panel);
      border-color: var(--line);
    }

    .apptabs .kbd {
      font-size: 10px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 3px;
    }

    .apptabs button.on .kbd {
      color: var(--muted);
    }

    /* Persistence controls — save status + export/import/reset, always visible
     regardless of which app view (auction/teams/log) is showing. */
    .apptabs-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .save-status {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }

    .save-status.ok {
      color: var(--ok);
      font-weight: 600;
    }

    .save-status.pending {
      color: var(--muted);
      font-style: italic;
    }

    .save-status.bad {
      color: var(--err);
      font-weight: 700;
    }

    .save-banner {
      background: var(--err);
    }

    .auctionview {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .auctionview[hidden] {
      display: none;
    }

    /* Teams view — dense, side-by-side squads for reviewing between lots. */
    .teamsview {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 10px;
      padding: 10px;
      background: var(--bg);
    }

    .teamsview[hidden] {
      display: none;
    }

    /* Manager identity colour as a top edge on their column — paired,
     as everywhere else, with the name text right beside the photo. */
    .team-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-top: 3px solid var(--mgr-color, var(--border));
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
    }

    .team-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .team-photo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg);
      display: block;
      flex: none;
    }

    .team-initials {
      display: flex;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      flex: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--on-color);
    }

    .team-head-info {
      min-width: 0;
    }

    .team-name {
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-summary {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .team-summary .flag-warn {
      color: var(--warn);
      font-weight: 700;
    }

    .team-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .team-posgrp-head {
      display: flex;
      justify-content: space-between;
      padding: 3px 10px;
      background: var(--hd);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
      border-top: 1px solid var(--line);
    }

    .team-posgrp-head .cnt {
      font-variant-numeric: tabular-nums;
    }

    .team-posgrp-head .cnt.flag-warn {
      color: var(--warn);
    }

    .team-posgrp-head .cnt.flag-err {
      color: var(--err);
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      font-size: 12px;
    }

    .team-row .cr {
      width: 14px;
      height: 14px;
      object-fit: contain;
      flex: none;
    }

    .team-row .cr-txt {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      flex: none;
      min-width: 14px;
    }

    .team-row .nm {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-row .club {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80px;
    }

    .team-row .price {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      flex: none;
    }

    .team-empty-slot {
      padding: 3px 10px 6px;
      font-size: 11px;
      font-style: italic;
      color: var(--muted);
    }

    .team-foot {
      border-top: 1px solid var(--line);
      padding: 7px 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .team-stats-row {
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
    }

    .team-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .team-club-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .team-club-badge.flag-err {
      color: var(--err);
      border-color: var(--err);
      font-weight: 700;
    }

    .team-club-badge.muted {
      color: var(--muted);
      font-style: italic;
      border-style: dashed;
    }

    /* Wallet bar — always visible, glanceable from across a table */
    .walletbar {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 6px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .walletbar:focus {
      outline: none;
    }

    /* Manager identity colour (--mgr-color, set inline per card from
     CONFIG) shows up as this left edge everywhere a manager has a card —
     wallet bar, lot panel, edit dialog — always paired with the name
     text right next to it, never colour carrying the identity alone. */
    .mgr {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 3px 8px 3px 7px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--mgr-color, var(--border));
      border-radius: 6px;
      background: var(--surface-2);
      min-width: 0;
    }

    .mgr-key {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 3px;
      line-height: 1.35;
    }

    .mgr-namerow {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-right: 16px;
      min-width: 0;
    }

    .mgr-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mgr-color, var(--border));
      flex: none;
    }

    .mgr-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Wallet remaining is the persistent, always-visible figure for this
     card — the max bid (a different quantity, and the one that matters
     only while a lot is live) lives exclusively in the lot panel now, so
     the two rows never show the same number twice. Every large number
     gets a small caption; this is the one here. */
    .mgr-remaining-label {
      display: block;
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-top: 2px;
    }

    .mgr-remaining {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      color: var(--text);
    }

    .mgr-slots {
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .mgr.full .mgr-slots {
      color: var(--ok);
      font-weight: 700;
    }

    /* reserved always, whether or not a player is selected — height is explicit
     so the line never collapses and the card doesn't resize on selection */
    .mgr-pos {
      height: 14px;
      line-height: 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .mgr-pos.atcap {
      color: var(--warn);
    }

    .walletbar.pick .mgr {
      cursor: pointer;
    }

    /* Selection/focus states (picked-for-bid, hover-while-picking, keyboard
     highlight) use --select — a neutral tone kept deliberately distinct
     from every CONFIG manager colour, so a coloured ring or edge here
     never gets mistaken for a specific manager's identity. */
    .walletbar.pick .mgr:hover {
      border-color: var(--select);
    }

    .mgr.picked {
      border-color: var(--select);
      box-shadow: 0 0 0 1px var(--select) inset;
    }

    .mgr.blocked {
      opacity: .5;
    }

    .mgr.blocked .mgr-remaining {
      color: var(--err);
    }

    /* Current lot panel — the big, high-contrast display driving the bidding itself.
     The player card and manager cards are always fully built (with the last-shown
     content, or bootstrap placeholders before any selection) and only ever get
     visibility:hidden when empty — never display:none / removed children — so the
     panel's rendered height can never differ between the two states. */
    .lotpanel {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: stretch;
      padding: 6px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .lot-empty-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--panel);
      pointer-events: none;
    }

    .lot-empty-msg[hidden] {
      display: none;
    }

    .lot-player {
      display: flex;
      gap: 12px;
      align-items: center;
      flex: 0 0 auto;
      min-width: 260px;
    }

    .lot-player.blank,
    .lot-mgrs.blank {
      visibility: hidden;
    }

    .lot-photo-wrap {
      flex: none;
      width: 76px;
      height: 76px;
    }

    .lot-photo {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }

    .lot-photo-txt {
      display: flex;
      width: 76px;
      height: 76px;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 22px;
      font-weight: 800;
      color: var(--muted);
    }

    .lot-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .lot-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lot-sub {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .lot-sub .cr {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    .lot-stats {
      display: flex;
      gap: 16px;
      margin-top: 2px;
    }

    .lot-stat {
      display: flex;
      flex-direction: column;
    }

    .lot-stat b {
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }

    .lot-stat span {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
    }

    /* Manager cards — photo, name, max bid (the reason this panel exists),
     remaining and this lot's position count. Laid out horizontally (photo
     beside text) so the card's natural height stays under the player
     photo's 76px — the panel's height is set by that photo either way, so
     a taller card here would only add dead space instead of giving it
     back to the player list. */
    .lot-mgrs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(120px, 1fr);
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .lot-mgr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 9px 5px 7px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--mgr-color, var(--border));
      border-radius: 10px;
      background: var(--surface-2);
      min-width: 0;
    }

    .lot-mgr.picked {
      border-color: var(--select);
      border-left-color: var(--select);
      box-shadow: 0 0 0 1px var(--select) inset;
    }

    /* Sized to fill most of the card's own content height (driven by the
     info column beside it — name, max bid, meta) rather than the card's
     small original photo padding — so the card's outer box doesn't grow. */
    .lot-mgr-photo {
      width: 60px;
      height: 60px;
      border-radius: 9px;
      object-fit: cover;
      background: var(--bg);
      display: block;
      flex: none;
    }

    .lot-mgr-initials {
      display: flex;
      width: 60px;
      height: 60px;
      border-radius: 9px;
      flex: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--on-color);
    }

    .lot-mgr-info {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .lot-mgr-namerow {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .lot-mgr-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mgr-color, var(--border));
      flex: none;
    }

    .lot-mgr-name {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      max-width: 100%;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* The max bid — the number a manager actually needs while a lot is
     live — is deliberately the largest, highest-contrast figure anywhere
     in the lot panel: bigger than the player's own stats, bigger than the
     position count below it. It's the only place this figure appears at
     all (the wallet strip shows remaining instead), so it's always
     captioned — no large number on screen goes unlabelled. When they
     can't bid, a filled flag, never just a dimmer number. */
    .lot-mgr-maxbid-label {
      display: block;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
    }

    .lot-mgr-maxbid {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      color: var(--text);
    }

    .lot-mgr-maxbid.full,
    .lot-mgr-maxbid.belowmin {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
      padding: 2px 6px;
      border-radius: 5px;
      line-height: 1.3;
      margin-top: 3px;
    }

    .lot-mgr-maxbid.full {
      background: var(--ok);
      color: var(--on-color);
    }

    .lot-mgr-maxbid.belowmin {
      background: var(--err);
      color: var(--on-color);
    }

    .lot-mgr-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 1px;
    }

    .lot-mgr-rem {
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* position + count/limit — a bare number means nothing without
     knowing which position or what the cap is */
    .lot-mgr-pos {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .lot-mgr-pos-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--muted);
    }

    .lot-mgr-pos-num {
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      color: var(--text);
    }

    .lot-mgr-pos-num.atcap {
      color: var(--warn);
    }

    /* Assignment bar */
    .assignbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      min-height: 34px;
    }

    .assignbar[hidden] {
      display: none;
    }

    .assignbar .hint {
      color: var(--muted);
    }

    .assignbar:not(.sel) .selwrap {
      display: none;
    }

    .assignbar.sel .idlehint {
      display: none;
    }

    .selwrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .assign-player {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .assign-player .meta {
      color: var(--muted);
      font-weight: 400;
    }

    .price-label {
      color: var(--muted);
    }

    input.price {
      width: 74px;
      margin-left: 4px;
      padding: 4px 8px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
    }

    input.price:disabled {
      opacity: .6;
    }

    .assignbar button {
      padding: 4px 9px;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
    }

    .assignbar button.primary {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .assignbar button[disabled] {
      opacity: .4;
      cursor: default;
    }

    .assign-err {
      color: var(--err);
      font-weight: 600;
    }

    .assign-err:empty {
      display: none;
    }

    .assign-warn {
      color: var(--warn);
      font-weight: 600;
    }

    .assign-warn:empty {
      display: none;
    }

    /* Table */
    .main {
      flex: 1;
      overflow: auto;
    }

    /* border-collapse:collapse + position:sticky rows is a known Chrome/WebKit
     compositing bug: collapsed borders are painted on a layer that can peek
     through a sticky row at certain scroll offsets, showing a hairline
     sliver of the row behind it. Separate borders (each cell paints its own
     edge, nothing shared) avoids that layer entirely. */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--hd);
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
      cursor: default;
      contain: paint;
    }

    tbody td {
      padding: 2px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr.r {
      cursor: pointer;
      background: var(--bg);
    }

    tbody tr.r:hover {
      background: var(--hover);
    }

    tbody tr.r.alt {
      background: var(--row2);
    }

    /* Sold — settled, de-emphasised relative to available rows. Text drops
     a level, photo/badges fade, but the owner+price marker (.mark.sold)
     is explicitly excluded so it stays legible — that's the one thing
     worth reading on a row you've already closed out. */
    tbody tr.r.soldrow {
      cursor: default;
    }

    tbody tr.r.soldrow td {
      color: var(--text-3);
    }

    tbody tr.r.soldrow .ph,
    tbody tr.r.soldrow .ph-txt,
    tbody tr.r.soldrow .cr,
    tbody tr.r.soldrow .cr-txt,
    tbody tr.r.soldrow .pos {
      opacity: .5;
    }

    tbody tr.r.soldrow .mark.sold {
      color: var(--text-2);
    }

    /* Unsold — a third state, not a dimmer sold or a plain available: a
     warm edge + wash flags "went to the block and didn't move," while
     text stays at full weight since it's still very much in play. */
    tbody tr.r.unsoldrow {
      background: var(--warn-wash);
    }

    tbody tr.r.unsoldrow td:first-child {
      box-shadow: inset 3px 0 0 var(--warn);
    }

    /* Keyboard highlight — a full-row fill, never a manager colour: light
     neutral grey (--select) with its own dark text pair, not a dimmed
     accent. Declared after sold/unsold above so wherever your cursor
     lands stays fully legible, overriding both of those states rather
     than blending with them. The position pill needs no override here —
     it paints its own opaque hue background and keeps its own on-color
     text (a direct rule on the pill itself, so it's untouched by this
     row-level colour flip) regardless of what's behind it. */
    tbody tr.r.hi td {
      background: var(--select);
      color: var(--select-text);
    }

    tbody tr.r.hi .mark,
    tbody tr.r.hi.soldrow .mark.sold,
    tbody tr.r.hi.unsoldrow .mark.unsold,
    tbody tr.r.hi .cr-txt {
      color: var(--select-text-2);
    }

    tbody tr.r.hi.soldrow .ph,
    tbody tr.r.hi.soldrow .ph-txt,
    tbody tr.r.hi.soldrow .cr,
    tbody tr.r.hi.soldrow .cr-txt,
    tbody tr.r.hi.soldrow .pos {
      opacity: 1;
    }

    tr.grp td {
      /* Sit 1px into the real header rather than flush against it. thead's
       cells and this cell are each their own composited sticky layer, and
       Chrome/WebKit round their fractional positions to device pixels
       independently — even a computed 0px gap between them can still show
       a 1-device-pixel seam (a sliver of the row behind), because the two
       layers' roundings aren't guaranteed to agree. An intentional 1px
       overlap removes the seam outright: there's always something opaque
       covering that pixel regardless of which way either layer rounds.
       Padding is bumped by the same 1px so the label text doesn't shift. */
      position: sticky;
      top: calc(var(--th-h, 28px) - 1px);
      z-index: 4;
      background: var(--panel);
      color: var(--text);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 6px 8px 5px;
      border-bottom: 1px solid var(--line);
      contain: paint;
    }

    th.num,
    td.num,
    td.val {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    td.val {
      font-weight: 700;
    }

    .ph {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--bg);
      display: block;
    }

    .ph-txt {
      display: flex;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--line);
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
    }

    .nmwrap {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      max-width: 100%;
    }

    .nmwrap .nm {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .mark:empty {
      display: none;
    }

    .mark-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: none;
    }

    .mark.unsold {
      color: var(--warn);
      letter-spacing: .03em;
    }

    .mark.sold {
      color: var(--text-2);
    }

    .club {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .cr {
      width: 16px;
      height: 16px;
      object-fit: contain;
      flex: none;
    }

    .cr-txt {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      flex: none;
      min-width: 16px;
    }

    .club .nm {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pos {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--on-color);
    }

    /* Grouped-by-position view already sections rows under a position
     header — the per-row pill would just repeat it, so it's dropped. */
    table.grouped-view tbody td .pos {
      display: none;
    }

    /* ---------- transaction log view ---------- */
    .logview {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
    }

    .logview[hidden] {
      display: none;
    }

    .log-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 7px 12px;
      background: var(--hd);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      font-weight: 700;
    }

    .log-head .log-hint {
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }

    .log-row {
      display: grid;
      grid-template-columns: 44px 64px 92px 1fr;
      gap: 10px;
      align-items: baseline;
      padding: 5px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .log-row.alt {
      background: var(--row2);
    }

    .log-seq {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    .log-time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    .log-type {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 1px 0;
      border-radius: 4px;
      border: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      white-space: nowrap;
    }

    .log-type.t-sale {
      color: var(--accent);
      border-color: var(--accent);
    }

    .log-type.t-unsold {
      color: var(--warn);
      border-color: var(--warn);
    }

    .log-type.t-edit_price,
    .log-type.t-reassign {
      color: var(--text);
      border-color: var(--text);
    }

    .log-type.t-release {
      color: var(--muted);
    }

    .log-type.t-undo {
      color: var(--err);
      border-color: var(--err);
    }

    .log-what {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 5px;
    }

    .log-owner-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: none;
      align-self: center;
    }

    .log-what .sub {
      color: var(--muted);
    }

    .log-row.undone .log-what {
      opacity: .5;
      text-decoration: line-through;
    }

    .log-row.undone .log-seq::after {
      content: " ↩";
      color: var(--err);
      text-decoration: none;
    }

    .log-empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- undo / status toast ---------- */
    .toast {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      max-width: min(760px, 92vw);
      padding: 9px 15px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
      font-size: 13px;
      color: var(--text);
    }

    .toast[hidden] {
      display: none;
    }

    .toast.warn {
      border-color: var(--warn);
    }

    .toast b {
      font-weight: 800;
    }

    /* ---------- invariant failure banner ---------- */
    .invariant-banner {
      background: var(--err);
      color: var(--on-color);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .invariant-banner[hidden] {
      display: none;
    }

    .invariant-banner ul {
      margin: 4px 0 0;
      padding-left: 18px;
      font-weight: 400;
      max-height: 120px;
      overflow: auto;
    }

    /* ---------- edit / reassign dialog ---------- */
    .editoverlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .5);
      padding: 20px;
    }

    .editoverlay[hidden] {
      display: none;
    }

    .editdialog {
      width: min(760px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
    }

    .edit-head {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .edit-head-info {
      min-width: 0;
    }

    .edit-title {
      font-size: 18px;
      font-weight: 800;
    }

    .edit-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .edit-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .edit-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .editdialog input.price {
      margin-left: 0;
      width: 110px;
      font-size: 16px;
    }

    .edit-mgrs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .edit-mgr {
      text-align: left;
      padding: 7px 9px 7px 8px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--mgr-color, var(--border));
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font: inherit;
    }

    .edit-mgr.on {
      border-color: var(--select);
      border-left-color: var(--select);
      box-shadow: 0 0 0 1px var(--select) inset;
    }

    .edit-mgr.blocked {
      opacity: .5;
    }

    .edit-mgr b {
      display: block;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-mgr .em-line {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .edit-mgr .flag-err {
      color: var(--err);
      font-weight: 700;
    }

    .edit-mgr .flag-warn {
      color: var(--warn);
      font-weight: 700;
    }

    .edit-mgr .em-cur {
      color: var(--accent);
      font-weight: 700;
    }

    .edit-msg {
      font-size: 12px;
      font-weight: 600;
      min-height: 16px;
    }

    .edit-msg.err {
      /* scoped override: the page-level .err is the load-failure box */
      margin: 0;
      max-width: none;
      background: none;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: var(--err);
    }

    .edit-msg.warn {
      color: var(--warn);
    }

    .edit-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 11px 14px;
      border-top: 1px solid var(--line);
    }

    .edit-foot .spacer {
      flex: 1;
    }

    .edit-foot button {
      padding: 6px 12px;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
    }

    .edit-foot button.primary {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .edit-foot button.danger {
      border-color: var(--err);
      color: var(--err);
    }

    .edit-foot button[disabled] {
      opacity: .4;
      cursor: default;
    }

    /* teams-view rows are the entry point to edit/reassign */
    .team-row.clickable {
      cursor: pointer;
    }

    .team-row.clickable:hover {
      background: var(--hover);
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    .err {
      margin: 24px auto;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--err);
      border-left: 4px solid var(--err);
      border-radius: 8px;
      padding: 16px 18px;
    }

    .err h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--err);
    }

    .err p {
      margin: 6px 0;
    }

    .err ul {
      margin: 10px 0 0;
      padding-left: 18px;
      max-height: 360px;
      overflow: auto;
    }

    .err li {
      margin: 2px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }

    /* ============================================================
       LIVE MIRRORING — room bar, connection status, viewer chrome.
       Everything here is additive: with mirroring off, none of these
       elements are ever shown and the host layout is byte-identical
       to what it was.
       ============================================================ */

    /* Host only. The room key and the viewer link are the two things
       someone has to read off this screen and type into a phone, so
       they get their own full-width row at the very top rather than a
       corner chip. */
    .roombar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 6px 10px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .roombar[hidden] {
      display: none;
    }

    .roombar-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-size: 10px;
      font-weight: 700;
    }

    .roombar-key {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--text);
      padding: 1px 8px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--bg);
    }

    .roombar-url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--accent);
      user-select: all;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 46vw;
    }

    .roombar-note {
      color: var(--text-3);
      font-size: 11px;
    }

    /* Connection chip — sits beside the save status, same visual weight,
       because "am I saving?" and "am I mirroring?" are the same class of
       question and both have to be answerable at a glance mid-lot. */
    .live-status {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
    }

    .live-status.ok {
      color: var(--ok);
      font-weight: 600;
    }

    .live-status.pending {
      color: var(--muted);
      font-style: italic;
    }

    .live-status.warn {
      color: var(--warn);
      font-weight: 700;
    }

    .live-status.bad {
      color: var(--err);
      font-weight: 700;
    }

    /* Stale-data banner. A phone propped up across the room is exactly
       where a frozen screen looks identical to a live one, so a dropped
       connection gets a full-width bar, not just the chip above. */
    .live-banner {
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--on-color);
      background: var(--err);
    }

    .live-banner.warn {
      background: var(--warn);
      color: #1b1206;
    }

    .live-banner[hidden] {
      display: none;
    }

    .viewer-badge {
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--select);
    }

    /* Collapsible player table (viewer). The lot panel and wallets are
       what a viewer actually watches; the 900-row table is reference
       material and on a phone it would push everything else off screen. */
    .listtoggle {
      display: none;
    }

    body.viewer .listtoggle {
      display: inline-block;
    }

    body.viewer .auctionview.listcollapsed .main {
      display: none;
    }

    /* Read-only: nothing in the mirrored views is clickable, so nothing
       should advertise that it is. */
    body.viewer tbody tr.r,
    body.viewer .team-row.clickable {
      cursor: default;
    }

    body.viewer tbody tr.r:hover {
      background: inherit;
    }

    body.viewer tbody tr.r.alt:hover {
      background: var(--row2);
    }

    /* ---------- seats ----------
       The identity strip. On the host it is the control surface for
       every seat in the room, and it sits directly under the room bar
       at the top of the screen rather than behind a settings panel:
       people swap laptop for phone mid-auction, and a release that
       takes three clicks to find is a release that doesn't happen in
       time. On a viewer it is one line saying who this device is, or
       the way to ask to be someone. */
    .seatbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px 10px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .seatbar[hidden] {
      display: none;
    }

    .seatbar-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-size: 10px;
      font-weight: 700;
    }

    /* One chip per seat. The manager's colour is carried on the left
       edge so a seat reads as the same identity it has in the wallet
       strip and the lot panel, not as a separate list of names. */
    .seat-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 7px 3px 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-strong);
      border-radius: 6px;
    }

    .seat-chip-name {
      font-weight: 700;
      color: var(--text);
    }

    .seat-chip-state {

<body>
  <div id="app"></div>

  <script>
    "use strict";

    /* ============================================================
       CONFIG — league rules live here. Logic below reads from this
       object only; nothing about "four managers" or the numbers is
       hardcoded, so a different league = edit this block alone.
       ============================================================ */
    const CONFIG = {
      // `color` is each manager's identity everywhere in the UI — wallet
      // card, lot panel, teams column, sold-row marker, log entries. Pick
      // four that stay distinguishable side by side and don't lean on a
      // red/green pair; a fifth manager with no colour set here falls back
      // to an auto-generated one (see managerColor()).
      managers: [
        { name: "Rizzie", photo: "assets/managers/1.jpeg", color: "#5b9bff" },
        { name: "Shreyas", photo: "assets/managers/2.jpeg", color: "#e2953a" },
        { name: "Savya", photo: "assets/managers/3.jpeg", color: "#b47ee8" },
        { name: "Shauryavardhan", photo: "assets/managers/4.jpeg", color: "#2fb8ac" }
      ],
      startingBudget: 1000,
      squadSize: 20,
      minBid: 1,
      positionOrder: ["GK", "DEF", "MID", "FWD"],
      positionLimits: { GK: [1, 2], DEF: [3, 7], MID: [3, 7], FWD: [2, 6] },
      maxPerClub: 4,
      imageUrls: {
        player: "https://img.uefa.com/imgml/TP/players/1/2027/324x324/{id}.jpg",
        club: "https://img.uefa.com/imgml/TP/teams/logos/140x140/{id}.png"
      },
      // Live mirroring target. Only the host ever writes here; viewers
      // only read. Blanking this object out disables mirroring entirely
      // and leaves the single-browser app exactly as it was.
      firebase: {
        apiKey: "AIzaSyB_VQvsrZb1aLFLG8GDo37XI-Xyq3QIics",
        authDomain: "ucl-auction-live.firebaseapp.com",
        databaseURL: "https://ucl-auction-live-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ucl-auction-live",
        storageBucket: "ucl-auction-live.firebasestorage.app",
        messagingSenderId: "395804926714",
        appId: "1:395804926714:web:d65dd53f0a30d8ebf95f43"
      }
    };

    /* ---------- helpers ---------- */

    // Case- and accent-insensitive fold (so "Kovacic" matches "Kovačić").
    function norm(s) {
      return (s == null ? "" : String(s))
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase();
    }

    // Build an image URL from a CONFIG template, or null if the template
    // (or the id) is missing — caller then renders the text fallback.
    function imgUrl(tpl, id) {
      if (!tpl || id == null || id === "") return null;
      return tpl.replace("{id}", encodeURIComponent(id));
    }

    // Stable hue per position string — no position names hardcoded.
    function hueOf(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h % 360;
    }

    // One or two initials from a manager's name, for the photo fallback block.
    function initialsOf(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return "?";
    }

    // Evenly spread, distinct fallback colour per manager index — works for any
    // league size, not just four.
    function managerColor(i) {
      return `hsl(${(i * 137.508) % 360} 55% 38%)`;
    }

    function isNum(v) { return typeof v === "number" && !isNaN(v); }
    function fmtInt(v) { return isNum(v) ? String(v) : "·"; }
    function fmtVal(v) { return isNum(v) ? v.toFixed(1) : "·"; }
    function fmtMoney(v) { return isNum(v) ? String(v) : "·"; }

    /* ============================================================
       PERSISTENCE — shared helpers used both before the main UI
       exists (validating/prompting about autosaved data found on
       load) and from inside it (export / import / reset). Nothing
       here touches the player records directly; state shape only.
       ============================================================ */

    const STORAGE_KEY = "uclAuction.state.v1";
    const SCHEMA_VERSION = 1;
    const VALID_STATUS = new Set(["available", "sold", "unsold"]);

    // Same shape is used for autosave persistence and for export/import
    // files: { schema, savedAt, players: [...], log: [...], config? }.
    // Only id/status/owner/price are ever trusted off of `players` —
    // everything else about a player comes fresh from players.json.
    function validateStateShape(obj) {
      const errs = [];
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) { errs.push("Not a JSON object."); return errs; }
      if (!Array.isArray(obj.players)) errs.push('Missing or invalid "players" array.');
      if (!Array.isArray(obj.log)) errs.push('Missing or invalid "log" array.');
      if (errs.length) return errs;
      if (!obj.players.length) errs.push('"players" array is empty.');
      const seen = new Set();
      obj.players.forEach((p, i) => {
        if (!p || typeof p !== "object") { errs.push(`players[${i}] is not an object.`); return; }
        if (p.id == null || p.id === "") { errs.push(`players[${i}] is missing an id.`); return; }
        const key = String(p.id);
        if (seen.has(key)) errs.push(`players[${i}]: duplicate id ${key}.`);
        seen.add(key);
        if (!VALID_STATUS.has(p.status)) { errs.push(`players[${i}] (id ${key}): invalid status ${JSON.stringify(p.status)}.`); return; }
        if (p.status === "sold") {
          if (!isNum(p.price)) errs.push(`players[${i}] (id ${key}): sold but price is not a number.`);
          if (!(Number.isInteger(p.owner) && p.owner >= 0 && p.owner < CONFIG.managers.length)) {
            errs.push(`players[${i}] (id ${key}): sold but owner ${JSON.stringify(p.owner)} is not a valid manager index (0–${CONFIG.managers.length - 1}).`);
          }
        } else {
          if (p.owner != null) errs.push(`players[${i}] (id ${key}): ${p.status} but has an owner set.`);
          if (p.price != null) errs.push(`players[${i}] (id ${key}): ${p.status} but has a price set.`);
        }
      });
      obj.log.forEach((e, i) => {
        if (!e || typeof e !== "object" || typeof e.seq !== "number" || typeof e.type !== "string" ||
          e.pid == null || !e.prev || !e.next) {
          errs.push(`log[${i}] is missing required fields.`);
        }
      });
      return errs;
    }

    function idSetOf(players) { return new Set(players.map(p => String(p.id))); }
    function setsEqual(a, b) { return a.size === b.size && [...a].every(x => b.has(x)); }

    function readLocalStorageRaw() {
      try { return { ok: true, raw: localStorage.getItem(STORAGE_KEY) }; }
      catch (e) { return { ok: false, error: e }; }
    }

    function jsonReplacer(k, v) { return typeof k === "string" && k.startsWith("_") ? undefined : v; }

    function downloadText(text, filename, mime) {
      const blob = new Blob([text], { type: mime || "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadJSON(obj, filename) {
      downloadText(JSON.stringify(obj, jsonReplacer, 2), filename, "application/json");
    }

    function tsForFilename(d) {
      const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
    }
    function exportFilename() { return `auction-export-${tsForFilename(new Date())}.json`; }
    function backupFilename() { return `auction-backup-${tsForFilename(new Date())}.json`; }

    // Minimal generic confirm/prompt dialog, reused for every persistence
    // decision (corrupt autosave, mismatched restore, invalid/mismatched
    // import, reset). Built fresh each call and mounted on <body> — so it
    // works even before the main UI exists, and never fights app.replaceChildren.
    function buildConfirmDialog() {
      const overlay = document.createElement("div");
      overlay.className = "editoverlay";
      const dialog = document.createElement("div");
      dialog.className = "editdialog";
      dialog.setAttribute("role", "dialog");
      dialog.setAttribute("aria-modal", "true");
      const head = document.createElement("div");
      head.className = "edit-head";
      const headInfo = document.createElement("div");
      headInfo.className = "edit-head-info";
      const title = document.createElement("div");
      title.className = "edit-title";
      const sub = document.createElement("div");
      sub.className = "edit-sub";
      headInfo.append(title, sub);
      head.append(headInfo);
      const body = document.createElement("div");
      body.className = "edit-body";
      const foot = document.createElement("div");
      foot.className = "edit-foot";
      dialog.append(head, body, foot);
      overlay.appendChild(dialog);
      return { overlay, title, sub, body, foot };
    }

    // buttons: [{ label, kind: "primary"|"danger"|undefined, onClick }]
    // No backdrop-click / Escape dismissal — these dialogs exist specifically
    // to force an explicit choice, never a silent default.
    function showConfirm({ title, sub, lines, buttons }) {
      const { overlay, title: t, sub: s, body, foot } = buildConfirmDialog();
      t.textContent = title;
      if (sub) s.textContent = sub; else s.remove();
      for (const ln of (lines || [])) {
        const p = document.createElement("div");
        p.textContent = ln;
        p.style.marginBottom = "6px";
        body.appendChild(p);
      }
      function close() { overlay.remove(); }
      for (const b of buttons) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = b.label;
        if (b.kind) btn.className = b.kind;
        btn.addEventListener("click", () => { close(); if (b.onClick) b.onClick(); });
        foot.appendChild(btn);
      }
      document.body.appendChild(overlay);
      return close;
    }

    const app = document.getElementById("app");

    /* ---------- error screen ---------- */

    function showError(title, lines) {
      app.replaceChildren();
      const box = document.createElement("div");
      box.className = "err";
      const h = document.createElement("h2");
      h.textContent = title;
      box.appendChild(h);
      const ul = document.createElement("ul");
      for (const ln of lines) {
        const li = document.createElement("li");
        li.textContent = ln;
        ul.appendChild(li);
      }
      box.appendChild(ul);
      app.appendChild(box);
    }

    /* ============================================================
       LIVE MIRRORING
       ------------------------------------------------------------
       One host drives the auction exactly as before and publishes a
       small snapshot after every change; up to a handful of viewers
       subscribe and re-derive everything locally. Strictly one-way:
       viewers never write to Firebase and never write auction state
       to localStorage.

       Role comes from the URL and nothing else:

         ?host        host — room key from localStorage, or a new one
         ?host=KEY    host — in room KEY
         ?room=KEY    viewer — in room KEY
         anything else   viewer with no room (instructions screen)

       Defaulting to viewer is the whole point of that table: someone
       opening the bare URL must not silently become a second writer.
       Two hosts on one room would interleave two different truths
       into the same node, so a host that finds another host already
       heartbeating refuses to start rather than racing it.

       This whole block is additive. If Firebase never loads, the host
       app below still runs exactly as it did on localStorage alone —
       localStorage remains the crash-recovery path, mirroring is only
       a second, lossy copy for people watching.
       ============================================================ */

    const LIVE_CFG = {
      // Pinned: an auction is not the moment to discover that "latest"
      // changed an API. ES module CDN — no npm, no bundler, no build.
      sdkVersion: "10.12.2",
      root: "rooms",
      logLimit: 20,            // last N log entries published, display only
      heartbeatMs: 5000,       // host liveness ping
      staleHostMs: 20000,      // a host quiet for this long is assumed gone
      connectTimeoutMs: 9000,  // how long a starting host waits before giving up
      publishDebounceMs: 120,  // coalesces the render+publish burst of one action
      roomKeyStorage: "uclAuction.roomKey.v1",
      authTimeoutMs: 9000,     // how long a starting host waits for a uid
      seatPrefix: "m"          // seat ids are seatPrefix + manager index
    };

    // Seat ids are derived from the manager index and nothing else, so the
    // host can rebuild the seat list on every load without ever minting a
    // second seat for the same manager. Must stay in step with the $seat
    // pattern in database.rules.json.
    function seatIdFor(managerId) { return LIVE_CFG.seatPrefix + managerId; }

    // Opt-in local testing against `firebase emulators:start`, off unless the
    // URL says so. Present because the rules below cannot be exercised against
    // production without deploying them, and deploying them is not something
    // this branch gets to do. Delete this and its two uses to drop the hook.
    const USE_EMULATOR = new URLSearchParams(location.search).has("emu");

    // Firebase keys can't contain . $ # [ ] / — and this string gets read
    // aloud and typed on a phone, so keep it to lowercase alphanumerics.
    function cleanRoomKey(s) {
      return String(s == null ? "" : s).trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 40);
    }

    function randomChars(n, alphabet) {
      let out = "";
      const buf = new Uint8Array(n);
      try {
        crypto.getRandomValues(buf);
        for (let i = 0; i < n; i++) out += alphabet[buf[i] % alphabet.length];
      } catch (e) {
        for (let i = 0; i < n; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
      }
      return out;
    }

    // No 0/o/1/l/i — these get dictated across a room. Twelve characters
    // because the key is shared as a URL rather than typed: with no
    // authentication anywhere in this app, guessing a live room key is the
    // one unauthenticated attack the database rules cannot close, and length
    // is what closes it. ROOM_KEY_RE must stay in step with the regex in
    // database.rules.json — the rules reject any room whose key doesn't match.
    const ROOM_KEY_ALPHABET = "23456789abcdefghjkmnpqrstuvwxyz";
    const ROOM_KEY_LEN = 12;
    const ROOM_KEY_RE = /^[a-hjkmnp-z2-9]{12}$/;
    function newRoomKey() { return randomChars(ROOM_KEY_LEN, ROOM_KEY_ALPHABET); }
    function isRoomKey(s) { return ROOM_KEY_RE.test(String(s == null ? "" : s)); }
    function newSessionId() { return randomChars(16, "abcdefghijklmnopqrstuvwxyz0123456789"); }

    // A key from before the length change (or any other shape the rules would
    // now reject) is dropped rather than reused — the caller then generates a
    // fresh one instead of failing the claim on a permission error.
    function readStoredRoomKey() {
      try {
        const k = cleanRoomKey(localStorage.getItem(LIVE_CFG.roomKeyStorage));
        return isRoomKey(k) ? k : "";
      } catch (e) { return ""; }
    }

    function storeRoomKey(k) {
      // Best effort — a host that can't persist this just gets a new room
      // on refresh, which the room bar makes obvious.
      try { localStorage.setItem(LIVE_CFG.roomKeyStorage, k); } catch (e) { /* nothing to do */ }
    }

    function detectRole() {
      const qs = new URLSearchParams(location.search);
      if (qs.has("host")) {
        const asked = cleanRoomKey(qs.get("host"));
        return { role: "host", roomKey: asked || readStoredRoomKey() || newRoomKey() };
      }
      return { role: "viewer", roomKey: cleanRoomKey(qs.get("room")) };
    }

    function viewerUrlFor(roomKey) {
      const base = location.origin && location.origin !== "null"
        ? location.origin + location.pathname
        : location.href.split("?")[0].split("#")[0];
      return base + "?room=" + encodeURIComponent(roomKey);
    }

    function liveConfigured() {
      const f = CONFIG.firebase;
      return !!(f && f.apiKey && f.databaseURL);
    }

    function errText(e) { return String((e && (e.message || e.code)) || e || "unknown error"); }

    /* ---------- the live client ----------
       A plain state bag plus a few async entry points. The UI reads the
       flags on every tick to draw the status chip; it never has to know
       anything about Firebase itself. */

    function createLive(role, roomKey) {
      const L = {
        role,
        roomKey,
        sessionId: newSessionId(),
        enabled: false,        // Firebase is up and this client may use it
        reason: "",            // why not, when not
        connected: false,      // .info/connected
        hostPresent: false,    // viewer: is a host heartbeating right now?
        lastHostBeat: 0,       // viewer: server time of that heartbeat
        hasRemote: false,      // viewer: has any snapshot arrived at all?
        lastPublishAt: null,   // host
        lastReceiveAt: null,   // viewer
        publishError: "",
        lostRoom: false,       // host: another session claimed the room
        uid: "",               // this browser's anonymous uid, "" until signed in
        authError: "",         // why there is no uid, when there isn't one
        seats: {},             // seat id -> { manager, name, uid?, open? }
        requests: {},          // requesting uid -> { seat, at }
        seatsReady: false,     // has the seat list arrived at least once?
        seatError: "",         // last seat write that failed, if any
        onStatus: null,        // set by the UI
        onSeats: null,         // set by the UI
        onRemoteState: null    // set by the UI (viewer only)
      };

      let fb = null;               // the bits of the SDK we use
      let serverOffset = 0;        // ms to add to Date.now() for server time
      let hostRef = null;
      let hostStartedAt = 0;
      let stateRef = null;
      let heartbeatTimer = null;
      let publishTimer = null;
      let buildPayload = null;     // set by the UI; called off the click path
      let publishInFlight = false;
      let publishAgain = false;

      function status() {
        // Status chrome must never be able to break the auction.
        if (L.onStatus) { try { L.onStatus(L); } catch (e) { /* ignore */ } }
      }

      function serverNow() { return Date.now() + serverOffset; }

      function seatsChanged() {
        // Same contract as status(): identity chrome must never be able to
        // break the auction.
        if (L.onSeats) { try { L.onSeats(L); } catch (e) { /* ignore */ } }
      }

      /* ---- identity ----
         Anonymous auth gives this BROWSER a persistent uid — not this
         person. The same manager on a laptop and a phone is two uids, and
         clearing site data mints a third, which is the whole reason seats
         exist as a separate, host-controlled layer on top. Nothing in this
         file may assume a uid identifies a human being. */

      // Resolves with the uid. The observer stays attached afterwards so a
      // token refresh or a signed-out state is reflected rather than cached.
      function startAuth() {
        return new Promise((resolve, reject) => {
          let settled = false;
          const fail = e => {
            L.authError = errText(e);
            status();
            seatsChanged();
            if (!settled) { settled = true; reject(e); }
          };
          fb.onAuthStateChanged(fb.auth, user => {
            L.uid = user ? user.uid : "";
            if (user) L.authError = "";
            status();
            seatsChanged();
            if (user && !settled) { settled = true; resolve(user.uid); }
          }, fail);
          fb.signInAnonymously(fb.auth).catch(fail);
        });
      }

      function withTimeout(promise, ms, message) {
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => reject(new Error(message)), ms);
          promise.then(v => { clearTimeout(t); resolve(v); }, e => { clearTimeout(t); reject(e); });
        });
      }

      async function loadSdk() {
        const v = LIVE_CFG.sdkVersion;
        const [appMod, dbMod, authMod] = await Promise.all([
          import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
          import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`),
          import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`)
        ]);
        const app = appMod.initializeApp(CONFIG.firebase);
        const db = dbMod.getDatabase(app);
        const auth = authMod.getAuth(app);
        if (USE_EMULATOR) {
          dbMod.connectDatabaseEmulator(db, "127.0.0.1", 9000);
          authMod.connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
        }
        return {
          db,
          auth,
          ref: dbMod.ref,
          get: dbMod.get,
          set: dbMod.set,
          update: dbMod.update,
          remove: dbMod.remove,
          onValue: dbMod.onValue,
          runTransaction: dbMod.runTransaction,
          onDisconnect: dbMod.onDisconnect,
          serverTimestamp: dbMod.serverTimestamp,
          signInAnonymously: authMod.signInAnonymously,
          onAuthStateChanged: authMod.onAuthStateChanged
        };
      }

      // .info/connected drives the whole "is this screen live or frozen"
      // question for both roles, so it is wired up before anything else.
      function watchConnection() {
        fb.onValue(fb.ref(fb.db, ".info/connected"), snap => {
          const now = snap.val() === true;
          const reconnected = now && !L.connected;
          L.connected = now;
          // An onDisconnect is a one-shot the server fires and then forgets,
          // and firing it deleted our host record — so a reconnecting host
          // has to re-arm the handler and rewrite the record, not just carry
          // on heartbeating into a node that no longer says who owns it.
          if (reconnected && L.role === "host" && hostRef) armHostPresence();
          status();
        }, () => { L.connected = false; status(); });

        // Clock skew between this device and the server. Host staleness is
        // judged in server time so a phone with a wrong clock can't declare
        // a live host dead (or a dead one live).
        fb.onValue(fb.ref(fb.db, ".info/serverTimeOffset"), snap => {
          const v = snap.val();
          if (typeof v === "number" && isFinite(v)) serverOffset = v;
        }, () => { /* offset stays 0 — worst case we fall back to local time */ });
      }

      // Resolves with the first value at `path`, or undefined on timeout/error.
      // `unsub` is assigned after onValue returns, so a callback that fires
      // synchronously has to be unsubscribed on the way out instead.
      function firstValue(path, ms) {
        return new Promise(resolve => {
          let done = false, unsub = null;
          const finish = v => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (unsub) unsub();
            resolve(v);
          };
          const timer = setTimeout(() => finish(undefined), ms);
          unsub = fb.onValue(fb.ref(fb.db, path), snap => finish(snap.val()), () => finish(undefined));
          if (done) unsub();
        });
      }

      // Waits for connected === true specifically — the first value is very
      // often `false`, so this can't be firstValue().
      function waitForConnection(ms) {
        return new Promise((resolve, reject) => {
          if (L.connected) { resolve(); return; }
          let done = false, unsub = null;
          const finish = (err) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (unsub) unsub();
            if (err) reject(err); else resolve();
          };
          const timer = setTimeout(() => finish(new Error("Timed out waiting for a Firebase connection.")), ms);
          unsub = fb.onValue(fb.ref(fb.db, ".info/connected"), snap => {
            if (snap.val() === true) finish(null);
          }, err => finish(err));
          if (done && unsub) unsub();
        });
      }

      /* ---- host ---- */

      // Returns { ok: true } or { ok: false, conflict: <other host record> }.
      // The transaction is what makes this safe against two hosts opening
      // the link at the same instant: only one write can win, and the loser
      // sees the winner's record and aborts.
      async function claimHost() {
        if (!L.uid) throw new Error("Not signed in — cannot claim a room without a uid.");
        hostRef = fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/host`);
        let conflict = null;
        const res = await fb.runTransaction(hostRef, cur => {
          if (cur && cur.sessionId && cur.sessionId !== L.sessionId) {
            const beat = typeof cur.heartbeatAt === "number" ? cur.heartbeatAt : 0;
            if (serverNow() - beat < LIVE_CFG.staleHostMs) {
              conflict = cur;
              return;                      // abort — someone else is driving
            }
          }
          // serverTimestamp() sentinels aren't allowed inside a transaction,
          // so write server-corrected local time; the heartbeat below uses
          // the real sentinel from then on.
          return {
            sessionId: L.sessionId,
            // The rules require this to equal the caller's own uid, and only
            // this uid may then write auction state or touch a seat. It is
            // the browser, not the person: the same host reloading keeps the
            // uid and walks straight back into the room.
            uid: L.uid,
            startedAt: (cur && cur.sessionId === L.sessionId && cur.startedAt) || serverNow(),
            heartbeatAt: serverNow()
          };
        }, { applyLocally: false });

        if (!res.committed) {
          return { ok: false, conflict: conflict || (res.snapshot && res.snapshot.val()) || null };
        }
        const mine = res.snapshot && res.snapshot.val();
        hostStartedAt = (mine && typeof mine.startedAt === "number") ? mine.startedAt : serverNow();
        return { ok: true };
      }

      // sessionId and startedAt go out with every beat, not just the claim:
      // if the record was wiped by an onDisconnect we'd otherwise leave behind
      // a node with a heartbeat and no owner, which the next host to arrive
      // would read as "unclaimed" and take.
      function writeHostRecord() {
        if (!fb || !hostRef) return;
        fb.update(hostRef, {
          sessionId: L.sessionId,
          uid: L.uid,
          startedAt: hostStartedAt || fb.serverTimestamp(),
          heartbeatAt: fb.serverTimestamp()
        }).catch(() => { /* the next beat retries */ });
      }

      function armHostPresence() {
        if (!fb || !hostRef) return;
        try { fb.onDisconnect(hostRef).remove(); } catch (e) { /* best effort */ }
        writeHostRecord();
      }

      function startHeartbeat() {
        // A cleanly closed tab frees the room immediately; the heartbeat
        // covers the messy cases (asleep laptop, killed process, lost wifi)
        // by letting the record go stale on its own.
        armHostPresence();
        heartbeatTimer = setInterval(writeHostRecord, LIVE_CFG.heartbeatMs);

        // If our own session id ever disappears from the room, someone else
        // has taken it. Stop publishing rather than interleave with them.
        fb.onValue(hostRef, snap => {
          const cur = snap.val();
          const lost = !!(cur && cur.sessionId && cur.sessionId !== L.sessionId);
          if (lost !== L.lostRoom) { L.lostRoom = lost; status(); }
        }, () => { /* read errors show up as a dropped connection instead */ });
      }

      // Resolves to { ok: true } | { ok: false, kind: "conflict"|"error", ... }.
      async function startHost() {
        if (!liveConfigured()) return { ok: false, kind: "error", message: "No Firebase config in CONFIG.firebase." };
        try {
          fb = await loadSdk();
          watchConnection();
          // Sign-in is started before the wait so the two overlap, but the
          // host genuinely cannot continue without a uid: the claim writes it
          // and the rules reject a claim that doesn't. A host blocking here is
          // the intended behaviour — it is already blocked on the claim, and
          // building a keyboard it must not use would be worse.
          const authed = startAuth();
          await waitForConnection(LIVE_CFG.connectTimeoutMs);
          await withTimeout(authed, LIVE_CFG.authTimeoutMs, "Timed out signing in to Firebase.");
          // Staleness of the existing host record is judged in server time, so
          // the offset has to be in hand before the claim transaction runs.
          const off = await firstValue(".info/serverTimeOffset", 2500);
          if (typeof off === "number" && isFinite(off)) serverOffset = off;
          const claim = await claimHost();
          if (!claim.ok) return { ok: false, kind: "conflict", conflict: claim.conflict };
          startHeartbeat();
          stateRef = fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/state`);
          L.enabled = true;
          watchSeats();
          status();
          window.addEventListener("pagehide", releaseHost);
          return { ok: true };
        } catch (e) {
          L.reason = errText(e);
          status();
          return { ok: false, kind: "error", message: L.reason };
        }
      }

      function releaseHost() {
        if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
        if (fb && hostRef) { try { fb.remove(hostRef); } catch (e) { /* onDisconnect covers it */ } }
      }

      /* ---- seats ----
         Both roles subscribe: reads are open to anyone with the room key,
         so a viewer can see the seat list (and whether the one it wants is
         free) without being signed in yet. Writes are where the roles part,
         and the rules — not this code — are what enforce that.

         A seat is in exactly one of three states:
           { manager, name }              never claimed — needs approval
           { manager, name, uid }         held by that browser
           { manager, name, open: true }  released — free to take, no approval

         Release is what moves a seat back to `open`, and it is host-only.
         That is the whole trick behind "switching devices doesn't need a
         second approval": the host authorises the seat once by opening it,
         and whoever asks next takes it directly. */

      function seatRef(seatId) { return fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/seats/${seatId}`); }
      function requestRef(uid) { return fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/requests/${uid}`); }

      function watchSeats() {
        fb.onValue(fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/seats`), snap => {
          L.seats = snap.val() || {};
          L.seatsReady = true;
          seatsChanged();
        }, () => { L.seats = {}; seatsChanged(); });

        // Small enough to mirror whole on every client. A viewer only cares
        // about its own row, but it can't filter server-side without a uid
        // it may not have yet, and reads are open regardless.
        fb.onValue(fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/requests`), snap => {
          L.requests = snap.val() || {};
          seatsChanged();
        }, () => { L.requests = {}; seatsChanged(); });
      }

      // Host: bring the room's seats in line with the manager list, without
      // ever disturbing who is sitting in one. Names come from CONFIG via
      // MANAGERS and nowhere else, so editing a name there and reloading
      // renames the seat while the holder keeps their place.
      async function ensureSeats(defs) {
        if (!fb || !L.enabled || L.role !== "host") return;
        const seatsRef = fb.ref(fb.db, `${LIVE_CFG.root}/${L.roomKey}/seats`);
        let cur = {};
        try {
          const snap = await fb.get(seatsRef);
          cur = snap.val() || {};
        } catch (e) { return; }   // a failed read here must not stop the auction

        const updates = {};
        const wanted = new Set();
        for (const d of defs) {
          wanted.add(d.id);
          const ex = cur[d.id];
          if (ex && ex.manager === d.manager && ex.name === d.name) continue;
          const next = { manager: d.manager, name: d.name };
          if (ex && ex.uid) next.uid = ex.uid;
          else if (ex && ex.open === true) next.open = true;
          updates[d.id] = next;
        }
        // A manager removed from CONFIG leaves a seat nobody can be.
        for (const id in cur) if (!wanted.has(id)) updates[id] = null;

        if (!Object.keys(updates).length) return;
        try { await fb.update(seatsRef, updates); L.seatError = ""; }
        catch (e) { L.seatError = errText(e); }
        seatsChanged();
      }

      // Claimant side. requestSeat is the only write a non-host makes on a
      // seat it has not been given, and it writes to `requests`, not to the
      // seat — the rules key that node by uid, so a device can only ever ask
      // on its own behalf.
      function requestSeat(seatId) {
        if (!fb || !L.uid) return Promise.reject(new Error("Not signed in yet."));
        return fb.set(requestRef(L.uid), { seat: seatId, at: fb.serverTimestamp() });
      }

      function cancelRequest() {
        if (!fb || !L.uid) return Promise.resolve();
        return fb.remove(requestRef(L.uid));
      }

      // Taking a seat the host has already released. Manager and name are
      // copied straight back so the rules' "carry these through untouched"
      // check passes; `open` is dropped, which is what closes the seat.
      function claimOpenSeat(seatId) {
        const seat = L.seats[seatId];
        if (!fb || !L.uid) return Promise.reject(new Error("Not signed in yet."));
        if (!seat) return Promise.reject(new Error("That seat no longer exists."));
        if (seat.open !== true || seat.uid) return Promise.reject(new Error("That seat is not open."));
        return fb.set(seatRef(seatId), { manager: seat.manager, name: seat.name, uid: L.uid });
      }

      /* ---- seats: host-only actions ---- */

      // Approve in one multi-path write so the seat and the pending request
      // can never disagree: either the device is seated and the request is
      // gone, or neither happened.
      function approveRequest(uid) {
        const req = L.requests[uid];
        if (!fb || !req) return Promise.reject(new Error("That request is gone."));
        const seat = L.seats[req.seat];
        if (!seat) return Promise.reject(new Error("That seat no longer exists."));
