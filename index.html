      editCancelBtn.textContent = "Cancel (Esc)";
      const editSpacer = document.createElement("span");
      editSpacer.className = "spacer";
      const editFoot = document.createElement("div");
      editFoot.className = "edit-foot";
      editFoot.append(editSaveBtn, editCancelBtn, editSpacer, editRevertBtn);

      editDialog.append(editHead, editBody, editFoot);
      editOverlay.appendChild(editDialog);

      // What the records would say if `p` moved to `targetId` at `price`.
      // Pure — computed by excluding p from the target's holdings and adding
      // it back, so it is correct for both a same-manager price edit and a
      // cross-manager move.
      function projectFor(targetId, p, price) {
        let spent = 0, slots = 0, posCount = 0, clubCount = 0;
        for (const q of ALL) {
          if (q === p) continue;
          if (q.status !== "sold" || q.owner !== targetId) continue;
          spent += Number(q.price) || 0;
          slots++;
          if (q.position === p.position) posCount++;
          if (q.club === p.club) clubCount++;
        }
        const remainingExcl = CONFIG.startingBudget - spent;
        const slotsLeftExcl = CONFIG.squadSize - slots;
        const maxBidExcl = slotsLeftExcl <= 0
          ? null
          : (slotsLeftExcl === 1 ? remainingExcl : remainingExcl - (slotsLeftExcl - 1) * CONFIG.minBid);
        const valid = isNum(price);
        return {
          remainingExcl, slotsExcl: slots, slotsLeftExcl, maxBidExcl,
          remainingAfter: remainingExcl - (valid ? price : 0),
          slotsAfter: slots + 1,
          posCountAfter: posCount + 1,
          clubCountAfter: clubCount + 1,
          noRoom: slotsLeftExcl <= 0,
          overBudget: valid && price > remainingExcl,
          overMaxBid: valid && maxBidExcl != null && price > maxBidExcl
        };
      }

      function readEditPrice() {
        const raw = editPrice.value.trim();
        if (raw === "") return { ok: false, msg: "Enter a price." };
        const price = Number(raw);
        if (!Number.isFinite(price)) return { ok: false, msg: "Price must be a number." };
        if (price < CONFIG.minBid) return { ok: false, msg: `Price must be at least ${CONFIG.minBid}.` };
        return { ok: true, price };
      }

      function renderEditDialog() {
        const p = editPlayer;
        if (!p) return;

        renderLotPhoto(editPhotoWrap, p);
        editTitle.textContent = p.name;
        editSub.textContent = `${p.position} · ${p.club} · UEFA value ${fmtVal(p.value)}`;
        editNow.textContent = `Currently ${stateWords(p)}`;

        const parsed = readEditPrice();
        const price = parsed.ok ? parsed.price : NaN;
        const posLim = CONFIG.positionLimits[p.position] || [0, 0];
        const posMax = posLim[1] || 0;
        const clubMax = CONFIG.maxPerClub || 0;

        let blockMsg = "", warnMsg = "";

        MANAGERS.forEach((m, i) => {
          const b = editMgrBtns[i];
          const proj = projectFor(m.id, p, price);
          const isCurrent = p.owner === m.id;
          b._nm.textContent = m.name + (isCurrent ? " · current" : "");
          b._nm.className = isCurrent ? "em-cur" : "";
          b._l1.textContent = parsed.ok
            ? `${fmtMoney(proj.remainingAfter)} left after · ${proj.slotsAfter}/${CONFIG.squadSize} slots`
            : `${fmtMoney(proj.remainingExcl)} available · ${proj.slotsAfter}/${CONFIG.squadSize} slots`;

          const posTxt = `${p.position} ${proj.posCountAfter}${posMax ? "/" + posMax : ""}`;
          const clubTxt = `${p.clubCode || p.club} ${proj.clubCountAfter}${clubMax ? "/" + clubMax : ""}`;
          b._l2.replaceChildren();
          const posSpan = document.createElement("span");
          posSpan.textContent = posTxt;
          if (posMax && proj.posCountAfter > posMax) posSpan.className = "flag-err";
          const sep = document.createTextNode(" · ");
          const clubSpan = document.createElement("span");
          clubSpan.textContent = clubTxt;
          if (clubMax && proj.clubCountAfter > clubMax) clubSpan.className = "flag-err";
          b._l2.append(posSpan, sep, clubSpan);

          const blocked = proj.noRoom || proj.overBudget;
          b.classList.toggle("blocked", blocked);
          b.classList.toggle("on", editTarget === m.id);

          if (editTarget === m.id) {
            if (proj.noRoom) {
              blockMsg = `${m.name}'s squad is already full (${CONFIG.squadSize}/${CONFIG.squadSize}).`;
            } else if (proj.overBudget) {
              blockMsg = `${fmtMoney(price)} is over budget — ${m.name} would have ${fmtMoney(proj.remainingExcl)} available for this player.`;
            } else if (parsed.ok) {
              const bits = [];
              if (proj.overMaxBid) {
                const slotsAfterLeft = proj.slotsLeftExcl - 1;
                bits.push(`${fmtMoney(price)} exceeds ${m.name}'s max bid (${fmtMoney(proj.maxBidExcl)}) — leaves ${fmtMoney(proj.remainingAfter)} for ${slotsAfterLeft} slot${slotsAfterLeft === 1 ? "" : "s"}`);
              }
              if (posMax && proj.posCountAfter > posMax) bits.push(`${p.position} would be ${proj.posCountAfter}/${posMax}`);
              if (clubMax && proj.clubCountAfter > clubMax) bits.push(`${p.club} would be ${proj.clubCountAfter}/${clubMax}`);
              if (bits.length) warnMsg = "⚠ " + bits.join(" · ") + ".";
            }
          }
        });

        if (!parsed.ok) blockMsg = blockMsg || parsed.msg;
        editErr.textContent = blockMsg;
        editWarn.textContent = blockMsg ? "" : warnMsg;
        editSaveBtn.disabled = !!blockMsg || editTarget == null;
        editSaveBtn.textContent = warnMsg && !blockMsg ? "Save anyway ⏎" : "Save ⏎";
      }

      function openEdit(p) {
        if (READONLY) return;
        if (!p || p.status !== "sold") return;
        if (SELECTED) cancelSelection();
        editPlayer = p;
        editTarget = p.owner;
        editPrice.value = p.price == null ? "" : String(p.price);
        editOverlay.hidden = false;
        renderEditDialog();
        editPrice.focus();
        editPrice.select();
      }

      function closeEdit() {
        editPlayer = null;
        editTarget = null;
        editOverlay.hidden = true;
        editErr.textContent = "";
        editWarn.textContent = "";
      }

      function saveEdit() {
        const p = editPlayer;
        if (!p) return;
        const parsed = readEditPrice();
        if (!parsed.ok) { editErr.textContent = parsed.msg; return; }
        if (editTarget == null) { editErr.textContent = `Pick a manager (1–${MANAGERS.length}).`; return; }

        const proj = projectFor(editTarget, p, parsed.price);
        if (proj.noRoom) { renderEditDialog(); return; }
        if (proj.overBudget) { renderEditDialog(); return; }

        const ownerChanged = p.owner !== editTarget;
        const priceChanged = p.price !== parsed.price;
        if (!ownerChanged && !priceChanged) { closeEdit(); return; }

        // One user action = one log entry = one undo step. A move that also
        // changes the price is logged as a single reassign carrying both.
        const type = ownerChanged ? "reassign" : "edit_price";
        const entry = applyChange(p, { status: "sold", owner: editTarget, price: parsed.price }, type);
        closeEdit();
        renderAll();
        toast(`#${entry.seq} ${TYPE_LABEL[type]} — ${describeEntry(entry)}.`);
      }

      function revertFromEdit() {
        const p = editPlayer;
        if (!p) return;
        const entry = releasePlayer(p);
        closeEdit();
        renderAll();
        if (entry) toast(`#${entry.seq} release — ${describeEntry(entry)}.`);
      }

      editSaveBtn.addEventListener("click", saveEdit);
      editCancelBtn.addEventListener("click", closeEdit);
      editRevertBtn.addEventListener("click", revertFromEdit);
      editPrice.addEventListener("input", renderEditDialog);
      editOverlay.addEventListener("mousedown", e => { if (e.target === editOverlay) closeEdit(); });

      /* ---------- transaction log view ---------- */

      const logView = document.createElement("div");
      logView.className = "logview";
      logView.hidden = true;

      const logHead = document.createElement("div");
      logHead.className = "log-head";
      const logCount = document.createElement("span");
      const logHint = document.createElement("span");
      logHint.className = "log-hint";
      logHint.textContent = READONLY
        ? "Newest first · the last " + LIVE_CFG.logLimit + " actions, mirrored from the host"
        : "Newest first · append-only, undos are recorded rather than erasing history · ⌘/Ctrl+Z to undo";
      logHead.append(logCount, logHint);

      const logList = document.createElement("div");
      logList.className = "log-list";

      logView.append(logHead, logList);

      // The manager id(s) an entry is about — same identity colour used
      // everywhere else, always paired here with describeEntry()'s text.
      function entryOwnerIds(e) {
        if (e.type === "reassign") {
          const ids = [];
          if (e.prev.owner != null) ids.push(e.prev.owner);
          if (e.next.owner != null && e.next.owner !== e.prev.owner) ids.push(e.next.owner);
          return ids;
        }
        if (e.next.status === "sold" && e.next.owner != null) return [e.next.owner];
        if (e.prev.status === "sold" && e.prev.owner != null) return [e.prev.owner];
        return [];
      }

      // Viewer: the host sends already-worded entries (describeEntry ran on
      // the host side) plus the manager ids to colour them with. No prev/next
      // snapshots cross the wire — there is nothing to undo from here.
      function renderRemoteLog() {
        const n = REMOTE_LOG.length;
        logCount.textContent = n
          ? `Last ${n} action${n > 1 ? "s" : ""}`
          : (LIVE.hasRemote ? "No actions yet" : "Waiting for the host…");

        if (!n) {
          const e = document.createElement("div");
          e.className = "log-empty";
          e.textContent = LIVE.hasRemote
            ? "Nothing has happened yet. Sales, unsold calls, edits, reassignments and undos all show up here."
            : "Nothing received from the host yet.";
          logList.replaceChildren(e);
          return;
        }

        const frag = document.createDocumentFragment();
        let alt = false;
        for (let i = n - 1; i >= 0; i--) {
          const e = REMOTE_LOG[i] || {};
          const row = document.createElement("div");
          row.className = "log-row" + (alt ? " alt" : "") + (e.undone ? " undone" : "");
          alt = !alt;

          const seq = document.createElement("span");
          seq.className = "log-seq";
          seq.textContent = "#" + (e.seq == null ? "?" : e.seq);

          const time = document.createElement("span");
          time.className = "log-time";
          time.textContent = isNum(e.ts) ? new Date(e.ts).toLocaleTimeString([], { hour12: false }) : "—";

          const type = document.createElement("span");
          type.className = "log-type t-" + (e.type || "");
          type.textContent = TYPE_LABEL[e.type] || e.type || "?";

          const what = document.createElement("span");
          what.className = "log-what";
          for (const id of (Array.isArray(e.owners) ? e.owners : [])) {
            const dot = document.createElement("span");
            dot.className = "log-owner-dot";
            const mgr = MANAGERS[id];
            if (mgr) dot.style.background = mgr.color;
            what.appendChild(dot);
          }
          what.appendChild(document.createTextNode(String(e.text || "")));

          row.append(seq, time, type, what);
          frag.appendChild(row);
        }
        logList.replaceChildren(frag);
      }

      function renderLog() {
        if (READONLY) { renderRemoteLog(); return; }
        const undone = LOG.filter(e => e.undoneBy != null).length;
        logCount.textContent = LOG.length
          ? `${LOG.length} action${LOG.length > 1 ? "s" : ""}${undone ? ` · ${undone} undone` : ""}`
          : "No actions yet";

        if (!LOG.length) {
          const e = document.createElement("div");
          e.className = "log-empty";
          e.textContent = "Nothing has happened yet. Sales, unsold calls, edits, reassignments and undos all show up here.";
          logList.replaceChildren(e);
          return;
        }

        const frag = document.createDocumentFragment();
        let alt = false;
        for (let i = LOG.length - 1; i >= 0; i--) {
          const e = LOG[i];
          const row = document.createElement("div");
          row.className = "log-row" + (alt ? " alt" : "") + (e.undoneBy != null ? " undone" : "");
          alt = !alt;

          const seq = document.createElement("span");
          seq.className = "log-seq";
          seq.textContent = "#" + e.seq;
          if (e.undoneBy != null) seq.title = `Undone by #${e.undoneBy}`;

          const time = document.createElement("span");
          time.className = "log-time";
          time.textContent = new Date(e.ts).toLocaleTimeString([], { hour12: false });

          const type = document.createElement("span");
          type.className = "log-type t-" + e.type;
          type.textContent = TYPE_LABEL[e.type] || e.type;

          const what = document.createElement("span");
          what.className = "log-what";
          for (const id of entryOwnerIds(e)) {
            const dot = document.createElement("span");
            dot.className = "log-owner-dot";
            const mgr = MANAGERS[id];
            if (mgr) dot.style.background = mgr.color;
            what.appendChild(dot);
          }
          what.appendChild(document.createTextNode(describeEntry(e)));

          row.append(seq, time, type, what);
          frag.appendChild(row);
        }
        logList.replaceChildren(frag);
      }

      /* ============================================================
         LIVE MIRRORING — payload out (host), merge in (viewer), and the
         connection status both roles read.
         ============================================================ */

      // What the host publishes. Deliberately small: this is written on every
      // single action, and the real log alone is over 200 KB.
      //   · per-player auction fields only, and only for players that aren't
      //     available — the set is republished whole every time, so "absent"
      //     unambiguously means available and 900 untouched rows cost nothing.
      //   · the current lot as an id, not a record. Viewers have players.json.
      //   · the last 20 log entries as finished text, for display. No prev/next
      //     snapshots: undo is host-local and viewers have nothing to undo.
      // Nothing derived goes over the wire — wallets, max bids, position and
      // club counts are all recomputed viewer-side from these fields.
      function buildLivePayload() {
        const players = [];
        for (const p of ALL) {
          if (p.status === "available") continue;
          const rec = { id: p.id, status: p.status };
          if (p.owner != null) rec.owner = p.owner;
          if (p.price != null) rec.price = p.price;
          players.push(rec);
        }

        const log = [];
        for (let i = Math.max(0, LOG.length - LIVE_CFG.logLimit); i < LOG.length; i++) {
          const e = LOG[i];
          log.push({
            seq: e.seq,
            ts: e.ts,
            type: e.type,
            text: describeEntry(e),
            owners: entryOwnerIds(e),
            undone: e.undoneBy != null
          });
        }

        return {
          schema: SCHEMA_VERSION,
          lot: SELECTED ? { id: SELECTED.id } : null,
          players,
          log
        };
      }

      // Viewer: merge the host's auction fields onto our own records. Every
      // player is reset first, so a release or an undo on the host clears here
      // too rather than leaving a ghost sale behind.
      function applyRemoteState(snapshot) {
        const s = snapshot && typeof snapshot === "object" ? snapshot : {};

        // Firebase hands arrays back as arrays and objects as objects, and
        // will drop an empty one entirely — normalise all three.
        const listOf = v => Array.isArray(v) ? v.filter(Boolean)
          : (v && typeof v === "object") ? Object.keys(v).map(k => v[k]).filter(Boolean)
            : [];

        for (const p of ALL) { p.status = "available"; p.owner = null; p.price = null; }

        let unknown = 0;
        for (const r of listOf(s.players)) {
          if (r.id == null) continue;
          const p = BY_ID.get(String(r.id));
          if (!p) { unknown++; continue; }
          const st = VALID_STATUS.has(r.status) ? r.status : "available";
          if (st === "sold") {
            const owner = Number.isInteger(r.owner) && MANAGERS[r.owner] ? r.owner : null;
            const price = isNum(r.price) ? r.price : null;
            // A half-formed sale would trip the invariant checker into a red
            // banner on every viewer; treat it as not-yet-sold instead and let
            // the host's next publish settle it.
            if (owner == null || price == null) continue;
            p.status = "sold"; p.owner = owner; p.price = price;
          } else if (st === "unsold") {
            p.status = "unsold";
          }
        }

        REMOTE_LOG = listOf(s.log);

        // SELECTED is what the lot panel and the wallet strip read, on both
        // roles — the viewer just never sets it from a click.
        const lotId = s.lot && s.lot.id != null ? String(s.lot.id) : null;
        SELECTED = lotId ? (BY_ID.get(lotId) || null) : null;

        checkInvariants();
        render({ preserveScroll: true });
        renderLiveStatus();

        // Once, not on every snapshot — it's a setup problem, not an event.
        if (unknown && !warnedPlayerMismatch) {
          warnedPlayerMismatch = true;
          toast(`Host is running a different player list — ${unknown} mirrored player${unknown === 1 ? "" : "s"} not found in this players.json.`, "warn");
        }
      }

      /* ---- connection status ----
         Silent staleness is the failure that matters: a phone propped up
         across the room showing a frozen screen looks exactly like one
         showing a live screen. So both facts are always on display — am I
         connected, and how old is what I'm looking at — and a disconnection
         gets a full-width bar as well as the chip. */

      function agoText(ts) {
        if (!ts) return null;
        const secs = Math.max(0, Math.round((Date.now() - ts) / 1000));
        if (secs < 60) return secs + "s ago";
        const mins = Math.floor(secs / 60);
        if (mins < 60) return mins + "m " + (secs % 60) + "s ago";
        return Math.floor(mins / 60) + "h " + (mins % 60) + "m ago";
      }

      function clockText(ts) {
        return ts ? new Date(ts).toLocaleTimeString([], { hour12: false }) : "never";
      }

      function setLiveStatus(kind, text, banner, bannerKind) {
        liveStatusEl.textContent = text;
        liveStatusEl.className = "live-status" + (kind ? " " + kind : "");
        if (banner) {
          liveBanner.textContent = banner;
          liveBanner.className = "live-banner" + (bannerKind ? " " + bannerKind : "");
          liveBanner.hidden = false;
        } else {
          liveBanner.hidden = true;
        }
      }

      function renderLiveStatus() {
        LIVE.refreshDerived();
        const stamp = READONLY ? LIVE.lastReceiveAt : LIVE.lastPublishAt;
        const age = agoText(stamp);
        const seen = stamp ? `${clockText(stamp)} (${age})` : "nothing yet";

        if (!LIVE.enabled) {
          const why = LIVE.reason || (LIVE.roomKey ? "not connected" : "no room");
          setLiveStatus("bad",
            READONLY ? "⚠ Not connected — " + why : "⦿ Mirroring off — " + why,
            READONLY ? "⚠ NOT CONNECTED — " + why + ". This screen is not updating." : null);
          return;
        }

        if (!READONLY) {
          if (LIVE.lostRoom) {
            setLiveStatus("bad", "⚠ Room " + LIVE.roomKey + " taken over — publishing stopped",
              "⚠ Another host has claimed room " + LIVE.roomKey + ". This tab has stopped publishing so the two don't interleave. The auction here is still saving locally — reload to take the room back once the other host is closed.");
            return;
          }
          if (LIVE.publishError) {
            setLiveStatus("bad", "⚠ Publish failed — " + LIVE.publishError + " · last sent " + seen, null);
            return;
          }
          if (!LIVE.connected) {
            setLiveStatus("bad", "⚠ Offline · last published " + seen, null);
            return;
          }
          setLiveStatus("ok", "● Live · room " + LIVE.roomKey + " · published " + (age || "nothing yet"), null);
          return;
        }

        if (!LIVE.connected) {
          setLiveStatus("bad", "⚠ Offline · data from " + seen,
            "⚠ DISCONNECTED — this is not live. Showing the auction as it was at " + clockText(stamp) + " (" + (age || "never received") + ").");
          return;
        }
        if (!LIVE.hasRemote) {
          setLiveStatus("pending", "● Connected · waiting for the host…", null);
          return;
        }
        if (!LIVE.hostPresent) {
          setLiveStatus("warn", "⚠ Host offline · data from " + seen,
            "⚠ The host is not connected. This is the auction as it was at " + clockText(stamp) + " (" + (age || "unknown") + ") and it will not update until they come back.",
            "warn");
          return;
        }
        setLiveStatus("ok", "● Live · room " + LIVE.roomKey + " · updated " + (age || "just now"), null);
      }

      /* ---------- seats ----------
         Purely additive: this bar is the only thing seats change about the
         screen at this stage. Nothing here touches a wallet, a squad, the max
         bid, the assignment bar or the keyboard flow — a seated viewer and an
         unseated one see exactly the same auction, and the host runs it the
         same way whether anyone has sat down or not. */

      const SEAT_DEFS = MANAGERS.map(m => ({ id: seatIdFor(m.id), manager: m.id, name: m.name }));

      function seatManager(seat) {
        return (seat && MANAGERS[seat.manager]) || null;
      }

      // Every seat write is a network round trip that can be refused by the
      // rules. Disable the button that started it, and put any refusal in
      // front of the host rather than only in the console.
      function seatAction(btn, run, okMsg) {
        btn.disabled = true;
        Promise.resolve()
          .then(run)
          .then(() => { if (okMsg) toast(okMsg); },
            err => toast("Seat change failed — " + errText(err), "warn"))
          .then(() => { btn.disabled = false; });
      }

      function seatButton(label, cls) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = cls || "mf-btn";
        b.textContent = label;
        return b;
      }

      function seatLabel(text) {
        const el = document.createElement("span");
        el.className = "seatbar-label";
        el.textContent = text;
        return el;
      }

      function seatNote(text) {
        const el = document.createElement("span");
        el.className = "seat-note";
        el.textContent = text;
        return el;
      }

      // A uid is 28 opaque characters. The seat name is the real identity, so
      // this is only ever a tiebreaker when two devices want the same seat.
      function shortUid(uid) { return String(uid || "").slice(0, 6); }

      function sortedSeatIds() {
        return Object.keys(LIVE.seats).sort((a, b) => {
          const ma = LIVE.seats[a], mb = LIVE.seats[b];
          return ((ma && ma.manager) || 0) - ((mb && mb.manager) || 0);
        });
      }

      function renderHostSeats(box) {
        const reqUids = Object.keys(LIVE.requests || {});

        // Pending approvals go first: they are the only thing on this bar
        // that someone else is waiting on.
        for (const uid of reqUids) {
          const req = LIVE.requests[uid];
          const seat = req && LIVE.seats[req.seat];
          if (!seat) continue;
          const chip = document.createElement("span");
          chip.className = "seat-req";
          const txt = document.createElement("span");
          txt.className = "seat-req-text";
          txt.textContent = `A device is asking for ${seat.name}`;
          const idEl = document.createElement("span");
          idEl.className = "seat-req-uid";
          idEl.textContent = shortUid(uid);
          const yes = seatButton("Approve");
          yes.addEventListener("click", () => seatAction(yes, () => LIVE.approveRequest(uid), `${seat.name} seated.`));
          const no = seatButton("Reject");
          no.addEventListener("click", () => seatAction(no, () => LIVE.rejectRequest(uid)));
          chip.append(txt, idEl, yes, no);
          box.appendChild(chip);
        }

        box.appendChild(seatLabel("Seats"));

        for (const id of sortedSeatIds()) {
          const seat = LIVE.seats[id];
          if (!seat) continue;
          const mgr = seatManager(seat);
          const chip = document.createElement("span");
          chip.className = "seat-chip";
          if (mgr) chip.style.borderLeftColor = mgr.color;

          const nameEl = document.createElement("span");
          nameEl.className = "seat-chip-name";
          nameEl.textContent = seat.name;

          const stateEl = document.createElement("span");
          stateEl.className = "seat-chip-state";
          chip.append(nameEl, stateEl);

          if (seat.uid) {
            const isMe = seat.uid === LIVE.uid;
            stateEl.className = "seat-chip-state held";
            stateEl.textContent = isMe ? "● this device" : "● " + shortUid(seat.uid);
            // The host is a manager too, so this releases their own seat by
            // exactly the same path as anyone else's.
            const rel = seatButton("Release");
            rel.addEventListener("click", () => seatAction(rel, () => LIVE.releaseSeat(id),
              `${seat.name} released — any device can now take it.`));
            chip.appendChild(rel);
          } else if (seat.open === true) {
            stateEl.className = "seat-chip-state open";
            stateEl.textContent = "open to claim";
            const take = seatButton("Take");
            take.addEventListener("click", () => seatAction(take, () => LIVE.takeSeatAsHost(id), `You are now ${seat.name}.`));
            chip.appendChild(take);
          } else {
            stateEl.textContent = "not claimed";
            const take = seatButton("Take");
            take.addEventListener("click", () => seatAction(take, () => LIVE.takeSeatAsHost(id), `You are now ${seat.name}.`));
            chip.appendChild(take);
          }
          box.appendChild(chip);
        }

        if (LIVE.seatError) box.appendChild(seatNote("⚠ " + LIVE.seatError));
      }

      function renderViewerSeats(box) {
        const seat = LIVE.mySeat();
        if (seat) {
          const mgr = seatManager(seat);
          const you = document.createElement("span");
          you.className = "seat-you";
          if (mgr) you.style.background = mgr.color;
          you.textContent = "You are " + seat.name;
          box.append(you, seatNote("Watching only — the host still runs every sale."));
          return true;
        }

        const req = LIVE.myRequest();
        if (req) {
          const asked = LIVE.seats[req.seat];
          box.appendChild(seatNote(`Asked for ${asked ? asked.name : "a seat"} — waiting for the host to approve.`));
          const cancel = seatButton("Cancel");
          cancel.addEventListener("click", () => seatAction(cancel, () => LIVE.cancelRequest()));
          box.appendChild(cancel);
          return true;
        }

        const ids = sortedSeatIds();
        if (!ids.length) return false;   // host hasn't created seats yet

        // Every seat already on a device is not a failure state — it is the
        // normal mid-auction picture — so the label says what this device can
        // actually do rather than inviting a tap that isn't there.
        const anyFree = ids.some(id => LIVE.seats[id] && !LIVE.seats[id].uid);
        box.appendChild(seatLabel(anyFree ? "Take a seat" : "Seats"));
        for (const id of ids) {
          const s = LIVE.seats[id];
          if (!s) continue;
          const mgr = seatManager(s);
          const chip = document.createElement("span");
          chip.className = "seat-chip";
          if (mgr) chip.style.borderLeftColor = mgr.color;

          if (s.uid) {
            // Taken. Shown rather than hidden so the list of names on a phone
            // matches the list of managers on the wall.
            const nameEl = document.createElement("span");
            nameEl.className = "seat-chip-name";
            nameEl.textContent = s.name;
            const st = document.createElement("span");
            st.className = "seat-chip-state";
            st.textContent = "taken";
            chip.append(nameEl, st);
          } else if (s.open === true) {
            // Already approved once and released by the host — no second
            // approval, this device just takes it.
            const b = seatButton(s.name);
            b.addEventListener("click", () => seatAction(b, () => LIVE.claimOpenSeat(id), `You are now ${s.name}.`));
            chip.appendChild(b);
            const st = document.createElement("span");
            st.className = "seat-chip-state open";
            st.textContent = "open";
            chip.appendChild(st);
          } else {
            const b = seatButton(s.name);
            b.addEventListener("click", () => seatAction(b, () => LIVE.requestSeat(id), "Asked the host for " + s.name + "."));
            chip.appendChild(b);
            const st = document.createElement("span");
            st.className = "seat-chip-state";
            st.textContent = "ask host";
            chip.appendChild(st);
          }
          box.appendChild(chip);
        }
        return true;   // seats exist, so there is always something worth showing
      }

      function renderSeats() {
        const box = document.createElement("div");

        if (!LIVE.enabled) { seatBar.hidden = true; return; }

        if (READONLY) {
          if (!LIVE.uid) {
            // Never blocks the auction view — the app is already fully
            // rendered behind this line; only the seat offer is waiting.
            if (LIVE.authError) box.appendChild(seatNote("Seats unavailable — could not sign in (" + LIVE.authError + ")."));
            else if (LIVE.seatsReady) box.appendChild(seatNote("Signing in…"));
            else { seatBar.hidden = true; return; }
          } else if (!renderViewerSeats(box)) {
            seatBar.hidden = true;
            return;
          }
        } else {
          if (!LIVE.seatsReady) { seatBar.hidden = true; return; }
          renderHostSeats(box);
        }

        seatBar.replaceChildren(...box.childNodes);
        seatBar.hidden = false;
      }

      function setView(v) {
        if (v === appView) return;
        if (v !== "auction" && SELECTED) cancelSelection();
        appView = v;
        auctionView.hidden = v !== "auction";
        teamsView.hidden = v !== "teams";
        logView.hidden = v !== "log";
        tabBtns.forEach(b => b.classList.toggle("on", b.dataset.view === v));
        if (v === "teams") renderTeams();
        if (v === "log") renderLog();
        // Focusing the search box pops the on-screen keyboard on a phone,
        // which is the last thing a viewer wants when they switch tabs.
        if (v === "auction" && !READONLY) search.focus();
      }
      tabBtns[0].classList.add("on");

      app.replaceChildren(roomBar, seatBar, liveBanner, saveBanner, invariantBanner, apptabs, auctionView, teamsView, logView, editOverlay, toastEl);

      // Sticky group headers sit just below the real header row. Two things
      // were wrong before: (1) the measurement used the <tr>, but the sticky
      // element is the <th> CELL (`thead th { position:sticky }`) — a row's own
      // box can differ fractionally from its cells' in table layout; (2)
      // rounding the result (up OR down) makes the offset wrong by construction
      // — CSS `top` accepts fractional px, so rounding either overlaps the
      // group header into the real header (too small) or, as it did here,
      // leaves a persistent hairline gap once stuck that shows a sliver of the
      // row behind it (too large). Use the exact fractional value, unrounded.
      const thBottom = htr.firstElementChild.getBoundingClientRect().bottom - main.getBoundingClientRect().top;
      document.documentElement.style.setProperty("--th-h", thBottom + "px");

      /* ---------- render (list) ---------- */

      const VIEW_PRED = {
        available: p => p.status === "available",
        unsold: p => p.status === "unsold",
        all: () => true
      };

      // preserveScroll: true for a refresh that doesn't change *which* players
      // match (an assignment/unsold/cancel just happened) — keeps the current
      // scroll position untouched. false (search/sort/filter changed) resets
      // the highlight to row 0 and scrolls it into view, as before.
      function render(opts) {
        const preserveScroll = !!(opts && opts.preserveScroll);
        const q = norm(search.value.trim());
        const cs = clubFilter.selected;
        const ps = posFilter.selected;
        const inView = VIEW_PRED[view];

        const list = ALL.filter(p =>
          inView(p) &&
          (cs.size === 0 || cs.has(p.club)) &&
          (ps.size === 0 || ps.has(p.position)) &&
          (q === "" || p._s.includes(q))
        );

        const mode = sortSel.value;
        // Grouped view already sections players by position with a header
        // per group — the per-row pill would just repeat that, so it's
        // hidden there and shown for every other sort mode.
        table.classList.toggle("grouped-view", mode === "group");
        const byName = (a, b) => a._n.localeCompare(b._n);
        if (mode === "group") {
          list.sort((a, b) =>
            (POS_IDX[a.position] - POS_IDX[b.position]) ||
            ((b.value || 0) - (a.value || 0)) ||
            byName(a, b));
        } else if (mode === "value") {
          list.sort((a, b) => ((b.value || 0) - (a.value || 0)) || byName(a, b));
        } else if (mode === "points") {
          list.sort((a, b) => ((b.points || 0) - (a.points || 0)) || byName(a, b));
        } else {
          list.sort(byName);
        }

        let groupCount = null;
        if (mode === "group") {
          groupCount = {};
          for (const p of list) groupCount[p.position] = (groupCount[p.position] || 0) + 1;
        }

        const frag = document.createDocumentFragment();
        let alt = false;
        let curPos = null;
        for (const p of list) {
          if (mode === "group" && p.position !== curPos) {
            curPos = p.position;
            alt = false;
            const gtr = document.createElement("tr");
            gtr.className = "grp";
            const gtd = document.createElement("td");
            gtd.colSpan = NCOL;
            gtd.textContent = `${curPos} · ${groupCount[curPos]}`;
            gtr.appendChild(gtd);
            frag.appendChild(gtr);
          }
          // status marker inside the name cell — sold carries the owner's
          // colour as a dot, always paired with their name as text next to it.
          const mk = p._mark;
          if (mk) {
            if (p.status === "sold") {
              const mgr = MANAGERS[p.owner];
              mk.className = "mark sold";
              const dot = document.createElement("span");
              dot.className = "mark-dot";
              if (mgr) dot.style.background = mgr.color;
              mk.replaceChildren(dot, document.createTextNode((mgr ? mgr.name : "?") + " · " + fmtMoney(p.price)));
            } else if (p.status === "unsold") {
              mk.className = "mark unsold";
              mk.replaceChildren(document.createTextNode("UNSOLD"));
            } else {
              mk.className = "mark";
              mk.replaceChildren();
            }
          }
          p._row.classList.toggle("soldrow", p.status === "sold");
          p._row.classList.toggle("unsoldrow", p.status === "unsold");
          p._row.classList.toggle("alt", alt);
          alt = !alt;
          frag.appendChild(p._row);
        }

        tbody.replaceChildren(frag);

        if (!list.length) {
          const tr = document.createElement("tr");
          const td = document.createElement("td");
          td.className = "empty";
          td.colSpan = NCOL;
          td.textContent = q || cs.size || ps.size
            ? "No players match the current filters."
            : (view === "unsold" ? "No unsold players yet." : "Nothing to show.");
          tr.appendChild(td);
          tbody.appendChild(tr);
        }

        viewList = list;
        if (preserveScroll) {
          // same filters, just refreshed data — keep pointing at roughly the
          // same slot (clamped, in case the list got shorter) without scrolling
          hi = viewList.length ? Math.min(hi, viewList.length - 1) : -1;
          applyHi(false);
        } else {
          hi = viewList.length ? 0 : -1;
          applyHi(true);
        }

        let nAvail = 0, nSold = 0, nUnsold = 0;
        for (const p of ALL) {
          if (p.status === "available") nAvail++;
          else if (p.status === "sold") nSold++;
          else if (p.status === "unsold") nUnsold++;
        }
        count.textContent = `${list.length} shown · ${nAvail} avail · ${nSold} sold · ${nUnsold} unsold`;

        renderWallets();
      }

      function applyHi(scroll) {
        if (hiRow) hiRow.classList.remove("hi");
        // The highlight only means anything next to ↑↓/Enter, and a viewer
        // has neither — an arbitrarily lit row would just read as "selected".
        if (READONLY) { hiRow = null; return; }
        hiRow = viewList[hi] ? viewList[hi]._row : null;
        if (hiRow) {
          hiRow.classList.add("hi");
          if (scroll) hiRow.scrollIntoView({ block: "nearest" });
        }
      }

      function moveHi(d) {
        if (!viewList.length) return;
        hi = Math.max(0, Math.min(viewList.length - 1, hi + d));
        applyHi(true);
      }

      /* ---------- wallets ---------- */

      function renderWallets() {
        const picking = SELECTED && (phase === "price" || phase === "manager");
        walletBar.classList.toggle("pick", !!picking);
        const cap = SELECTED ? (CONFIG.positionLimits[SELECTED.position] || [0, 0]) : null;
        const capMax = cap ? (cap[1] || 0) : 0;
        MANAGERS.forEach((m, i) => {
          const w = computeBid(m);
          const c = mgrCards[i];
          c._rem.textContent = fmtMoney(w.remaining);
          c._slots.textContent = w.slots + "/" + CONFIG.squadSize;
          c.classList.toggle("full", w.slots >= CONFIG.squadSize);
          // reserved even when blank (fix CSS on .mgr-pos keeps the line's height constant)
          if (SELECTED) {
            const pc = posCountOf(m, SELECTED.position);
            c._pos.textContent = capMax > 0 ? `${SELECTED.position} ${pc}/${capMax}` : `${SELECTED.position} ${pc}`;
            c._pos.classList.toggle("atcap", capMax > 0 && pc >= capMax);
          } else {
            c._pos.textContent = "";
            c._pos.classList.remove("atcap");
          }
          let blocked = false;
          if (phase === "manager" && pendingPrice != null) {
            blocked = w.slots >= CONFIG.squadSize || pendingPrice > w.remaining;
          }
          c.classList.toggle("blocked", blocked);
          c.classList.toggle("picked", pendingManager === i);
        });
        renderLotPanel();
        renderTeams();
        renderLog();
      }

      /* ---------- assignment bar render ---------- */

      function renderAssignBar() {
        if (!SELECTED) {
          assignBar.classList.remove("sel");
          assignWarn.textContent = "";
          return;
        }
        assignBar.classList.add("sel");

        playerBox.replaceChildren();
        playerBox.appendChild(photoCell(SELECTED));
        const nm = document.createElement("span");
        nm.textContent = SELECTED.name;
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = ` ${SELECTED.position} · ${SELECTED.club} · ${fmtVal(SELECTED.value)}`;
        playerBox.append(nm, meta);

        priceInput.disabled = phase === "manager";
        releaseBtn.hidden = SELECTED.status !== "unsold";
        stepHint.textContent = phase === "price"
          ? "type price → Enter"
          : `1–${MANAGERS.length} pick manager → Enter confirm`;
        confirmBtn.disabled = !(phase === "manager" && pendingManager != null);

        assignWarn.textContent = "";
        confirmBtn.textContent = "Confirm ⏎";
        if (phase === "manager" && pendingManager != null && pendingPrice != null) {
          const m = MANAGERS[pendingManager];
          const w = computeBid(m);
          if (w.state !== "full" && pendingPrice <= w.remaining && w.maxBid != null && pendingPrice > w.maxBid) {
            const slotsAfter = w.slotsLeft - 1;
            const leftAfter = w.remaining - pendingPrice;
            const avg = slotsAfter > 0 ? (leftAfter / slotsAfter).toFixed(1) : leftAfter;
            assignWarn.textContent =
              `⚠ ${pendingPrice} exceeds ${m.name}'s max bid (${w.maxBid}) — leaves ${leftAfter} for ` +
              `${slotsAfter} slot${slotsAfter === 1 ? "" : "s"} (avg ${avg}, min ${CONFIG.minBid}).`;
            confirmBtn.textContent = "Confirm anyway ⏎";
          }
        }
      }

      /* ---------- assignment actions ---------- */

      function setPhase(p) { phase = p; assignBar.dataset.phase = p; }

      function selectPlayer(p) {
        if (READONLY) return;      // the lot is whatever the host says it is
        if (!p) return;
        // A sold player isn't re-bid — picking one opens the edit/reassign
        // dialog instead, from wherever it was clicked.
        if (p.status === "sold") { openEdit(p); return; }
        SELECTED = p;
        pendingManager = null;
        pendingPrice = null;
        setPhase("price");
        priceInput.value = "";
        assignErr.textContent = "";
        renderAssignBar();
        renderWallets();
        LIVE.schedulePublish();      // a new lot is on the block
        priceInput.focus();
      }

      function commitPrice() {
        if (!SELECTED) return;
        const raw = priceInput.value.trim();
        const price = Number(raw);
        if (raw === "" || !Number.isFinite(price)) { assignErr.textContent = "Enter a price."; return; }
        if (price < CONFIG.minBid) { assignErr.textContent = `Price must be a number ≥ ${CONFIG.minBid}.`; return; }
        pendingPrice = price;
        assignErr.textContent = "";
        setPhase("manager");
        renderWallets();
        renderAssignBar();
        walletBar.focus();
      }

      function pickManager(i) {
        if (!SELECTED || phase !== "manager") return;
        pendingManager = i;
        assignErr.textContent = "";
        renderWallets();
        renderAssignBar();
      }

      function confirmAssignment() {
        if (!SELECTED || phase !== "manager") return;
        if (pendingManager == null) { assignErr.textContent = `Pick a manager (1–${MANAGERS.length}).`; return; }
        const m = MANAGERS[pendingManager];
        const w = walletOf(m);
        if (w.slots >= CONFIG.squadSize) {
          assignErr.textContent = `${m.name}'s squad is full (${CONFIG.squadSize}/${CONFIG.squadSize}).`;
          return;
        }
        if (pendingPrice > w.remaining) {
          assignErr.textContent = `${pendingPrice} over budget — ${m.name} has ${w.remaining} left.`;
          return;
        }
        applyChange(SELECTED, { status: "sold", owner: m.id, price: pendingPrice }, "sale");
        endSelection(true);
      }

      function markUnsold() {
        if (!SELECTED) return;
        applyChange(SELECTED, { status: "unsold", owner: null, price: null }, "unsold");
        endSelection(true);
      }

      // Back into the available pool — from a sale (price refunded, because
      // the wallet is re-derived from the records) or from unsold.
      function releasePlayer(p) {
        if (!p || p.status === "available") return null;
        return applyChange(p, { status: "available", owner: null, price: null }, "release");
      }

      function releaseSelected() {
        if (!SELECTED || SELECTED.status !== "unsold") return;
        const entry = releasePlayer(SELECTED);
        endSelection(true);
        if (entry) toast(`#${entry.seq} release — ${describeEntry(entry)}.`);
      }

      // Every derived figure is recomputed here; nothing is patched in place.
      function renderAll() {
        render({ preserveScroll: true });
      }

      // Both guarded because SELECTED means something different on a viewer:
      // it is the host's current lot, not a local pick. Switching tabs or
      // changing a filter routes through cancelSelection() — which would
      // otherwise blank the lot panel until the host's next publish.
      function cancelSelection() {
        if (READONLY) return;
        if (!SELECTED) return;
        endSelection(false);
      }

      function endSelection(clearSearch) {
        if (READONLY) return;
        SELECTED = null;
        pendingManager = null;
        pendingPrice = null;
        setPhase("browse");
        priceInput.value = "";
        priceInput.disabled = false;
        assignErr.textContent = "";
        if (clearSearch) search.value = "";
        renderAssignBar();
        // Keep the current scroll position — this refresh is just picking up
        // the sold/unsold status change, not a new search/sort/filter. Without
        // this, every confirm/unsold/cancel reset the highlight to row 0 and
        // dragged the whole list back toward the top mid-auction.
        render({ preserveScroll: true });
        LIVE.schedulePublish();      // lot cleared (or replaced by the result)
        search.focus();
      }

      function onCardClick(i) {
        if (READONLY) return;
        // mouse path: one click commits to that manager (validates first)
        if (!SELECTED) return;
        if (phase === "price") { commitPrice(); if (phase !== "manager") return; }
        pendingManager = i;
        confirmAssignment();
      }

      function refresh() {
        if (SELECTED) cancelSelection();
        else render();
      }

      /* ---------- keyboard routing ---------- */

      // Selection owns the keyboard once a player is picked.
      function routeKey(e) {
        if (editPlayer) return;              // the dialog owns the keyboard while it's open
        if (phase === "browse" || !SELECTED) return;
        if (SELECTED.status === "unsold" && (e.key === "r" || e.key === "R")) {
          e.preventDefault(); releaseSelected(); return;
        }
        if (e.key === "Escape") { e.preventDefault(); cancelSelection(); return; }
        if (e.key === "u" || e.key === "U") { e.preventDefault(); markUnsold(); return; }

        if (phase === "price") {
          if (e.key === "Enter") { e.preventDefault(); commitPrice(); }
          return;                              // digits / . / backspace fall through to the input
        }

        if (phase === "manager") {
          if (e.key === "Enter") { e.preventDefault(); confirmAssignment(); return; }
          if (e.key === "Backspace") {         // step back to editing the price
            e.preventDefault();
            pendingManager = null;
            setPhase("price");
            renderWallets();
            renderAssignBar();
            priceInput.focus();
            priceInput.select();
            return;
          }
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= MANAGERS.length) { e.preventDefault(); pickManager(n - 1); }
        }
      }
      // Every keyboard binding below is host-only. A viewer's keyboard does
      // nothing at all — not "does nothing useful", not registered.
      if (!READONLY) document.addEventListener("keydown", routeKey);

      // View toggle — guarded against text-entry fields so it never hijacks a
      // search query or price ("Toni Kroos" types a literal "t" into search).
      function isTypingTarget(el) {
        if (!el) return false;
        const tag = el.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || el.isContentEditable;
      }
      if (!READONLY) document.addEventListener("keydown", e => {
        if (editPlayer) return;
        if (isTypingTarget(e.target)) return;
        if (e.key === "t" || e.key === "T") {
          e.preventDefault();
          setView(appView === "teams" ? "auction" : "teams");
        } else if (e.key === "l" || e.key === "L") {
          e.preventDefault();
          setView(appView === "log" ? "auction" : "log");
        }
      });

      // Undo: ⌘/Ctrl+Z. A modifier chord, so it cannot fire from ordinary
      // typing — which is why it is safe to leave unguarded by focus, and it
      // needs to be: after a sale the focus is back in the search box, which
      // is exactly the moment you reach for undo.
      if (!READONLY) document.addEventListener("keydown", e => {
        if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
        if (e.key !== "z" && e.key !== "Z") return;
        if (e.shiftKey) return;              // no redo — leave ⇧⌘Z alone
        e.preventDefault();
        if (editPlayer) closeEdit();
        performUndo();
      });

      // Dialog-local keys. The price field holds focus while the dialog is
      // open (that's the field you usually came to change), so plain digits
      // must go to it — Alt+digit is the manager picker, matched on e.code
      // because Option+1 types "¡" on a Mac.
      if (!READONLY) document.addEventListener("keydown", e => {
        if (!editPlayer) return;
        if (e.key === "Escape") { e.preventDefault(); closeEdit(); return; }
        if (e.key === "Enter") { e.preventDefault(); saveEdit(); return; }
        for (let n = 1; n <= MANAGERS.length && n <= 9; n++) {
          const wanted = "Digit" + n;
          if (e.code !== wanted && e.key !== String(n)) continue;
          if (!e.altKey && e.target === editPrice) return;   // typing a price
          e.preventDefault();
          editTarget = MANAGERS[n - 1].id;
          renderEditDialog();
          return;
        }
      });

      /* ---------- wiring ---------- */

      search.addEventListener("input", () => { if (phase === "browse") render(); });
      search.addEventListener("keydown", e => {
        if (phase !== "browse") return;
        if (e.key === "ArrowDown") { e.preventDefault(); moveHi(1); }
        else if (e.key === "ArrowUp") { e.preventDefault(); moveHi(-1); }
        else if (e.key === "Enter") { e.preventDefault(); if (viewList[hi]) selectPlayer(viewList[hi]); }
        else if (e.key === "Escape") { if (search.value) { search.value = ""; render(); } }
      });

      sortSel.addEventListener("change", refresh);
      clubFilter.onChange = refresh;
      posFilter.onChange = refresh;

      confirmBtn.addEventListener("click", () => confirmAssignment());
      unsoldBtn.addEventListener("click", () => markUnsold());
      releaseBtn.addEventListener("click", () => releaseSelected());
      cancelBtn.addEventListener("click", () => cancelSelection());

      /* ---------- viewer-only chrome ---------- */

      if (READONLY) {
        // The lot panel and the wallet strip are what a viewer watches; the
        // 900-row table is reference material, and on a phone it pushes both
        // of them off the screen. Collapsed by default on a narrow viewport,
        // one tap away on any.
        const listToggle = document.createElement("button");
        listToggle.type = "button";
        listToggle.className = "mf-btn listtoggle";
        const narrow = window.matchMedia && window.matchMedia("(max-width: 760px)").matches;
        auctionView.classList.toggle("listcollapsed", narrow);
        const syncToggle = () => {
          listToggle.textContent = auctionView.classList.contains("listcollapsed") ? "Show players ▾" : "Hide players ▴";
        };
        listToggle.addEventListener("click", () => {
          auctionView.classList.toggle("listcollapsed");
          syncToggle();
        });
        syncToggle();
        toolbar.appendChild(listToggle);

        // Hidden rather than disabled: an assignment bar a viewer can't use is
        // just a row of dead controls taking up the space the lot panel wants.
        assignBar.hidden = true;
        search.placeholder = "Search name…";
        priceInput.disabled = true;
        editPrice.disabled = true;
      }

      /* ---------- live wiring ---------- */

      LIVE.onStatus = renderLiveStatus;
      LIVE.onSeats = renderSeats;
      if (READONLY) LIVE.onRemoteState = applyRemoteState;
      else LIVE.setPayloadBuilder(buildLivePayload);

      // Seat names come from CONFIG.managers via MANAGERS and from nowhere
      // else — there is no second place a name can be edited. Idempotent, so
      // a host reloading mid-auction re-asserts the list without disturbing
      // anyone already seated.
      if (!READONLY) LIVE.ensureSeats(SEAT_DEFS);
      renderSeats();

      // The status is time-relative ("published 4s ago") and a host going
      // quiet produces no event at all, so it has to be re-rendered on a
      // clock rather than only on change.
      renderLiveStatus();
      setInterval(renderLiveStatus, 1000);

      checkInvariants();     // baseline: the freshly loaded records must be consistent
      renderSaveStatus();
      if (restore) {
        toast(`Restored autosaved data from ${restore.savedAt ? new Date(restore.savedAt).toLocaleString() : "an earlier session"} (${LOG.length} log entr${LOG.length === 1 ? "y" : "ies"}).`);
      }
      render();
      if (READONLY) LIVE.schedulePublish = () => { };   // belt and braces: nothing here can write
      else { LIVE.schedulePublish(); search.focus(); }  // publish the starting position
    }

    /* ---------- multi-select filter (checkbox dropdown) ---------- */

    function multiFilter(label, values) {
      const api = { selected: new Set(), onChange: null };

      const wrap = document.createElement("div");
      wrap.className = "mf";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mf-btn";

      const panel = document.createElement("div");
      panel.className = "mf-panel";
      panel.hidden = true;

      const quick = document.createElement("div");
      quick.className = "mf-quick";
      const allLink = document.createElement("a");
      allLink.textContent = "All";
      const clrLink = document.createElement("a");
      clrLink.textContent = "Clear";
      quick.append(allLink, clrLink);
      panel.appendChild(quick);

      const boxes = [];
      for (const v of values) {
        const l = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = v;
        const sp = document.createElement("span");
        sp.textContent = v;
        l.append(cb, sp);
        panel.appendChild(l);
        boxes.push(cb);
        cb.addEventListener("change", () => {
          if (cb.checked) api.selected.add(v); else api.selected.delete(v);
          syncLabel();
          if (api.onChange) api.onChange();
        });
      }

      function syncLabel() {
        btn.textContent = api.selected.size ? `${label} (${api.selected.size}) ▾` : `${label} ▾`;
      }
      function setAll(on) {
        api.selected.clear();
        for (const cb of boxes) {
          cb.checked = on;
          if (on) api.selected.add(cb.value);
        }
        syncLabel();
        if (api.onChange) api.onChange();
      }

      allLink.addEventListener("click", () => setAll(true));
      clrLink.addEventListener("click", () => setAll(false));

      btn.addEventListener("click", e => {
        e.stopPropagation();
        document.querySelectorAll(".mf-panel").forEach(p => { if (p !== panel) p.hidden = true; });
        panel.hidden = !panel.hidden;
      });
      panel.addEventListener("click", e => e.stopPropagation());
      document.addEventListener("click", () => { panel.hidden = true; });
      document.addEventListener("keydown", e => { if (e.key === "Escape") panel.hidden = true; });

      syncLabel();
      wrap.append(btn, panel);
      api.el = wrap;
      return api;
    }
  </script>
</body>

</html>
